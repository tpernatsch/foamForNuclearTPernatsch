description: |
  TSSp model that computes the temperature-dependent stress threshold (TSSp)
  using an Arrhenius-type law with parameters calibrated from
  Kammenzind-type creep data.

  The model updates the internal field and applies the same law on boundary
  patches using the local boundary temperature field.
formulation: |
  The stress threshold $TSSp$ is modeled as an Arrhenius function of the
  local temperature, consistent with thermally activated creep formulations
  (see e.g. standard creep/viscoplasticity treatments in nuclear fuel
  performance literature).

  $$ TSSp(T) = TSSp_0 \exp\left(-\frac{Q_p}{R\,T}\right) $$

  where:

  - $TSSp(T)$ is the stress threshold field value (in the same units as
    $TSSp_0$), stored in OpenFOAM as $TSSp_$
  - $T$ is the local temperature, stored in OpenFOAM as the volScalarField
    $T$ (internal and boundary values)
  - $TSSp_0$ is the pre-exponential factor (constant)
  - $Q_p$ is the activation energy (constant)
  - $R$ is the universal gas constant, taken as $8.31446$ J/(mol·K)

  In the implementation, $TSSp_0=31000$ and $Q_p=25239$ are used, and the
  boundary values are computed patch-by-patch from the boundary temperature
  field $T$.
