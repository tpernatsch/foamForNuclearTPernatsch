description: |
  TSSP model for the DXD4 outer liner, based on the formulation reported by
  Gong et al. (2019) (https://doi.org/10.1016/j.jnucmat.2019.151757).

  This model updates the hydrogen-related thermodynamic state variable
  $TSSp$ (stored in the OpenFOAM field `TSSp_`) using an Arrhenius-type
  expression with a chemical-potential correction.
formulation: |
  The liner $TSSp$ is computed from a substrate reference $TSSp$ expression
  using a chemical potential difference, following the structure reported by
  Gong et al. (2019).

  $$ TSSp_{\mathrm{liner}}(T) =
     \left(TSSp_0 \exp\left(-\frac{Q_p}{R\,T}\right)\right)
     \exp\left(\frac{\mu_{H0}}{R\,T}\right) $$

  where the temperature $T$ is taken from the local cell temperature field
  `T` (and from patch boundary temperatures for boundary faces).

  - $TSSp_{\mathrm{liner}}$ is the liner $TSSp$ value (dimension as defined by the
    parent [@TSSpModel] implementation)
  - $TSSp_0$ is the pre-exponential factor (hard-coded in this implementation)
  - $Q_p$ is an activation energy-like parameter (hard-coded in this implementation)
  - $\mu_{H0}$ is the chemical potential difference (hard-coded in this implementation)
  - $R$ is the universal gas constant (8.31446 J/mol/K)
  - $T$ is the local temperature from the OpenFOAM field `T` (K)

  The update is performed for the provided cell address list `addr` and then
  boundary values are set consistently on patches that have a non-empty
  `TSSp_` boundary field.
