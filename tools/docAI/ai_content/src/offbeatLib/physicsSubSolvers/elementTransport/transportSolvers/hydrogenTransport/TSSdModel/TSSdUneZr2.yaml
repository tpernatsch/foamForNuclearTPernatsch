description: |
  TSSD (thermal stress strain damage) model for the Zr-2 substrate used in inner liner claddings.

  The temperature-dependent TSSD update follows the correlation reported by Une et al. (2009)
  (https://doi.org/10.1016/j.jnucmat.2009.01.017).
formulation: |
  The model updates the TSSD field $TSSd$ in each addressed cell using an Arrhenius-type
  temperature dependence, and applies the same relation on boundary patches using the
  local boundary temperature.

  $$ TSSd(T) = TSSd_0 \exp\left(-\frac{Q_d}{R\,T}\right) $$

  where:

  - $TSSd(T)$ is the updated TSSD value (stored in the OpenFOAM field $TSSd_$)
  - $TSSd_0$ is the pre-exponential factor ($1.43\times 10^5$)
  - $Q_d$ is the activation energy ($36686$)
  - $R$ is the universal gas constant ($8.31446$)
  - $T$ is the local temperature, taken from the OpenFOAM scalar field $T$:
    - $T = T_i$ in the cell interior (from $T_.internalField()$)
    - $T = T_p$ on boundary faces (from $T_.boundaryField()$)

  The implementation updates only the cells listed in the input address list and then
  calls $TSSd_.correctBoundaryConditions()$ to finalize boundary consistency.
