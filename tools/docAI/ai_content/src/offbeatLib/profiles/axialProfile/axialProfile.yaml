usage:
- comment: |
    Select a time-dependent tabulated axial profile and include the axial
    profile definition file.
  snippet: |
    axialProfile
    {
        type timeDependentTabulated;
        #include "axialProfile";
        axialInterpolationMethod step;
        burnupInterpolationMethod linear;
    }
- comment: |
    Select a constant tabulated axial profile and include the axial profile
    definition file.
  snippet: |-
    axialProfile
    {
        type constantTabulated;
        #include "axialProfile";
        axialInterpolationMethod step;
        burnupInterpolationMethod linear;
    }
