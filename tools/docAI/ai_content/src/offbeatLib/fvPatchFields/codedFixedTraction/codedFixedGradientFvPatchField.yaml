description: |
  Coded fixed-gradient boundary condition for OpenFOAM patch fields.

  This boundary condition constructs, at run time, a derived
  ``fixedGradientFvPatchField`` whose gradient is evaluated from user-supplied
  code (OpenFOAM ``dynamicCode``/``codedBase`` mechanism). The generated
  boundary condition is then used to evaluate the patch field.
formulation: |
  The underlying behavior is that of ``fixedGradientFvPatchField``:
  the patch field gradient is prescribed and the patch value is obtained
  consistently with the finite-volume discretization.

  In this coded variant, the prescribed gradient (and any related logic)
  is computed by executing user code, either provided inline via the
  ``code`` entry or loaded from the run-time modifiable ``system/codeDict``
  dictionary.

  The exact gradient expression is defined by the generated code and may
  depend on the current simulation state (e.g. time, fields, patch geometry).

  Variables and context are made available to the code through the
  ``dynamicCodeContext`` prepared by ``codedBase``.

  - $n$ is the patch normal direction used by the underlying
    ``fixedGradientFvPatchField`` implementation
  - $\nabla \phi$ is the prescribed gradient computed by the generated code
    (for the patch field variable $\phi$)
dictionary: neutronicsProperties
options: []
optionsLocations: []
externalOptions: []
admonitions: []
usage:
- comment: |
    Define a coded fixed-gradient boundary condition inline and generate a
    boundary condition named ``rampedFixedGradient``.
  snippet: |
    <patchName>
    {
        type            codedFixedGradient;
        value           uniform 0;
        name    rampedFixedGradient;   // name of generated BC

        code
        #{
            operator==(min(10, 0.1*this->db().time().value()));
        #};

        //codeInclude
        //#{
        //    #include "fvCFD.H"
        //#};

        //codeOptions
        //#{
        //    -I$(LIB_SRC)/finiteVolume/lnInclude
        //#};
    }
- comment: |
    Alternative form: omit the inline ``code`` section and provide the code
    in the run-time modifiable ``system/codeDict`` under the patch name.
  snippet: |-
    <patchName>
    {
        code
        #{
            operator==(min(10, 0.1*this->db().time().value()));
        #};
    }
