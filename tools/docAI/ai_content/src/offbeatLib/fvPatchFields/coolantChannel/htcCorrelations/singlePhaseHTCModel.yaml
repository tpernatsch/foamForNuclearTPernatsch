description: |
  Single-phase forced- and natural-convection heat transfer correlations.

  The model computes a heat transfer coefficient (HTC) $h$ [W/(m$^2\cdot$K)] from
  bulk coolant conditions and wall temperature using one of several built-in
  correlations.

  Supported models:
  - analyticalLaminar    : Nu = 4.36 (constant wall heat flux, laminar)
  - Gnielinski           : Gnielinski (1976) for turbulent pipe flow
  - DittusBoelter        : Dittus-Boelter for turbulent pipe flow
  - TRACETubeNC          : TRACE natural-convection tube correlation
  - TRACERodBundleNC     : TRACE natural-convection rod-bundle correlation
  - ChurchillChu         : Churchill-Chu (1975) natural convection on a vertical plate.
    The hydraulic diameter $D_H$ is interpreted as the plate height (vertical characteristic length).
formulation: |
  The HTC is computed as $h = \mathrm{Nu}\,k/D_H$ for forced convection models,
  or from mixed natural-convection correlations for the TRACE/Churchill-Chu
  options. Thermophysical properties are evaluated at the film temperature
  $T_{\mathrm{film}} = (T_0 + T_w)/2$ using IF97.

  $$ T_{\mathrm{film}} = \frac{T_0 + T_w}{2} $$

  - $T_0$ is the bulk coolant temperature [K]
  - $T_w$ is the wall temperature [K]
  - $T_{\mathrm{film}}$ is the film temperature used for property evaluation [K]

  The material properties are:
  - $\mu$ is the dynamic viscosity [Pa·s]
  - $\rho$ is the mass density [kg/m$^3]
  - $k$ is the thermal conductivity [W/(m·K)]
  - $\mathrm{Pr}$ is the Prandtl number [-]
  - $\beta$ is the volumetric thermal expansion coefficient [1/K]

  The Reynolds number is:
  $$ \mathrm{Re} = \frac{G\,D_H}{\max(\mu,\epsilon)} $$
  - $G$ is the mass flux [kg/(m$^2\cdot$s)]
  - $D_H$ is the hydraulic diameter / characteristic length [m]
  - $\epsilon$ is a small numerical floor (OpenFOAM: SMALL)

  For each correlation, the returned HTC is limited below by a small numerical
  value to avoid division-by-zero and non-physical zeros.

  Forced-convection models:
  - analyticalLaminar:
    $$ h = \max\!\left(\frac{k}{D_H}\,4.36,\epsilon\right) $$
  - Gnielinski (with $\mathrm{Re}_{\mathrm{eff}}=\max(\mathrm{Re},2300)$):
    $$ h = \max\!\left(\frac{k}{D_H}\,
    \frac{(0.5f)(\mathrm{Re}_{\mathrm{eff}}-1000)\mathrm{Pr}}
    {1+12.7\sqrt{0.5f}\left(\mathrm{Pr}^{2/3}-1\right)},\epsilon\right) $$
    $$ f = \left(1.58\ln(\mathrm{Re}_{\mathrm{eff}})-3.28\right)^{-2} $$
  - DittusBoelter:
    $$ h = \max\!\left(\frac{k}{D_H}\,0.023\,\mathrm{Re}^{0.8}\mathrm{Pr}^{0.4},\epsilon\right) $$

  Natural-convection TRACE/Churchill-Chu style (as implemented here for the
  TRACE tube/rod-bundle option):
  - $\Delta T = |T_w - T_0|$
  - $\nu = \mu/\max(\rho,\epsilon)$
  - $g$ is gravitational acceleration [m/s$^2$], taken as 9.80665

  The HTC is computed as the maximum of a turbulent-like and laminar-like
  natural-convection contribution:
  $$ h = \max\!\left(\max(h_{\mathrm{Turb}},h_{\mathrm{Lam}}),\epsilon\right) $$
  $$ h_{\mathrm{Turb}} = 0.1\frac{k}{D_H}\mathrm{Pr}^{1/3}
     \left(\frac{g\beta\Delta T\,D_H^3}{\max(\nu^2,\epsilon)}\right)^{1/3} $$
  $$ h_{\mathrm{Lam}} = 0.59\frac{k}{D_H}\mathrm{Pr}^{1/4}
     \left(\frac{g\beta\Delta T\,D_H^3}{\max(\nu^2,\epsilon)}\right)^{1/4} $$

  For Churchill-Chu, the implementation is selected via the model enum; the
  hydraulic diameter $D_H$ is interpreted as the vertical plate height.
