usage:
- comment: |
    Select the OFFBEAT user time unit in ``controlDict`` via the ``userTime``
    sub-dictionary. The default is seconds.
  snippet: |-
    userTime
    {
        // type is seconds by default
        type seconds;//hours;//days;
    }
