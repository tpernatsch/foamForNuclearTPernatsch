usage:
- comment: |
    Enable adjustable time-step control and specify bounds and relative
    increase limits in `controlDict`.
  snippet: |
    adjustableTimeStep true;

    maxDeltaT         1e6;
    minDeltaT         1e-6;

    maxRelativeDeltaTIncrease 1e9;
    minRelativeDeltaTDecrease 1e9;

    maxRelativePowerIncrease  0.25;
    maxRelativePowerDecrease  0.25;

    maxBurnupIncrease 0.1;
    maxAverageCreep   1e-4;
    maxMaximumCreep   1e-4;
    maxFGR            1e9;
- comment: |
    Enable adjustable output writing and provide the list of write times.
  snippet: "// Allow adjustable time-step writing or not \nadjustableWriteTimeStep         off;\n// writeTimeStepList\n//\
    \ (\n//  0.0\n//  91822464 \n//  92822464 \n//  100462464\n// );"
