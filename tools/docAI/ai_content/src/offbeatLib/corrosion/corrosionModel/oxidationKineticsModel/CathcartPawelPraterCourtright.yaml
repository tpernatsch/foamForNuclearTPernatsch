description: |
  High-temperature oxidation of Zircaloy-4 combining the intermediate-temperature
  Cathcart–Pawel correlation with the high-temperature Prater–Courtright correlation,
  as recommended by Schanz.

  The oxide-layer thickness is updated using a temperature-dependent effective
  Arrhenius form with correlation parameters selected by the current temperature.

  References:
  - G. Schanz, *Recommendations and Supporting Information on the Choice of
    Zirconium Oxidation Models in Severe Accident Codes*, Technical report
    FZKA 6827, Forschungszentrum Karlsruhe, 2003.
formulation: |
  The oxide-layer thickness $S$ (m) is advanced over a time step $\Delta t$ (s)
  using a temperature-dependent growth rate expressed in Arrhenius form.
  The effective parameters $(A_s, Q_s^R)$ are selected from the Cathcart–Pawel
  correlation at lower temperatures, interpolated in the intermediate range,
  and taken from the Prater–Courtright correlation at high temperatures.

  The update is:
  $$
  S = \sqrt{A_s \exp\!\left(-\frac{Q_s^R}{T_i}\right)\Delta t + S_0^2}
  $$

  where the correlation parameters are chosen as:
  - If $T_i < T_1$: $A_s=A_1$, $Q_s^R=Q_1^R$
  - If $T_1 \le T_i < T_2$: $A_s$ and $Q_s^R$ are obtained by interpolation
    between the two Arrhenius forms using
    $$
    y_1=\ln(A_1)-\frac{Q_1^R}{T_1},\quad
    y_2=\ln(A_2)-\frac{Q_2^R}{T_2}
    $$
    $$
    Q_s^R=\frac{y_1-y_2}{\left(1/T_2-1/T_1\right)},\quad
    A_s=\exp\!\left(y_1+\frac{Q_s^R}{T_1}\right)
    $$
  - If $T_i \ge T_2$: $A_s=A_2$, $Q_s^R=Q_2^R$

  Constants used by this implementation:
  - $A_1=2\cdot 1.12569\times 10^{-6}$
  - $Q_1^R=18062$
  - $T_1=1800$
  - $A_2=2.98116\times 10^{-3}$
  - $Q_2^R=28420$
  - $T_2=1900$

  Variables:
  - $S$ is the updated oxide-layer thickness (m)
  - $S_0$ is the oxide-layer thickness at the start of the time step (m)
  - $T_i$ is the current/intermediate oxidation temperature used in the correlation (K)
  - $T_b$ is an input argument (not used in this implementation)
  - $\phi$ is an input argument (not used in this implementation)
  - $\Delta t$ is the time step (s)
  - $A_s$ is the effective pre-exponential factor (model-dependent units)
  - $Q_s^R$ is the effective activation energy parameter (model-dependent units)
  - $T_1$ and $T_2$ are the lower/upper temperature bounds for switching/interpolation (K)
