description: |
  EPRI/KWU/C-E low-temperature oxidation model for zirconium alloys, taken
  from EPRI NP-2789.

  This class provides a correlation to update the oxide layer thickness $S$
  over a time step, using a temperature-dependent growth law with a
  pre-transition, transition, and post-transition regime.
formulation: |
  The oxide thickness evolution is computed from the EPRI/KWU/C-E
  low-temperature oxidation correlation (Waterside Corrosion of Zircaloy Fuel
  Rods, EPRI NP-2789). The model uses a transition oxide thickness
  $S_{\mathrm{trans}}(T_i)$ to switch between a cubic (pre-transition)
  growth law and a linear (post-transition) growth law.

  $$ S_{\mathrm{trans}} = 21.4 \exp\left(-\frac{Q_3}{R T_i} - 0.0117\,T_i\right) $$

  - $S$ is the updated oxide thickness, in m
  - $S_0$ is the oxide thickness at the beginning of the time step, in m
  - $T_i$ is the interface/oxidation temperature used by the correlation, in K
  - $T_b$ is provided to the API but not used by this implementation
  - $\phi$ is provided to the API but only used inside the $C_2$ coefficient
  - $dt$ is the time step, converted internally to days

  The time step is converted as:
  $$ dt_{\mathrm{days}} = \frac{dt_{\mathrm{seconds}}}{3600\cdot 24} $$

  The correlation uses:
  $$ C_1 = 1\times 10^{-18}\cdot 6.3\times 10^{9} \quad [\mathrm{m^3/day}] $$
  $$ C_2 = 1\times 10^{-6}\left(8.04\times 10^{7} + 2.59\times 10^{8}\,(7.46\times 10^{-15}\phi)^{0.24}\right)\quad [\mathrm{m/day}] $$

  with Arrhenius-type factors:
  $$ \exp\left(-\frac{Q_1}{R T_i}\right),\quad \exp\left(-\frac{Q_2}{R T_i}\right) $$
  where $R=1.9872$ cal/(mol·K) and $Q_1,Q_2,Q_3$ are taken from the
  EPRI NP-2789 correlation constants.

  Regime selection:

  - If $S_0 < S_{\mathrm{trans}}$:
    - Compute the time required to reach $S_{\mathrm{trans}}$ under the
      pre-transition law:
      $$ dt_{\mathrm{trans}} = \frac{S_{\mathrm{trans}}^3 - S_0^3}{C_1\exp\left(-\frac{Q_1}{R T_i}\right)} $$
    - If $dt_{\mathrm{trans}} \ge dt$ (no transition within the step):
      $$ S = \left(C_1\exp\left(-\frac{Q_1}{R T_i}\right)\,dt + S_0^3\right)^{1/3} $$
    - Else (transition occurs within the step):
      $$ S = S_{\mathrm{trans}} + C_2\exp\left(-\frac{Q_2}{R T_i}\right)\,dt_{\mathrm{post}} $$
      where $dt_{\mathrm{post}} = dt - dt_{\mathrm{trans}}$.
  - Else ($S_0 \ge S_{\mathrm{trans}}$), use the post-transition linear law:
    $$ S = S_0 + C_2\exp\left(-\frac{Q_2}{R T_i}\right)\,dt $$

  Notes:
  - The implementation uses $T_i$ for the Arrhenius terms and computes
    $S_{\mathrm{trans}}$ from $T_i$.
  - $T_b$ is accepted by the API but not used in this specific implementation.
