description: |
  High-temperature oxidation model for Zircaloy-4 that combines the intermediate
  temperature correlation of Leistikov with the high-temperature Prater and
  Courtright correlation, following the recommendations of Schanz.

  The model provides an update for the oxide layer thickness $S$ (m) based on
  the current temperature $T_i$ and the time increment $\Delta t$.

  Reference:
  G. Schanz, *Recommendations and Supporting Information on the Choice of
  Zirconium Oxidation Models in Severe Accident Codes*, Technical report
  FZKA 6827, Forschungszentrum Karlsruhe, 2003.
formulation: |
  The oxide thickness is advanced using a parabolic oxidation law of the form
  $S^2 \sim \int A \exp(-Q_R/T)\,dt$, with a temperature-dependent Arrhenius
  prefactor $A_s$ and activation energy $Q_s^R$.
  For $T_i$ below the intermediate-model threshold, the Leistikov parameters are
  used; for $T_i$ above the high-temperature threshold, the Prater–Courtright
  parameters are used; between the thresholds, the activation energy and
  prefactor are smoothly interpolated in an Arrhenius-consistent manner.

  $$ S = \sqrt{ A_s \exp\!\left(-\frac{Q_s^R}{T_i}\right)\Delta t + S_0^2 } $$

  where:

  - $S$ is the updated oxide layer thickness, in m
  - $S_0$ is the oxide layer thickness at the beginning of the time step, in m
  - $T_i$ is the oxidation temperature used by the correlation, in K
  - $\Delta t$ is the time step, in s
  - $A_s$ is the Arrhenius prefactor (temperature-dependent via model selection), in s$^{-1}$ (as used by the correlation)
  - $Q_s^R$ is the effective activation energy divided by the gas constant (temperature-dependent), in K
  - $\phi$ is an input argument to the interface (not used by this implementation)

  Temperature-dependent correlation selection:

  $$ T_i < T_1:\quad A_s=A_1,\; Q_s^R=Q_1^R $$
  $$ T_1 \le T_i < T_2:\quad
     Q_s^R=\frac{y_1-y_2}{\left(1/T_2-1/T_1\right)},\;
     A_s=\exp\!\left(y_1+\frac{Q_s^R}{T_1}\right) $$
  $$ T_i \ge T_2:\quad A_s=A_2,\; Q_s^R=Q_2^R $$

  with:

  - $T_1=1800$ K, $A_1=7.82\times 10^{-6}$, $Q_1^R=20214$
  - $T_2=1900$ K, $A_2=2.98116\times 10^{-3}$, $Q_2^R=28420$
  - $y_1=\ln(A_1)-Q_1^R/T_1$
  - $y_2=\ln(A_2)-Q_2^R/T_2$
