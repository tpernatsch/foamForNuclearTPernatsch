description: |
  Gap gas model class that prescribes **time-dependent gap gas
  composition and pressure** from externally provided data.

  This model is intended for coupling with external fuel performance codes
  or for replaying precomputed gap gas histories.

  A snapshot of the gap gas state at the initial time must still be provided
  via the `gapGas` file.
optionsLocations:
- name: gapGasOptions
  in: solverDict
- name: gapGas
  in: timeDirectory
options:
- key: timePoints
  location: gapGasOptions
  type: list[scalar]
  required: true
  description: |
    Time points corresponding to the tabulated gap gas data.
- key: gapPressures
  location: gapGasOptions
  type: list[scalar]
  required: true
  description: |
    Gap gas pressures corresponding to `timePoints` (Pa).
- key: Ar
  location: gapGasOptions
  type: list[scalar]
  required: true
  description: |
    Argon mass fraction history.
- key: He
  location: gapGasOptions
  type: list[scalar]
  required: true
  description: |
    Helium mass fraction history.
- key: Kr
  location: gapGasOptions
  type: list[scalar]
  required: true
  description: |
    Krypton mass fraction history.
- key: Ne
  location: gapGasOptions
  type: list[scalar]
  required: true
  description: |
    Neon mass fraction history.
- key: Rn
  type: list[scalar]
  required: true
  description: |
    Radon mass fraction history.
- key: Xe
  location: gapGasOptions
  type: list[scalar]
  required: true
  description: |
    Xenon mass fraction history.
- key: timeInterpolationMethod
  location: gapGasOptions
  type: word
  required: false
  default: linear
  description: |
    Time interpolation scheme between tabulated values.
- key: outOfBoundsMethod
  location: gapGasOptions
  type: word
  required: false
  default: error
  description: |
    Behaviour when the requested time is outside the tabulated range.
externalOptions:
- key: massFractions
  path: <timeDirectory>.uniform.gapGas
  type: dictionary[str, scalar]
  required: true
  description: |
    Initial gas mass fractions for:
    `Ar`, `He`, `Kr`, `Ne`, `Rn`, `Xe`.
- key: gasPressure
  path: <timeDirectory>.uniform.gapGas
  type: scalar
  required: false
  description: |
    Initial gas pressure (Pa).
usage:
- comment: |
    Activate time-tabulated gap gas histories.
  snippet: |-
    gapGas timeTabulated;

    gapGasOptions
    {
        timePoints   ( 0 100 1000 );
        gapPressures ( 1e5 5e5 1e6 );

        Ar ( 0 0 0 );
        He ( 1 0.99 0.85 );
        Kr ( 0 0.01 0.10 );
        Ne ( 0 0 0 );
        Rn ( 0 0 0 );
        Xe ( 0 0.00 0.05 );

        timeInterpolationMethod linear;
    }
dictionary: gapGasProperties
ai_provenance:
  model: gpt-5.4-nano
  date: '2026-06-26'
  modified_sections:
  - options
  - dictionary
