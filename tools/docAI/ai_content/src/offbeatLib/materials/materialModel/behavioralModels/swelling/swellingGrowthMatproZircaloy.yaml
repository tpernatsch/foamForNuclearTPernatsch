description: |
  Class modelling the irradiation growth phenomenon according to Matpro
  correlations.
options:
- key: fastFluenceName
  type: word
  required: false
  default: fastFluence
  description: |
    Name of the fast fluence field (looked up as a volScalarField).
- key: coldWork
  type: scalar
  required: false
  default: 0.0
  description: |
    Cold work indicator used by the model.
- key: A
  type: scalar
  required: false
  default: 1.407e-16
  description: |
    Matpro correlation parameter.
- key: par1
  type: scalar
  required: false
  default: 240.8
  description: |
    Matpro correlation parameter.
- key: fz
  type: scalar
  required: false
  default: 0.05
  description: |
    Matpro correlation parameter.
usage:
- comment: |
    Example selection of `ZircaloyMatpro`.
  snippet: |-
    materials
    {
        clad
        {
            type Zircaloy;

            swelling
            {
                type ZircaloyMatpro;
                // fastFluenceName fastFluence;
                // coldWork 0.0;
                // A 1.407e-16;
                // par1 240.8;
                // fz 0.05;
            }
        }
    }
dictionary: swelling
ai_provenance:
  model: gpt-5.4-nano
  date: '2026-06-26'
  modified_sections:
  - options
  - dictionary
