description: |
  Class modelling the void swelling phenomenon for HastelloyN cladding
  material according to Wright and Sham correlations.
options:
- key: fastFluenceName
  type: word
  required: false
  default: fastFluence
  description: |
    Name of the fast fluence field (looked up as a `volScalarField` in the mesh).
- key: par1
  type: scalar
  required: false
  default: 0.9845
  description: |
    Wright-Sham correlation parameter used in the fast-fluence term.
- key: par2
  type: scalar
  required: false
  default: 0.4385
  description: |
    Wright-Sham correlation parameter used as the exponent of the fast-fluence term.
- key: par3
  type: scalar
  required: false
  default: -0.981
  description: |
    Wright-Sham correlation parameter used as the constant offset in the fast-fluence term.
- key: par4
  type: scalar
  required: false
  default: 490.0
  description: |
    Wright-Sham correlation parameter used in the temperature-dependent term.
usage:
- comment: |
    Example selection of `HastelloyNWrightSham`.
  snippet: |-
    materials
    {
        clad
        {
            type HastelloyN;

            swelling
            {
                type HastelloyNWrightSham;
                // fastFluenceName fastFluence;
                // par1 9.845e-1;
                // par2 4.385e-1;
                // par3 -9.81e-1;
                // par4 490.;
            }
    }
ai_provenance:
  model: gpt-5.4-nano
  date: '2026-06-26'
  modified_sections:
  - options
