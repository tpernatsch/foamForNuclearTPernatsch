description: |
  The `SiCParfume` conductivity model provides a temperature-dependent thermal
  conductivity correlation for SiC based on PARFUME.

  Parameters can optionally be provided in the `conductivity` sub-dictionary.
  If not provided, the default values embedded in the model are used.
options:
- key: par1
  type: scalar
  required: false
  default: 17885.0
  description: |
    PARFUME correlation parameter used in the form $k(T)=\frac{par1}{T}+par2$, where $T$ is the temperature in Kelvin.
- key: par2
  type: scalar
  required: false
  default: 2.0
  description: |
    PARFUME correlation parameter used in the form $k(T)=\frac{par1}{T}+par2$, where $T$ is the temperature in Kelvin.
usage:
- comment: |
    Example selection using a `conductivity` sub-dictionary in the `solverDict`.
  snippet: |-
    materials
    {
        structure
        {
            material SiC;

            conductivity
            {
                type SiCParfume;

                // Optional overrides
                // par1 17885.0;
                // par2 2.0;
            }
        }
    }
ai_provenance:
  model: gpt-5.4-nano
  date: '2026-06-26'
  modified_sections:
  - options
