description: |
  Class modelling Young Modulus of HN from work of Watrous.
options:
- key: par1
  type: scalar
  required: false
  default: 9.944e-08
  description: |
    Parameter $p_1$ used in the Watrous polynomial fit (set by ``par1``).
- key: par2
  type: scalar
  required: false
  default: 0.0001178
  description: |
    Parameter $p_2$ used in the Watrous polynomial fit (set by ``par2``).
- key: par3
  type: scalar
  required: false
  default: 0.1033
  description: |
    Parameter $p_3$ used in the Watrous polynomial fit (set by ``par3``).
- key: par4
  type: scalar
  required: false
  default: 220.9
  description: |
    Parameter $p_4$ used in the Watrous polynomial fit (set by ``par4``).
usage:
- comment: |
    Example selection of the `HastelloyNWatrous` thermalExpansion model.
  snippet: |-
    materials
    {
      cladding
      {
        type HastelloyN;
        thermalExpansion
        {
          type HastelloyNWatrous;
          // par1 9.944e-08;
          // par2 1.178e-4;
          // par3 1.033e-1;
          // par4 220.9;
        }
      }
    }
ai_provenance:
