description: |
  Class modelling the Young's modulus of 15-15 Ti using the Tobbe correlation
  (1975).
options:
- key: par1
  type: scalar
  required: false
  default: 202.7
  description: |
    Parameter $p_1$ in the Tobbe correlation, used as the constant term in
    $E = (p_1 - p_2 \, T_i)\,10^9$, where $T_i$ is the temperature in °C
    (i.e. $T_i = T - 273.15$). Set by the ``par1`` entry in the
    ``YoungModulus`` sub-dictionary (or directly in the model dictionary for
    retro-compatibility).
- key: par2
  type: scalar
  required: false
  default: 0.08167
  description: |
    Parameter $p_2$ in the Tobbe correlation, used as the linear
    temperature coefficient in $E = (p_1 - p_2 \, T_i)\,10^9$, where $T_i$ is
    the temperature in °C (i.e. $T_i = T - 273.15$). Set by the ``par2``
    entry in the ``YoungModulus`` sub-dictionary (or directly in the model
    dictionary for retro-compatibility).
usage:
- comment: |
    Example selection of the `Steel1515TiTobbe` thermalExpansion model.
  snippet: |-
    materials
    {
      cladding
      {
        type Steel1515Ti;
        thermalExpansion
        {
          type Steel1515TiTobbe;
          // par1 202.7;
          // par2 81.67e-3;
        }
      }
    }
ai_provenance:
  model: gpt-5.4-nano
  date: '2026-06-26'
  modified_sections:
  - options
