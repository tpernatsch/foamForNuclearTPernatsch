description: |
  The `BufferParfume` conductivity model provides the thermal conductivity of
  the TRISO buffer layer as a function of its density.

  The model reads the density field (by default `rho`) and uses an initial and a
  theoretical density, together with an initial conductivity and a conductivity
  at theoretical density.
options:
- key: densityName
  type: word
  required: false
  default: rho
  description: |
    Name of the density field looked up in the mesh.
- key: initialDensity
  type: scalar
  required: false
  default: 1000.0
  description: |
    Initial density of the buffer material used by the model.
- key: theoreticalDensity
  type: scalar
  required: false
  description: |
    Theoretical density of the buffer material.

    Optional override: if not provided in the `conductivity` sub-dictionary,
    it is read from the material base/composition dictionary (recommended).
- key: initialConductivity
  type: scalar
  required: false
  default: 0.5
  description: |
    Initial thermal conductivity of the buffer material.
- key: theoreticalConductivity
  type: scalar
  required: false
  default: 4.0
  description: |
    Thermal conductivity at theoretical density.
usage:
- comment: |
    Example selection using a `conductivity` sub-dictionary in the `solverDict`.
  snippet: |-
    materials
    {
        buffer
        {
            material Buffer;

            // Recommended: shared material property in base/composition dict
            theoreticalDensity 2250;

            conductivity
            {
                type BufferParfume;

                // Optional
                densityName             rho;
                initialDensity          1000;
                initialConductivity     0.5;
                theoreticalConductivity 4.0;

                // Optional override (otherwise read from base/composition)
                // theoreticalDensity 2250;
            }
        }
    }
ai_provenance:
  model: gpt-5.4-nano
  date: '2026-06-11'
  modified_sections:
  - usage
  formulation_added: true
formulation: |
  The buffer thermal conductivity is assumed to scale linearly with the buffer
  density between an initial state and a theoretical (fully compacted) state.
  This is a constitutive closure used in the conductivityModel framework
  (cf. Duderstadt & Hamilton for effective transport closures; Todreas & Kazimi
  for effective property modeling in fuel performance codes).

  $$ k(\rho) = k_{\text{init}} + \left(k_{\text{theo}} - k_{\text{init}}\right)
  \frac{\rho - \rho_{\text{init}}}{\rho_{\text{theo}} - \rho_{\text{init}}} $$

  - $k(\rho)$ is the buffer thermal conductivity (OpenFOAM field `sf`, W/m-K)
  - $\rho$ is the local buffer density (OpenFOAM field `rho_`, kg/m^3)
  - $\rho_{\text{init}}$ is the initial density used to anchor the model (input `initialDensity`)
  - $\rho_{\text{theo}}$ is the theoretical/target density used to anchor the model (input `theoreticalDensity`)
  - $k_{\text{init}}$ is the initial thermal conductivity at $\rho_{\text{init}}$ (input `initialConductivity`)
  - $k_{\text{theo}}$ is the thermal conductivity at $\rho_{\text{theo}}$ (input `theoreticalConductivity`)
