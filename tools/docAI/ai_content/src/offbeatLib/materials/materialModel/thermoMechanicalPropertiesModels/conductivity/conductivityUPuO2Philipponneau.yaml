description: |
  Thermal conductivity correlation for MOX fuel (U-Pu-O₂) based on the
  formulation by Philipponneau.

  Note: in this correlation the MOX conductivity is independent of the Pu
  content.

  Note 2: this correlation is valid for temperatures $500\,\mathrm{K} < T < T_\mathrm{m}$,
  where $T_\mathrm{m}$ is the melting temperature.
options:
- key: densityFraction
  type: scalar
  required: false
  default: 0.95
  description: |
    Fraction of theoretical density used by the correlation.

    Note: the source code uses a porosity cutoff of $0.95$ (i.e. it applies
    $\min(\phi, 0.95)$), but it does not read an input parameter named
    ``densityFraction``. The correlation parameters read from the input
    dictionary are ``burnupName`` (default ``Bu``), and optionally ``B`` and
    ``C`` (either directly from the top-level dictionary or from the
    sub-dictionary ``conductivity``).
usage:
- comment: |
    Example selection of the Philipponneau conductivity correlation for MOX fuel in the `solverDict`.
  snippet: "materials\n{\n    fuel\n    {\n        type UPuO2;\n        \n        conductivity\n        {\n            type\
    \ UPuO2Philipponneau;\n\n            // Optional override\n            // densityFraction 0.95;\n        }\n    }\n}"
ai_provenance:
  model: gpt-5.4-nano
  date: '2026-06-26'
  modified_sections:
  - description
  - options
