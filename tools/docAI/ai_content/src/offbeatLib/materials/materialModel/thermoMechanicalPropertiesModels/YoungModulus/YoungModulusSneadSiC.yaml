description: |
  Class modelling Young Modulus of SiC from Snead et al. work:
  L. L. Snead, T. Nozawa, Y. Katoh, T.-S. Byun, S. Kondo, and D. A. Petti.
  Handbook of sic properties for fuel performance modeling.
  Journal of Nuclear Materials, 371:329–377, 2007.
options:
- key: B
  type: scalar
  required: false
  default: 0.04e9
  description: |
    Snead model parameter $B$ (units consistent with $E$), used in
    $E = E_0 \\, \\exp(-C \\, V_p) - B \\, T \\, \\exp(-T_0/T)$.
- key: C
  type: scalar
  required: false
  default: 0.0
  description: |
    Snead model parameter $C$ used in
    $E = E_0 \\, \\exp(-C \\, V_p) - B \\, T \\, \\exp(-T_0/T)$.
- key: E0
  type: scalar
  required: false
  default: 460e9
  description: |
    Snead model parameter $E_0$ used in
    $E = E_0 \\, \\exp(-C \\, V_p) - B \\, T \\, \\exp(-T_0/T)$.
- key: T0
  type: scalar
  required: false
  default: 962.0
  description: |
    Snead model parameter $T_0$ used in
    $E = E_0 \\, \\exp(-C \\, V_p) - B \\, T \\, \\exp(-T_0/T)$.
usage:
- comment: |
    Example selection of the `SiCSnead` thermalExpansion model.
  snippet: |-
    materials
    {
      SiC
      {
        type SiC;
        thermalExpansion
        {
          type SiCSnead;
          // B 0.04e9;
          // C 0.0;
          // E0 460e9;
          // T0 962.0;
        }
      }
    }
dictionary: neutronicsProperties
ai_provenance:
  model: gpt-5.4-nano
  date: '2026-06-26'
  modified_sections:
  - description
  - options
  - dictionary
