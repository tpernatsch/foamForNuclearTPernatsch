description: |
  Correlation for Zircaloy heat capacity from Iaea.
  <a href="https://www-pub.iaea.org/MTCD/publications/PDF/te_1496_web.pdf">Click here</a>
  for the related Iaea publication.
options:
- key: par1
  type: scalar
  required: false
  default: 255.66
  description: |
    Model parameter $p_1$.
- key: par2
  type: scalar
  required: false
  default: 0.1024
  description: |
    Model parameter $p_2$.
- key: par3
  type: scalar
  required: false
  default: 597.1
  description: |
    Model parameter $p_3$.
- key: par4
  type: scalar
  required: false
