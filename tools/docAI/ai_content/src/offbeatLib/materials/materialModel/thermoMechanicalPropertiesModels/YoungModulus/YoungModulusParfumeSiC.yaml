formulation: |
  The model computes the temperature-dependent Young modulus of SiC, $E(T)$, using a piecewise interpolation between tabulated Parfume reference points. The implementation updates the provided scalar field of Young modulus based on the local temperature field (see OpenFOAM field-name conventions: $T$ and output $E$).
  $$ E(T) =
  \begin{cases}
  E_1, & T \le T_1 \\
  E_1 + (E_2-E_1)\dfrac{T-T_1}{T_2-T_1}, & T_1 < T \le T_2 \\
  E_2 + (E_3-E_2)\dfrac{T-T_2}{T_3-T_2}, & T_2 < T \le T_3 \\
  E_3 + (E_4-E_3)\dfrac{T-T_3}{T_4-T_3}, & T_3 < T \le T_4 \\
  E_4, & T > T_4
  \end{cases} $$
  - $E(T)$ is the Young modulus (updated in the output scalar field, e.g. $sf$) [Pa]
  - $T$ is the local temperature from the input scalar field $T$ [K]
  - $T_1,T_2,T_3,T_4$ are the Parfume reference temperatures (model parameters $temp1$–$temp4$) [K]
  - $E_1,E_2,E_3,E_4$ are the Parfume reference Young moduli (model parameters $E1$–$E4$) [Pa]
  This is a purely empirical interpolation of material property data (cf. typical property-correlation usage in reactor thermal-mechanics workflows; see Duderstadt & Hamilton and Todreas & Kazimi for general coupling context, though the specific interpolation is data-driven).
