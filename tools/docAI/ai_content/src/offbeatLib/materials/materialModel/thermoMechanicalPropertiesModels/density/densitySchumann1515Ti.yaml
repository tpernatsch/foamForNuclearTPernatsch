description: |
  Class modelling the density evolution of 15-15Ti cladding material through
  the Schumann (1970) correlation.
options:
- key: par1
  type: scalar
  required: false
  default: 7900.0
  description: |
    Legacy parameter for the reference density $\rho_0$ (read from the optional
    sub-dictionary `density` as `par1`). If `density` is not present, the model
    uses the built-in default $\rho_0 = 7900$ kg/m$^3$.
usage:
- comment: |
    Example selection of the `Steel1515TiSchumann` density model.
  snippet: |-
    materials
    {
      cladding
      {
        type Steel1515Ti;
        density
        {
          type Steel1515TiSchumann;
          // par1 7900.0;
        }
      }
    }
ai_provenance:
  model: gpt-5.4-nano
  date: '2026-06-26'
  modified_sections:
  - options
