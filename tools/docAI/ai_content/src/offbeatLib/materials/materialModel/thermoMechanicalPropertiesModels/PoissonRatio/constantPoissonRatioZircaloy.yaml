description: |
  Class to set Zircaloy Poisson's Ratio to a constant input value.
options:
- key: PoissonRatioValue
  type: scalar
  required: false
  default: 0.3
  description: |
    Constant Poisson ratio value. Read from the ``PoissonRatio`` sub-dictionary if present (retro-compatibility), otherwise read directly from the model dictionary.
usage:
- comment: |
    Example selection of the `ZircaloyConstant` thermalExpansion model.
  snippet: |-
    materials
    {
      cladding
      {
        type Zircaloy;
        thermalExpansion
        {
          type ZircaloyConstant;
          // PoissonRatioValue 0.3;
        }
      }
    }
ai_provenance:
  model: gpt-5.4-nano
  date: '2026-06-26'
  modified_sections:
  - options
