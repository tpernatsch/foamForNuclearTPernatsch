description: |
  Model for constant thermal expansion coefficient. The value is read from
  dictionary.
options:
- key: value
  type: scalar
  required: true
  description: |
    Constant linear thermal expansion coefficient $\alpha$ [1/K].
usage:
- comment: |
    Example selection of the `constant` thermalExpansion model.
  snippet: |-
    materials
    {
      fuel
      {
        type UO2;
        thermalExpansion
        {
          type constant;
          value <scalar>;
        }
      }
    }
formulation: |
  The thermal expansion strain contribution is computed as
  $$\boldsymbol{\varepsilon} = \mathbf{I}\,\alpha\,(T - T_{\mathrm{ref}}),$$
  where $\alpha$ is the constant linear thermal expansion coefficient
  (set by the ``value`` parameter) and $T_{\mathrm{ref}}$ is the reference
  temperature provided by the base [@thermalExpansionModel].
ai_provenance:
  model: gpt-5.4-nano
  date: '2026-06-26'
  modified_sections:
  - options
  - formulation
