description: |
  Model for Zircaloy Poisson's Ratio from Matprov11.
options:
- key: YoungModulusName
  type: word
  required: false
  default: E
  description: |
    Option read by the model.
- key: fastFluenceName
  type: word
  required: false
  default: fastFluence
  description: |
    Option read by the model.
- key: par1
  type: scalar
  required: false
  default: 7.07e11
  description: |
    Matpro model parameter (alpha-phase oxygen concentration effect).
- key: par10
  type: scalar
  required: false
  default: 1.66e7
  description: |
    Matpro model parameter (beta-phase shear modulus temperature coefficient).
- key: par2
  type: scalar
  required: false
  default: 2.315e8
  description: |
    Matpro model parameter (alpha-phase oxygen concentration effect).
- key: par3
  type: scalar
  required: false
  default: 2.6e10
  description: |
    Matpro model parameter (cold work effect).
- key: par4
  type: scalar
  required: false
  default: 0.88
  description: |
    Matpro model parameter (alpha-phase fast neutron fluence effect).
- key: par5
  type: scalar
  required: false
  default: 0.12
  description: |
    Matpro model parameter (alpha-phase fast neutron fluence effect).
- key: par6
  type: scalar
  required: false
  default: 1e25
  description: |
    Matpro model parameter (alpha-phase fast neutron fluence effect).
- key: par7
  type: scalar
  required: false
  default: 4.04e10
  description: |
    Matpro model parameter (alpha-phase shear modulus).
- key: par8
  type: scalar
  required: false
  default: 2.168e7
  description: |
    Matpro model parameter (alpha-phase shear modulus temperature coefficient).
- key: par9
  type: scalar
  required: false
  default: 3.49e10
  description: |
    Matpro model parameter (beta-phase shear modulus).
usage:
- comment: |
    Example selection of the `ZircaloyMatpro` thermalExpansion model.
  snippet: |-
    materials
    {
      cladding
      {
        type Zircaloy;
        thermalExpansion
        {
          type ZircaloyMatpro;
          // YoungModulusName "E";
          // fastFluenceName "fastFluence";
          // par1 7.07e11;
          // par10 1.66e7;
          // par2 2.315e8;
          // par3 2.6e10;
          // par4 0.88;
          // par5 0.12;
          // par6 1e25;
          // par7 4.04e10;
          // par8 2.168e7;
          // par9 3.49e10;
        }
      }
    }
ai_provenance:
  model: gpt-5.4-nano
  date: '2026-06-26'
  modified_sections:
  - options
