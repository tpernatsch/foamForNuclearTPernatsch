formulation: |
  The model provides the temperature-dependent linear thermal expansion tensor for Zircaloy using a Matpro11-type correlation for the coefficient of thermal expansion, $\alpha(T)$, and returns the symmetric tensor $\alpha(T)\,T$ used by the mechanical/strain coupling. The implementation is encapsulated in $\\alpha(T)$ and then mapped to the OpenFOAM symmetric tensor field via $\\boldsymbol{\\alpha T}=\\alpha(T)\\,\\mathbf{I}$ (isotropic assumption), consistent with the standard usage of thermal expansion models in OpenFOAM (see also Duderstadt & Hamilton for fuel/cladding thermo-mechanics context).

  $$ \\boldsymbol{\\alpha T}(T_i)=\\alpha(T_i)\\,\\mathbf{I} $$

  $$ \\alpha(T)=\\frac{d\\varepsilon_{th}}{dT} $$

  $$ \\varepsilon_{th}(T)=\\int_{T_{ref}}^{T} \\alpha(T')\\,dT' $$

  The Matpro11 correlation is parameterized by seven fitted constants ($par1$–$par7$) read from the input dictionary; the code evaluates $\\alpha(T)$ from these parameters and the local temperature $T_i$ inside `setAlphaT(const scalar& Ti)`. The returned tensor is then used by `correct(symmTensorField& sf, const scalarField& T, const labelList& addr)` to update the thermal strain/expansion contribution at the addressed cells.

  - $\\boldsymbol{\\alpha T}(T_i)$ is the symmetric tensor field contribution corresponding to $\\alpha(T_i)\\,T_i$ (OpenFOAM `symmTensor`).
  - $\\alpha(T)$ is the (temperature-dependent) isotropic coefficient of linear thermal expansion (1/K).
  - $T_i$ is the local temperature at which the tensor is evaluated (K), i.e. the argument `Ti` in `setAlphaT`.
  - $\\mathbf{I}$ is the identity tensor.
  - $\\varepsilon_{th}(T)$ is the thermal strain (dimensionless).
  - $T_{ref}$ is a reference temperature used in the definition of thermal strain (the code may embed this implicitly in the correlation).
  - $par1$–$par7$ are the Matpro11 fitted correlation parameters controlling $\\alpha(T)$.
