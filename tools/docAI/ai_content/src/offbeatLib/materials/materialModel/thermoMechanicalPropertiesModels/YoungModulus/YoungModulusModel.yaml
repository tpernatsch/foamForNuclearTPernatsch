description: |
  Mother class for Young's Modulus models.
formulation: |
  This is an abstract base class that defines the interface for updating a
  Young's modulus field based on temperature.

  Implementations must provide the ``correct`` method, which updates the
  Young's modulus values in ``sf`` using the temperature field ``T`` and the
  addressing list ``addr`` (typically mapping material regions to mesh
  locations).
