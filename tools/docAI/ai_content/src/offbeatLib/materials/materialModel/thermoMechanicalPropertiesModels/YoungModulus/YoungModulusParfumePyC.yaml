  description: |
    Parfume model parameter.
- key: par12
  type: scalar
  required: false
  default: 0.519
  description: |
    Parfume model parameter.
usage:
- comment: |
    Example selection of the `PyCParfume` thermalExpansion model.
  snippet: |-
    materials
    {
      PyC
      {
        type PyC;
        thermalExpansion
        {
          type PyCParfume;
          // densityName "rho";
          // fastFluenceName "fastFluence";
          // par1 25.5;
          // par10 20.0;
          // par11 0.481;
          // par12 0.519;
          // par2 0.384;
          // par3 0.324e-3;
          // par4 1.463;
          // par5 -0.463;
          // par6 2.985;
          // par7 -0.0662;
          // par8 0.23;
          // par9 0.00015;
        }
      }
    }
