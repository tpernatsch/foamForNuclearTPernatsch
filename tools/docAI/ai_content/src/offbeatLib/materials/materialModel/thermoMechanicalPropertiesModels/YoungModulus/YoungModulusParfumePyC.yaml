description: |
  Class modelling Young Modulus of PyC from Parfume.
options:
- key: densityName
  type: word
  required: false
  default: rho
  description: |
    Name of the density field (looked up as a volScalarField).
- key: fastFluenceName
  type: word
  required: false
  default: fastFluence
  description: |
    Name of the fast fluence field (looked up as a volScalarField).
- key: par1
  type: scalar
  required: false
  default: 25.5
  description: |
    Parfume model parameter.
- key: par2
  type: scalar
  required: false
  default: 0.384
  description: |
    Parfume model parameter.
- key: par3
  type: scalar
  required: false
  default: 0.000324
  description: |
    Parfume model parameter.
- key: par4
  type: scalar
  required: false
  default: 1.463
  description: |
    Parfume model parameter.
- key: par5
  type: scalar
  required: false
  default: -0.463
  description: |
    Parfume model parameter.
- key: par6
  type: scalar
  required: false
  default: 2.985
  description: |
    Parfume model parameter.
- key: par7
  type: scalar
  required: false
  default: -0.0662
  description: |
    Parfume model parameter.
- key: par8
  type: scalar
  required: false
