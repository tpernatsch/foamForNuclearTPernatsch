description: |
  Mother class for conductivity models.

  This class provides the run-time selection interface for specific
  conductivity implementations. Derived classes must implement
  ``correct(scalarField& sf, const scalarField& T, const labelList& addr)``
  to update the conductivity field based on the local temperature.
