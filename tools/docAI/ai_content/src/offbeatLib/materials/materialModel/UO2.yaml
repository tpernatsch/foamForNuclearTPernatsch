formulation: |-
  The `UO2` class is a composite fuel-material model: it provides temperature-dependent thermophysical properties and, via behavioral sub-models, additional strain contributions used in the coupled thermo-mechanical balance. The governing equations are therefore those of the host solver (e.g., heat conduction and solid mechanics), with material closures supplied by the selected sub-models (Matpro/Frapcon/Relap correlations, etc.; see Duderstadt & Hamilton and Todreas & Kazimi for fuel behavior context).

  Heat transfer in the solid fuel is typically written as
  $$ \rho(T)\,c_p(T)\,\frac{\partial T}{\partial t} - \nabla\cdot\left(k(T)\nabla T\right) = Q, $$
  where the OpenFOAM fields are $T$ (temperature) and the material closures are returned by the selected `densityModel`, `heatCapacityModel`, and `conductivityModel`.

  Mechanical response uses the strain decomposition
  $$ \boldsymbol{\varepsilon} = \boldsymbol{\varepsilon}^{e} + \boldsymbol{\varepsilon}^{th} + \boldsymbol{\varepsilon}^{beh}, $$
  where `additionalStrains(symmTensorField&)` supplies $\boldsymbol{\varepsilon}^{beh}$ from densification/swelling/relocation sub-models, and `thermalExpansionModel` supplies $\boldsymbol{\varepsilon}^{th}$ (thermal expansion).

  Failure/constitutive degradation is handled through `checkFailure()`, which can modify the effective constitutive response (e.g., by flagging failed material points) depending on the selected `failureModel`.

  The effective additional strain rate is model-dependent and is supplied by the selected behavioral correlations, conceptually of the form
  $$ \frac{d\boldsymbol{\varepsilon}^{beh}}{dt} = \mathcal{F}_{dens}(T,\cdot)+\mathcal{F}_{swel}(T,\cdot)+\mathcal{F}_{relo}(T,\cdot), $$
  with optional coupling to pore-velocity/relocation physics when `poreVelocityModel` is enabled.

  - $T$ is the OpenFOAM temperature field [K]
  - $\rho(T)$ is the temperature-dependent fuel density [kg/m$^3$]
  - $c_p(T)$ is the temperature-dependent specific heat [J/(kg·K)]
  - $k(T)$ is the temperature-dependent thermal conductivity [W/(m·K)]
  - $Q$ is the volumetric heat source term [W/m$^3$]
  - $\boldsymbol{\varepsilon}$ is the total small-strain tensor [–]
  - $\boldsymbol{\varepsilon}^{e}$ is the elastic strain tensor [–]
  - $\boldsymbol{\varepsilon}^{th}$ is the thermal expansion strain tensor [–]
  - $\boldsymbol{\varepsilon}^{beh}$ is the behavioral (densification/swelling/relocation) additional strain tensor [–]
  - $\mathcal{F}_{dens},\mathcal{F}_{swel},\mathcal{F}_{relo}$ are model-specific fuel behavioral strain evolution operators (Frapcon/Relap-type correlations)
  - `additionalStrains` is the OpenFOAM-style material hook that returns $\boldsymbol{\varepsilon}^{beh}$
  - `checkFailure` is the hook that applies the selected `failureModel$ to determine failure state
