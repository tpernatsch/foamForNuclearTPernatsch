description: |
  Base constitutive law interface for thermo-mechanical behaviour.

  A `constitutiveLaw` instance updates the stress tensor by combining a
  hydrostatic part and a deviatoric part, and (optionally) updates elastic
  strain and additional strain contributions according to the selected
  rheology model.

  Concrete constitutive laws (e.g. elasticity, plasticity, creep) are
  implemented as derived classes selected at run time via the `type` entry.
formulation: |
  The constitutive law provides the evolution of stress components by
  separating the Cauchy stress into hydrostatic and deviatoric parts.

  $$ \sigma = \sigma_{\mathrm{hyd}} + \sigma_{\mathrm{dev}} $$

  where:

  - $\sigma$ is the total stress tensor field (OpenFOAM: ``sigma``)
  - $\sigma_{\mathrm{hyd}}$ is the hydrostatic stress contribution
    (OpenFOAM: ``sigmaHyd``)
  - $\sigma_{\mathrm{dev}}$ is the deviatoric stress contribution
    (OpenFOAM: ``sigmaDev``)

  Derived classes implement the model-specific update of
  ``sigmaHyd``, ``sigmaDev``, and elastic strain ``epsEl`` through the
  pure-virtual method ``correct(...)``. The base class provides
  ``updateStress(...)`` to recombine hydrostatic and deviatoric components.
