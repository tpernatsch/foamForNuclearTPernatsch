  formulation_added: true
formulation: |
  The “none” FGR selection is implemented as a null model: fission gas production,
  retention/release kinetics, and associated swelling source terms are not evaluated.
  Consequently, the released-mole increments are identically zero and the swelling
  fields remain at their initial values (or are simply carried as constant auxiliary
  fields created by the base infrastructure).

  $$ \Delta n_{\mathrm{FGR}} = 0,\qquad \Delta n_{\mathrm{He}} = 0 $$

  - $\Delta n_{\mathrm{FGR}}$ is the additional moles of Xe+Kr released during the current time step (molFGR_).
  - $\Delta n_{\mathrm{He}}$ is the additional moles of He released during the current time step (molHe_).

  The model also implies a zero evolution of the local FGR fraction:

  $$ \Delta f_{\mathrm{FGR}} = 0,\qquad f_{\mathrm{FGR}}(t)=f_{\mathrm{FGR}}(t_0) $$

  - $\Delta f_{\mathrm{FGR}}$ is the local change in fission gas release fraction over the current time step (fgr_ - fgr0_).
  - $f_{\mathrm{FGR}}$ is the local FGR fraction in percent (fgr_).

  Any swelling update that would normally be driven by $\Delta n_{\mathrm{FGR}}$ is therefore
  suppressed, so the auxiliary swelling tensors are not advanced by FGR kinetics.
  (For non-trivial FGR formulations, see Duderstadt & Hamilton and Todreas & Kazimi.)
