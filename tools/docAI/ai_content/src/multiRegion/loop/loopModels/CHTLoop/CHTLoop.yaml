description: |-
  This class implements a loop for the conjugate heat transfer (CHT) problems.
  It is designed to handle the coupling between fluid and solid regions in a
  multi-region simulation. It iteratively solves the energy equations for both
  fluid and solid regions, allowing for the exchange of thermal information
  between them, in particular assuring temperature and heat flux continuity.
options:
- key: fluidPatches
  type: word
  required: true
  default: null
  description: ''
- key: fluidRegionName
  type: word
  required: true
  default: null
  description: ''
- key: maxIterations
  type: int
  required: true
  default: null
  description: ''
- key: maxResidual
  type: scalar
  required: true
  default: null
  description: ''
- key: solidPatches
  type: word
  required: true
  default: null
  description: ''
- key: solidRegionName
  type: word
  required: true
  default: null
  description: ''
- key: targetRegion
  type: word
  required: true
  default: null
  description: ''
- key: useHTC
  type: bool
  required: true
  default: null
  description: ''
usage:
- comment: 'The following subDict is an example on how to create an FSILoop in regionsDict:'
  snippet: |-
    CHTLoop
        regionSolvers
        {
            Level_0
            {
                CHTLoop1    CHTLoop;
            }
            CHTLoop1
            {
                solvers // list of solvers
                {
                    regionName      solverName;
                    fluidRegion     onePhase;
                    neutroRegion    diffusionNeutronics;
                    CHTLoop2        CHTLoop;
                }
                maxResidual 0.00005;   // residual after which the iteration is ended
                maxIterations 3;       // maximum number of iterations before the loop is ended
                includeFluidMechanicsInLoop  false; //defaulted to false
            }
            CHTLoop2
            {
                ...
            }
        }
- comment: |-
    If includeFluidMechanicsInLoop entry is set to false (default value), for the thermal-hydraulics
    solvers only the energy is solved iteratively with the other physics, while the fluid-mechanics
    is solved only once at the beginning of the iteration. This is done so that useless
    fluid-mechanics iterations are solved.
