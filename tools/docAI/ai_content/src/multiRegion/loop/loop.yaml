description: |-
  Many multi-physics simulations require flexible control over the time
  advancement procedure. While some physics must be tightly coupled, others
  interact only weakly. This situation is common in multi-scale simulations:
  physics are strongly coupled within a single scale but only loosely coupled
  across scales.

  To provide this flexibility, dedicated *loops* are introduced. A loop defines
  a set of solvers that are iterated together using a prescribed convergence
  strategy. For example, the ``picardLoop`` contains a list of solvers that
  must be tightly coupled. During run-time, when any of the involved physics is
  corrected, all solvers in the ``picardLoop`` are iteratively updated until a
  user-specified convergence criterion is satisfied. At each iteration, both
  volumetric and boundary field exchanges are performed to update the coupling
  variables between regions.

  In addition to the standard ``picardLoop``, other loop types exist, each
  designed for specific coupling strategies. These may include additional field
  manipulations, residual evaluations, or specialized update sequences tailored
  to the physics being solved.

  All *loops* are defined in the ``system/regionsDict`` file, within the
  ``regionSolvers`` sub-dictionary. Each loop entry specifies:

  - the list of sub-solvers that are tightly coupled,
  - the convergence residual threshold,
  - the maximum number of iterations, and
  - any optional parameters associated with the chosen loop type.

  Loops may also be nested, resulting in hierarchical or tree-like coupling
  structures, as illustrated in the usage below.

  Current loops available in *GeN-Foam* include:

  .. toctree::
    :maxdepth: 1
    :glob:

    ./**

  .. raw:: html

   <br><br>
options:
- key: fluidRegionName
  type: word
  required: true
  default: null
  description: ''
