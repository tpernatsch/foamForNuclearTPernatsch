description: |
  Class to hold the lists of region meshes and solvers.

  It also provides loop and iteration functionality which automatically sets the
  region ``Info`` prefix for each of the solvers returned by the ``[]`` operator
  or iterator.
formulation: |
  This class does not implement a physical model. It orchestrates the creation
  and iteration of region-level solvers and (for multi-physics solvers) their
  iterative coupling.

  The main responsibilities are:
  - create region solvers from the ``regionsDict``/``regionSolvers`` configuration
  - provide indexed access via ``operator[]`` and iterator access via
    ``begin()``/``end()``
  - manage the OpenFOAM ``Info`` prefix so that log output is tagged with the
    active region name during solver calls

  Multi-region coupling control variables are stored internally:
  - ``multiRegionTightCoupled_`` selects a tight-coupling strategy
  - ``multiRegionResidual_`` and ``maxMultiRegionIterations_`` bound the
    convergence/iteration behavior for multi-region coupling
