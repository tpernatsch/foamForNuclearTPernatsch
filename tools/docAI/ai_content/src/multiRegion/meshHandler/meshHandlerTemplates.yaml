description: |
  meshHandlerTemplates provides templated utilities for handling mesh-to-mesh
  field mapping and (optionally) creation of baffle-less coupling fields.

  In particular, it supports mapping volumetric fields between source and
  target meshes using precomputed mapping lists, with optional removal of
  baffles and optional initialization of mapped fields.
formulation: |
  The class performs conservative mapping of a volumetric field from a
  source mesh to a target mesh using the mapping operator stored in
  ``mappingList_``.

  For each target region and each source field label, the mapped target field
  is updated as:

  $$
  \phi^{tgt} \leftarrow \phi^{tgt} + M(\phi^{src})
  $$

  where:

  - $\phi^{tgt}$ is the target volumetric field (a ``VolFieldType``) looked up
    in ``meshes_[tgtFieldLabel]`` by ``tgtFieldName``
  - $\phi^{src}$ is the source volumetric field (a ``VolFieldType``) looked up
    in ``meshes_[srcFieldLabel]`` by ``srcFieldName``
  - $M(\cdot)$ is the mapping operator ``mapTgtToSrc`` stored in
    ``mappingList_[tgtFieldLabel][srcFieldLabel]``
  - $+$ is the accumulation operation implemented by ``plusEqOp<Type>()``

  After mapping, the target field boundary conditions are enforced via
  ``correctBoundaryConditions()``.

  If ``initializeMappedFields`` is enabled, the class also creates a
  baffle-less version of the coupling field (named ``fieldName.baffleLess``)
  on the ``baffleLessMesh`` using a zero-gradient patch field type.
admonitions:
- kind: note
  body: This model is selected solely by its runtime ``typeName`` and defines no additional options.
options: []
usage:
- comment: |
    The model is specified via the ``type`` entry in the ``<dictName>/<subModel>/<zoneName>`` subdictionary of the ``phaseProperties`` file (located in ``constant/``, or ``constant/<regionName>`` for multi-region cases, e.g. ``constant/fluidRegion``). Here is a snippet enabling the model:
  snippet: |-
    phaseProperties
    {
      physicsModels
      {
        <subModel>
        {
          "<zoneName>"
          {
            type meshHandlerTemplates;
          }
        }
      }
    }
