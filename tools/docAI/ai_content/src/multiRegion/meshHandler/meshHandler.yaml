description: |
  Class to hold all the region meshes and perform the volumetric mappings.

  `meshHandler` reads the multi-region coupling configuration from `regionsDict`, creates the required dynamic meshes for all participating regions/solvers, and provides utilities to map fields between regions (including optional baffle-less handling) via mesh-to-mesh interpolation.
dictionary: regionsDict
formulation: |
  This class provides the infrastructure for field mapping between coupled regions rather than a standalone physical model.

  For each configured coupling entry, fields are interpolated from a source region mesh to a target region mesh using a mesh-to-mesh mapping object (see `meshToMesh`), optionally after creating baffle-less meshes to avoid discontinuities at internal baffles.

  The mapping is applied to the configured field pairs (e.g. temperature, velocity, viscosity, etc.) at each coupling step when `mapAllFields` / `mapAndWrite` are invoked.
