usage:
- comment: |
    Usage already present in Header (verbatim):
  snippet: |
    In regionsDict
        \verbatim
            mappings
            {
                <Name of region ONTO which I am mapping>
                {
                    <Name of region FROM which I am mapping>
                    {
                        sourceFields    (nameOfSourceField1 nameOfSourceField2);
                        targetFields    (nameOfTargetField1 nameOfTargetField2);
                    }
                }
                neutroRegion
                {
                    fluidRegion
                    {
                        sourceFields    ( T U mu alpha );
                        targetFields    (TCool U mu alpha );
                    }
                }
            }
        \endverbatim
- comment: |
    The model is specified via the ``type`` entry in the ``<dictName>/<subModel>/<zoneName>`` subdictionary of the ``phaseProperties`` file (located in ``constant/``, or ``constant/<regionName>`` for multi-region cases, e.g. ``constant/fluidRegion``). Here is a snippet enabling the model:
  snippet: |-
    phaseProperties
    {
      physicsModels
      {
        <subModel>
        {
          "<zoneName>"
          {
            type meshHandler;
          }
        }
      }
    }
