description: |
  Interfacial area model that returns zero interfacial contact area between
  the structured solid and the dispersed fluid (i.e. it disables the Kazimi
  interfacial-area correlation).

  The model selects the vapour phase from the provided fluid pair and stores
  geometric parameters of the pin bundle (pin diameter and pitch) for
  consistency with other interfacial-area models.
formulation: |
  This implementation is a null interfacial-area model: it does not compute
  a Kazimi-type interfacial area and instead returns zero interfacial contact
  fraction with the dispersed fluid.

  Let $f$ be the returned fraction of structure interfacial contact in
  contact with the dispersed fluid for a given cell.

  $$ f = 0 $$

  - $f$ is the model output returned by ``value(celli)``
  - the vapour phase is selected from the ``FFPair`` based on whether one of
    the fluids is a gas (see ``vapour_`` in the constructor)
  - geometric parameters are read from the input dictionary:
    - $D$ is ``pinDiameter``
    - $P$ is ``pinPitch``
options:
- key: pinDiameter
  type: scalar
  required: true
  description: |
    Pin diameter $D$ used by the interfacial-area model.
- key: pinPitch
  type: scalar
  required: true
  description: |
    Pin pitch $P$ used by the interfacial-area model.
dictionary: neutronicsProperties
usage:
- comment: 'The model is specified via the ``type`` entry in the ``<dictName>/<subModel>/<zoneName>`` subdictionary of the
    ``phaseProperties`` file (located in ``constant/``, or ``constant/<regionName>`` for multi-region cases, e.g. ``constant/fluidRegion``).
    Here is a snippet enabling the model:'
  snippet: |-
    phaseProperties
    {
      physicsModels
      {
        <subModel>
        {
          "<zoneName>"
          {
            type NoKazimi;
          }
        }
      }
    }
ai_provenance:
  model: gpt-5.4-nano
  date: '2026-06-26'
  modified_sections:
  - description
