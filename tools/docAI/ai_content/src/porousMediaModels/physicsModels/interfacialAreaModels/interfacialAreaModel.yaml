description: |-
  Class to handle fluid-fluid interfacial area.

  This is an abstract base class that provides a common interface for models
  computing the fraction of interfacial area (e.g. between a structure and a
  fluid) that is in contact with a given fluid phase.

  .. toctree::
     :maxdepth: 1
     :glob:

     ./**
formulation: |
  The model provides a local interfacial-area fraction field by evaluating a
  scalar function at each mesh cell.

  $$ iA(\text{cell}) = \text{value}(\text{cell}) $$

  where:

  - $iA$ is the interfacial-area fraction stored in a `volScalarField`
  - $\text{cell}$ is a mesh cell index (`label celli`)
  - $\text{value}(\text{cell})$ is the model-specific interfacial-area
    fraction returned by the virtual function `value(celli)`

  After updating the internal field, boundary conditions are enforced via
  `iA.correctBoundaryConditions()`.
admonitions:
- kind: note
  body: This model is selected solely by its runtime ``typeName`` and defines no additional options.
options: []
usage:
- comment: 'The model is specified via the ``type`` entry in the ``<dictName>/<subModel>/<zoneName>`` subdictionary of the
    ``phaseProperties`` file (located in ``constant/``, or ``constant/<regionName>`` for multi-region cases, e.g. ``constant/fluidRegion``).
    Here is a snippet enabling the model:'
  snippet: |-
    phaseProperties
    {
      physicsModels
      {
        <subModel>
        {
          "<zoneName>"
          {
            type interfacialAreaModel;
          }
        }
      }
    }
