description: |
  Interfacial area model that assumes that the dispersed phase flow is
  annular (i.e. cylindrical topology).

  The model returns, for each cell, the fraction of structure interfacial
  contact in contact with the dispersed fluid.
options:
- key: cutoffAlpha
  type: scalar
  required: false
  default: 0.9
  description: |
    Threshold used to limit/switch the interfacial-area fraction based on the
    local dispersed-phase volume fraction (``alpha``). Values above this
    cutoff are treated as fully dispersed for the purpose of the annular
    interfacial-area estimate.
usage:
- comment: |
    The model is specified via the ``type`` entry in the ``<dictName>/<subModel>/<zoneName>`` subdictionary of the ``phaseProperties`` file (located in ``constant/``, or ``constant/<regionName>`` for multi-region cases, e.g. ``constant/fluidRegion``). Here is a snippet enabling the model:
  snippet: |-
    phaseProperties
    {
      physicsModels
      {
        <subModel>
        {
          "<zoneName>"
          {
            type annular;
          }
        }
      }
    }
ai_provenance:
  model: gpt-5.4-nano
  date: '2026-06-26'
  modified_sections:
  - description
  - options
  stub_improved: true
