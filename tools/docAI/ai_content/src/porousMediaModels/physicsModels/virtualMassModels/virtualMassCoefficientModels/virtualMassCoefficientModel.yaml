description: |2-

  Base class for virtual-mass coefficient models operating on an FFPair. Calculate virtual mass based on a coefficient. Available runtime selectable models include:

  toctreeHere

  If no models are available, it means that only templated models, such as ``constant`` exist.
options: []
usage:
- comment: 'The virtual-mass coefficient model is constructed at run-time via the       virtualMassCoefficientModel subdictionary
    of the physicsModel subdictionary of the phaseProperties dictionary. '
  snippet: |-
    physicsModels
    {
      virtualMassCoefficientModel
      {
          type            constant;
          value           0.1;
      }
    }
dictionary: neutronicsProperties
