formulation: |2-

  This class is an abstract base that defines the interface for virtual-mass coefficient models via the pure virtual function ``value(celli)`` and provides a ``correctField`` hook. It does not implement a specific physical closure; the non-trivial equations (if any) are contained in derived runtime-selectable models (e.g., ``constant`` or other implementations of ``value``).
