description: |-
  Model by Kaiser et al. for the multiplier, specifically for sodium
  two-phase flows:

  $$\phi^2 = \exp\!\left(2\left(1.48 - 1.05\,\ln X^{1/2} + 0.09\left(\ln X^{1/2}\right)^2\right)\right)$$

  Here $\ln$ is the natural logarithm and $X$ is the square-root form of the
  Lockhart–Martinelli parameter $X_2$:
  $$X = \sqrt{X_2}.$$

  $$X_2 = \left(\frac{\mu_I}{\mu_O}\right)^{0.2}
         \left(\frac{\text{flowQuality}_I}{\text{flowQuality}_O}\right)^{1.8}
         \frac{\rho_O}{\rho_I}$$

  Kaiser, A., Huber, F., Bottoni, M., Dorr, B., 1988. "Contribution to sodium
  boiling heat transfer, pressure drop, and void distribution in multi-pin
  geometry". In: Proc. 13th Liquid Metal Boiling Working Group (LMBWG), pp.
  71–98.
options: []
usage:
- comment: |
    The two-phase drag multiplier model is specified via the ``type`` entry in the ``physicsModels/twoPhaseDragMultiplierModel/<zoneName>`` subdictionary of the ``phaseProperties`` file.
    (located in ``constant/``, or ``constant/<regionName>`` for multi-region cases, e.g.
    ``constant/fluidRegion``).

    Here is a snippet of a ``phaseProperties`` file enabling the Kaiser88 drag multiplier model drag model:
  snippet: |-
    physicsModels
    {
        twoPhaseDragMultiplierModel
        {
            type                Kaiser88;
            multiplierFluid     "liquid";
        }
    }
