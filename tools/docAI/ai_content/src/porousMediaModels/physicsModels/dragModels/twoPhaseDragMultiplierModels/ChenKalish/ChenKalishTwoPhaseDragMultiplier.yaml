description: |-
  Model by Chen and Kalish for the multiplier, specifically for
  potassium two-phase flows:

  $$\phi_2 = \exp\!\left(2\left(0.0867\,(\ln X)^2 - 0.518\,\ln X + 1.59\right)\right)$$

  Here, $\ln$ denotes the natural logarithm and $X$ is the Lockhart-Martinelli
  parameter (computed internally as ``mFluidPtr_->XLM()``).

  Chen, J.C., Kalish, S., 1970. "An experimental investigation of two-phase
  pressure drop for potassium with and without net vaporization." In: 4th
  Int. Heat transfer Conf, Vol. 6.
usage:
- comment: |
    The two-phase drag multiplier model is specified via the ``type`` entry in the ``physicsModels/twoPhaseDragMultiplierModel/<zoneName>`` subdictionary of the ``phaseProperties`` file.
    (located in ``constant/``, or ``constant/<regionName>`` for multi-region cases, e.g.
    ``constant/fluidRegion``).

    Here is a snippet of a ``phaseProperties`` file enabling the ChenKalish drag multiplier model drag model:
  snippet: |-
    physicsModels
    {
        twoPhaseDragMultiplierModel
        {
            type                ChenKalish;
            multiplierFluid     "liquid";
        }
    }
