description: |-
  Model by Kaiser et al. for the multiplier, specifically for sodium
  two-phase flows.

  The multiplier is defined as
  $$\phi = \frac{8.2}{X^{0.55}}$$
  and therefore
  $$\phi^2 = \frac{67.24}{X^{1.1}}.$$

  $X^2$ is the well-known Lockhart-Martinelli parameter defined as
  $$X^2 = \left(\frac{\mu_I}{\mu_O}\right)^{0.2}
  \left(\frac{\mathrm{flowQuality}_I}{\mathrm{flowQuality}_O}\right)^{1.8}
  \frac{\rho_O}{\rho_I}.$$

  Please note that $X$ in use in $\phi$ is $X=\sqrt{X^2}$ and that $\phi^2=\phi^2$.

  Kaiser, A., Peppler, W., Vöröss, L., 1974. "Type of flow, pressure drop,
  and critical heat flux of a two-phase sodium flow". Nucl. Eng. Des. 30,
  pp. 305–315.
options: []
usage:
- comment: |
    The two-phase drag multiplier model is specified via the ``type`` entry in the ``physicsModels/twoPhaseDragMultiplierModel/<zoneName>`` subdictionary of the ``phaseProperties`` file.
    (located in ``constant/``, or ``constant/<regionName>`` for multi-region cases, e.g.
    ``constant/fluidRegion``).

    Here is a snippet of a ``phaseProperties`` file enabling the Kaiser74 drag multiplier model drag model:
  snippet: |-
    physicsModels
    {
        twoPhaseDragMultiplierModel
        {
            type                Kaiser74;
            multiplierFluid     "liquid";
        }
    }
