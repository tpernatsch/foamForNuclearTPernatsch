description: |
  Schiller-Neumann model for interfacial friction.
admonitions:
- kind: warning
  body: |
    Applicable **only** to liquid–gas systems. Ensure ``stateOfMatter`` is set
    correctly in ``phaseProperties.<phaseName>Properties`` to distinguish gas and liquid.
- kind: note
  body: |
    This model is selected solely by its runtime ``typeName`` and defines no additional options.
options: []
usage:
- comment: |
    The drag model is specified via the ``type`` entry in the ``physicsModels/dragModels/<zoneName>`` subdictionary of the ``phaseProperties`` file.
    (located in ``constant/``, or ``constant/<regionName>`` for multi-region cases, e.g.
    ``constant/fluidRegion``).

    Here is a snippet of a ``phaseProperties`` file enabling the ScillerNaumann fluid–fluid drag model:
  snippet: |-
    // ... other phaseProperties subdictionaries

    physicsModels
    {
      dragModels
      {
        "<zoneName>"
        {
          type ScillerNaumann;
        }

        // ... other zone subdictionaries

      }

      // ... other physicsModels subdictionaries
    }

    // ... other subdictionaries
ai_provenance:
  model: gpt-5.4-nano
  date: '2026-06-11'
  modified_sections:
  - usage
  formulation_added: true
formulation: |
  The Schiller–Naumann correlation provides an empirical drag coefficient for dispersed flow, expressed through a particle Reynolds number and a Schiller–Naumann correction factor (see Duderstadt & Hamilton; also common in two-phase flow literature). In this implementation, the model returns a local interfacial friction/drag coefficient used by the fluid–fluid force closure.

  $$Re_p = \frac{\rho\, d_p\, |\mathbf{u}_{rel}|}{\mu}$$
  $$C_D = \frac{24}{Re_p}\left(1+0.15\,Re_p^{0.687}\right)\qquad (Re_p \lesssim 1000)$$
  $$\beta = \frac{3}{4}\,\frac{C_D\,\rho\,|\mathbf{u}_{rel}|}{d_p}$$

  - $Re_p$ is the particle (or characteristic) Reynolds number.
  - $C_D$ is the drag coefficient from the Schiller–Naumann correlation.
  - $\beta$ is the interfacial drag/friction coefficient returned by the model (used in the momentum exchange term).
  - $\rho$ is the carrier-phase density (OpenFOAM field $\rho$).
  - $d_p$ is the characteristic length/particle diameter (or equivalent interfacial length scale).
  - $\mu$ is the dynamic viscosity (OpenFOAM field $\mu$).
  - $\mathbf{u}_{rel}$ is the relative velocity between phases; $|\mathbf{u}_{rel}|$ is its magnitude.
