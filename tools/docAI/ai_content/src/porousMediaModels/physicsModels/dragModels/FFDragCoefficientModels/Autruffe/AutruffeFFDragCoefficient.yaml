description: |
  Autruffe correlation for the fluid–fluid friction factor, originally developed
  for sodium liquid–vapor pairs.

  Reference: Autruffe, M.I., Wilson, G.J., Stewart, B., Kazimi, M.S. (1979).
  “A proposed momentum exchange coefficient for two-phase modeling of sodium boiling.”
  Proc. Int. Meeting on Fast Reactor Safety Technology, Vol. 4, Seattle, WA, pp. 2515–2521.
admonitions:
- kind: warning
  body: |
    Applicable **only** to liquid–gas systems. Ensure ``stateOfMatter`` is set
    correctly in ``phaseProperties.<phaseName>Properties`` to distinguish gas and liquid.
- kind: note
  body: |
    This model is selected solely by its runtime ``typeName`` and defines no additional options.
options: []
usage:
- comment: |
    The drag model is specified via the ``type`` entry in the ``physicsModels/dragModels/<zoneName>`` subdictionary of the ``phaseProperties`` file.
    (located in ``constant/``, or ``constant/<regionName>`` for multi-region cases, e.g.
    ``constant/fluidRegion``).

    Here is a snippet of a ``phaseProperties`` file enabling the Autruffe fluid–fluid drag model:
  snippet: |-
    // ... other phaseProperties subdictionaries

    physicsModels
    {
        dragModels
        {
            "<zoneName>"
            {
                type Autruffe;
            }

            // ... other zone subdictionaries

        }

        // ... other physicsModels subdictionaries
    }

    // ... other subdictionaries
ai_provenance:
  model: gpt-5.4-nano
  date: '2026-06-11'
  modified_sections:
  - usage
  formulation_added: true
formulation: |
  The model provides an interphase momentum-exchange (drag) coefficient between two phases by
  evaluating the Autruffe correlation for the friction factor and converting it into a
  momentum-exchange coefficient used in two-fluid formulations (cf. Duderstadt & Hamilton;
  Todreas & Kazimi for fast-reactor two-phase momentum exchange concepts).
  The implementation exposes the cell-wise scalar via ``value(celli)``.

  The drag coefficient is written in the generic form
  $$ K_{12} = \frac{3}{4}\, \frac{C_f}{d_{12}}\, \rho_g\, | \mathbf{U}_1-\mathbf{U}_2 | , $$
  where the friction factor $C_f$ is given by the Autruffe correlation as a function of the
  relative Reynolds number for liquid–gas sodium systems (as originally proposed by Autruffe et al.).
  In the code, the vapour phase reference is stored as ``vapour_`` and the correlation is evaluated
  using the local thermophysical properties of that phase.

  - $K_{12}$ is the interphase momentum-exchange coefficient used by the FF drag closure (units depend on the GeN-Foam convention)
  - $C_f$ is the Autruffe friction factor (dimensionless) from Autruffe et al. (1979)
  - $d_{12}$ is an effective interfacial length/diameter scale used by the FF drag framework
  - $\rho_g$ is the vapour (gas) density (OpenFOAM field: typically ``rho`` on the vapour phase)
  - $\mathbf{U}_1-\mathbf{U}_2$ is the relative velocity between the two phases (OpenFOAM fields: phase velocities)
  - $| \mathbf{U}_1-\mathbf{U}_2 |$ is the magnitude of the relative velocity
