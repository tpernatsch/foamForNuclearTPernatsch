description: |
  Bestion Model for interfacial friction implementation test
admonitions:
- kind: warning
  body: |
    Applicable **only** to liquid–gas systems. Ensure ``stateOfMatter`` is set
    correctly in ``phaseProperties.<phaseName>Properties`` to distinguish gas and liquid.
- kind: note
  body: |
    This model is selected solely by its runtime ``typeName`` and defines no additional options.
options: []
usage:
- comment: |
    The drag model is specified via the ``type`` entry in the ``physicsModels/dragModels/<zoneName>`` subdictionary of the ``phaseProperties`` file.
    (located in ``constant/``, or ``constant/<regionName>`` for multi-region cases, e.g.
    ``constant/fluidRegion``).

    Here is a snippet of a ``phaseProperties`` file enabling the Bestion fluid–fluid drag model:
  snippet: |-
    // ... other phaseProperties subdictionaries

    physicsModels
    {
        dragModels
        {
            "<zoneName>"
            {
                type Bestion;
            }

            // ... other zone subdictionaries

        }

        // ... other physicsModels subdictionaries
    }

    // ... other subdictionaries
ai_provenance:
  model: gpt-5.4-nano
  date: '2026-06-11'
  modified_sections:
  - description
  - formulation
  - usage
  formulation_added: true
formulation: |
  The Bestion drag-coefficient model is implemented as a constitutive closure that returns a local interfacial friction/drag coefficient as a function of the cell index. In this codebase, the model is described as a “test” and the YAML indicates it has no additional options; therefore, the governing relation is not specified here beyond the fact that the model provides a scalar closure via ``value(celli)`` for use in the interfacial momentum exchange (see OpenFOAM-style constitutive models and the general approach in two-fluid/mixture formulations as in Duderstadt & Hamilton and Todreas & Kazimi).
  $$ K_{ij} = \text{Bestion}\big(\texttt{celli}\big) $$
  - $K_{ij}$ is the interfacial drag/friction coefficient used by the solver (units depend on the momentum-exchange formulation)
  - $\texttt{celli}$ is the OpenFOAM cell index
  - $\text{Bestion}(\cdot)$ is the Bestion model closure implemented in ``BestionFFDragCoefficient.C`` through ``value(const label& celli)``
