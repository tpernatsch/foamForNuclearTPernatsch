description: |-
  Colebrook drag coefficient in the form $f_d = ( A \log_{10}(Re) + B )^C$

  $$f_d = \left( C \, \log_{10}(Re) + D \right)^{E}$$

  $$K_d = 0.5 \, f_d \, \frac{\alpha \rho |U|}{D_h}$$
options:
- key: coeff
  type: scalar
  required: true
  description: |
    Value of the coefficient multiplying $\log_{10}(Re)$ in the drag correlation.
- key: const
  type: scalar
  required: true
  description: |
    Value of the additive constant inside the drag correlation.
- key: exp
  type: scalar
  required: true
  description: |
    Exponent applied to the drag correlation.
usage:
- comment: |
    The drag model is specified via the ``type`` entry in the ``physicsModels/dragModels/<zoneName>`` subdictionary of the ``phaseProperties`` file.
    (located in ``constant/``, or ``constant/<regionName>`` for multi-region cases, e.g.
    ``constant/fluidRegion``).

    Here is a snippet of a ``phaseProperties`` file enabling the Colebrook fluid–structure drag model:
  snippet: |-
    // ... other phaseProperties subdictionaries

    physicsModels
    {
      dragModels
      {
        "<zoneName>"
        {
          type    Colebrook;
          coeff   1.2776;
          const   -0.406;
          exp     -2.246;
        }

        // ... other zone subdictionaries

      }

      // ... other physicsModels subdictionaries
    }

    // ... other subdictionaries
ai_provenance:
  model: gpt-5.4-nano
  date: '2026-06-26'
  modified_sections:
  - description
  - options
