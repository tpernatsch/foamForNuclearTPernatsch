description: |
  Base class to represent a FFDragFactor with basing name access
  functionality.
formulation: |
  This class provides the dispersed–continuous interphase drag coefficient
  used in the momentum exchange term for fluid-structure (two-fluid) coupling.
  It computes a scalar drag factor $K_d$ from the continuous-phase density,
  slip velocity magnitude, a characteristic dispersed-phase dimension, and a
  model-dependent drag coefficient.

  $$ K_d = (a_1 + a_2)\left(\frac{1}{2D_{hd}}\right)\rho_c\,|\mathbf{U}_r|\, f_d $$

  where:

  - $K_d$ is the drag coefficient field used in the momentum equations
  - $a_1$ is the volume fraction field of fluid 1 (OpenFOAM: `pair_.fluid1()`)
  - $a_2$ is the volume fraction field of fluid 2 (OpenFOAM: `pair_.fluid2()`)
  - $D_{hd}$ is the characteristic dimension of the dispersed phase
    (OpenFOAM: `Dhd_`)
  - $\rho_c$ is the continuous-phase density (OpenFOAM: `rhoc_`)
  - $|\mathbf{U}_r|$ is the slip velocity magnitude between phases
    (OpenFOAM: `magUr_`)
  - $f_d$ is the drag coefficient from the selected
    [@FFDragCoefficientModel] implementation (OpenFOAM: `fdPtr_->value(i)`)

  The drag coefficient model is selected at runtime via the
  [@FFDragCoefficientModel] factory and evaluated cell-wise.
options: []
usage:
- comment: |
    The model is specified via the ``type`` entry in the ``<dictName>/<subModel>/<zoneName>`` subdictionary of the ``phaseProperties`` file (located in ``constant/``, or ``constant/<regionName>`` for multi-region cases, e.g. ``constant/fluidRegion``). Here is a snippet enabling the model:
  snippet: |-
    phaseProperties
    {
      physicsModels
      {
        <subModel>
        {
          "<zoneName>"
          {
            type FFDragFactor;
          }
        }
      }
    }
admonitions:
- kind: note
  body: This model is selected solely by its runtime ``typeName`` and defines no additional options.
ai_provenance:
  model: gpt-5.4-nano
  date: '2026-06-26'
  modified_sections:
