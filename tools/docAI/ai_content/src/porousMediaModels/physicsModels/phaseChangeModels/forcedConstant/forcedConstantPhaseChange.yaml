description: |
  Phase change model that assigns a *forced constant* interfacial mass-transfer
  rate $dmdt_*$ on selected mesh cells. The model is registered in OpenFOAM
  under the runtime type name `forcedConstant`.

  Although the class name suggests a phase-change mechanism, the current
  implementation does not compute $dmdt_*$ from interfacial heat fluxes; it
  simply sets $dmdt_*$ to a user-provided constant value on the specified
  regions and leaves `correctInterfacialDmdt()` empty.
formulation: |
  The model prescribes the interfacial mass transfer rate field $dmdt_*$ as a
  constant value on a set of cells identified by the `regions` list.

  $$ dmdt_*(\mathbf{x}) = value \qquad \forall \ \mathbf{x} \in \Omega_{regions} $$

  where:
  - $dmdt_*$ is the mass transfer term stored in the model field `dmdt_` (units
    depend on the surrounding phaseChangeModel framework)
  - $value$ is the constant mass transfer rate read from the dictionary entry
    `value`
  - $\Omega_{regions}$ is the union of cell zones referenced by the `regions`
    list in the mesh

  The boundary conditions for `dmdt_` are updated via
  `dmdt_.correctBoundaryConditions()` after initialization.
options:
- key: value
  type: scalar
  required: true
  description: |
    Constant value assigned to the `dmdt_` field for all cells belonging to the
    cell zones listed in `regions`.
- key: regions
  type: word
  required: true
  description: |
    List of mesh cell-zone names. For each named zone, all cells in that zone
    are assigned `dmdt_[cell] = value`.
usage:
- comment: |
    The model is specified via the ``type`` entry in the ``<dictName>/<subModel>/<zoneName>`` subdictionary of the ``phaseProperties`` file (located in ``constant/``, or ``constant/<regionName>`` for multi-region cases, e.g. ``constant/fluidRegion``). Here is a snippet enabling the model:
  snippet: |-
    phaseProperties
    {
      physicsModels
      {
        <subModel>
        {
          "<zoneName>"
          {
            type forcedConstantPhaseChange;
          }
        }
      }
    }
ai_provenance:
  model: gpt-5.4-nano
  date: '2026-06-26'
  modified_sections:
