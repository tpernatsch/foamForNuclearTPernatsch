description: |-
  Class to manage the fluid-structure (i.e. fluid-wall) heat transfer coefficient models. Available runtime selectable models include:

  .. toctree::
     :maxdepth: 1
     :glob:

     ./**
usage:
- comment: "The fluid-fluid drag coefficient model is constructed at run-time via the\nheatTransferModels subdictionary of\
    \ the physicsModel subdictionary of the phaseProperties dictionary. "
  snippet: |-
    physicsModels
    {
      heatTransferModels
      {
          "liquid.vapour"
          {
              "liquid"
              {
                  type    NusseltReynoldsPrandtlPower;
                  const   2.0;
                  coeff   0.6;
                  expRe   0.5;
                  expPr   0.33;
              }
              "vapour"
              {
                  type    constant;
                  value   1e3;
              }
          }
      }
    }
ai_provenance:
  model: gpt-5.4-nano
  date: '2026-06-26'
  modified_sections:
  - description
