description: |
  Model for the prediction of the temperature of the onset of nucleate
  boiling (i.e. T_ONB).

  This is a runtime-selectable base class: concrete implementations provide
  the actual $T_{ONB}$ correlation via the virtual ``value(celli, htc2pFCi)``
  method.

  The class stores references to the saturation/interface temperature field
  ``T.interface`` (``Tsat_``) and to the fluid pair (``pair_``), and it
  lazily resolves pointers to the other phase fluid and to the latent heat
  field ``L`` (``LPtr_``).
admonitions:
- kind: note
  body: This model is selected solely by its runtime ``typeName`` and defines no additional options.
options: []
usage:
- comment: |
    The model is specified via the ``type`` entry in the ``<dictName>/<subModel>/<zoneName>`` subdictionary of the ``phaseProperties`` file (located in ``constant/``, or ``constant/<regionName>`` for multi-region cases, e.g. ``constant/fluidRegion``). Here is a snippet enabling the model:
  snippet: |-
    phaseProperties
    {
      physicsModels
      {
        <subModel>
        {
          "<zoneName>"
          {
            type TONBModel;
          }
        }
      }
    }
ai_provenance:
  model: gpt-5.4-nano
  date: '2026-06-26'
  modified_sections:
  - description
  - admonitions
  stub_improved: true
