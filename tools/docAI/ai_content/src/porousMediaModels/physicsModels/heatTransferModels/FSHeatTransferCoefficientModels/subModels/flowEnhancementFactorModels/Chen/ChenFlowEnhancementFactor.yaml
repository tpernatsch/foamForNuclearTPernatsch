description: |
  Chen flow enhancement factor model.

  This model returns a local flow enhancement factor based on the inverse of the
  fluid-side interfacial contact parameter stored in the fluid reference
  material field $XLM$.
formulation: "The flow enhancement factor is computed cell-wise from the fluid reference\nfield $XLM$ (accessed as `pair_.fluidRef().XLM()[celli]`).\n\
  \n$$\\text{invX} = \\frac{1}{XLM}$$\n\n$$f = \n\\begin{cases}\n\\min\\!\\left(2.35\\,(0.213+\\text{invX})^{0.736},\\; f_{\\\
  max}\\right), & \\text{if } \\text{invX} > 0.1002071798 \\\\\n1.0, & \\text{otherwise}\n\\end{cases}$$\n\nwhere:\n\n- $XLM$\
  \ is the fluid reference field value at the cell (OpenFOAM field\n  `pair_.fluidRef().XLM()`)\n- $\\text{invX}$ is the inverse\
  \ of $XLM$\n- $f$ is the returned flow enhancement factor (`value(celli)`)\n- $f_{\\max}$ is the model cap (`maxValue_`)\
  \ inherited from\n  `flowEnhancementFactorModel`\n"
admonitions:
- kind: note
  body: This model is selected solely by its runtime ``typeName`` and defines no additional options.
options: []
usage:
- comment: 'The model is specified via the ``type`` entry in the ``<dictName>/<subModel>/<zoneName>`` subdictionary of the
    ``phaseProperties`` file (located in ``constant/``, or ``constant/<regionName>`` for multi-region cases, e.g. ``constant/fluidRegion``).
    Here is a snippet enabling the model:'
  snippet: |-
    phaseProperties
    {
      physicsModels
      {
        <subModel>
        {
          "<zoneName>"
          {
            type Chen;
          }
        }
      }
    }
ai_provenance:
  model: gpt-5.4-nano
  date: '2026-06-26'
  modified_sections:
  - description
  - formulation
  - admonitions
  stub_improved: true
