description: |
  Heat transfer coefficient model that covers multiple boiling and convection
  regimes, from single-phase forced convection, through two-phase convection,
  sub-cooled boiling and nucleate boiling, up to film boiling.

  The implementation superposes heat-flux contributions from the selected
  sub-models and applies transition/suppression mechanisms to move between
  regimes.
formulation: |
  The wall heat-transfer coefficient is computed from a superposition of
  heat-flux contributions (rather than directly superposing coefficients),
  with additional factors to enhance forced convection and to suppress pool
  boiling as the boiling regime transitions toward film boiling.

  The model evaluates, for each wall cell ``celli``, the forced-convection
  heat flux contribution and the pool-boiling heat flux contribution, then
  combines them using a power-law superposition controlled by
  ``superpositionExponent`` (see ``heatFluxSuperposition`` for the
  heat-flux-based combination mode).

  The pool-boiling component can be reduced by a suppression factor
  (``suppressionFactorModel``) and can be augmented/modified by:
  - a nucleate-boiling onset temperature model (``nucleateBoilingOnsetModel``),
  - a sub-cooled boiling fraction model (``subCooledBoilingFractionModel``),
  - a flow enhancement factor model (``flowEnhancementFactorModel``).

  Variables (as used conceptually by the implementation):
  - $T_w$ is the wall temperature field ``Tw_``
  - $T_f$ is the fluid temperature field ``Tf_``
  - $h_{FC}$ is the forced-convection heat transfer coefficient from
    ``forcedConvectionModel``
  - $h_{PB}$ is the pool-boiling heat transfer coefficient from
    ``poolBoilingModel``
  - $F$ is the flow enhancement factor from ``flowEnhancementFactorModel``
  - $S$ is the suppression factor from ``suppressionFactorModel``
  - $f_{SC}$ is the sub-cooled boiling fraction from
    ``subCooledBoilingFractionModel``
  - $T_{ONB}$ is the nucleate boiling onset temperature from ``nucleateBoilingOnsetModel``
  - $q_{NB}$ is the nucleate boiling heat flux computed by the internal helper
    ``qNB``
admonitions: []
options:
- key: heatFluxSuperposition
  type: bool
  required: true
  description: |
    If true, the model performs the regime superposition on heat fluxes
    (as opposed to superposing heat transfer coefficients).
- key: superpositionExponent
  type: scalar
  required: true
  description: |
    Superposition exponent used to combine the different boiling/convection
    contributions.
usage:
- comment: 'The model is specified via the ``type`` entry in the ``<dictName>/<subModel>/<zoneName>`` subdictionary of the
    ``phaseProperties`` file (located in ``constant/``, or ``constant/<regionName>`` for multi-region cases, e.g. ``constant/fluidRegion``).
    Here is a snippet enabling the model:'
  snippet: |-
    phaseProperties
    {
      physicsModels
      {
        <subModel>
        {
          "<zoneName>"
          {
            type multiRegimeBoiling;
          }
        }
      }
    }
