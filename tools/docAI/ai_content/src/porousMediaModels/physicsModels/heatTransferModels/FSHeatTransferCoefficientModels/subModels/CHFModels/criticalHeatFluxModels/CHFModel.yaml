description: |
  Model for the prediction of the critical heat flux (CHF).

  This class is an abstract base type for CHF correlations. Concrete CHF
  implementations are selected at runtime via the OpenFOAM run-time selection
  mechanism.

  The model is associated with a specific fluid/solid coupling pair
  ([FSPair]) through the stored reference `pair_`.
formulation: |
  This base class does not implement a physical CHF correlation. Derived
  classes must provide the local CHF value through:

  $$ \mathrm{CHF}(celli) = \texttt{value}(celli) $$

  where:

  - $celli$ is the OpenFOAM cell index
  - $\mathrm{CHF}(celli)$ is the predicted critical heat flux at that cell,
    returned as a scalar by the derived implementation
admonitions:
- kind: note
  body: This model is selected solely by its runtime ``typeName`` and defines no additional options.
options: []
usage:
- comment: |
    The model is specified via the ``type`` entry in the ``<dictName>/<subModel>/<zoneName>`` subdictionary of the ``phaseProperties`` file (located in ``constant/``, or ``constant/<regionName>`` for multi-region cases, e.g. ``constant/fluidRegion``). Here is a snippet enabling the model:
  snippet: |-
    phaseProperties
    {
      physicsModels
      {
        <subModel>
        {
          "<zoneName>"
          {
            type CHFModel;
          }
        }
      }
    }
ai_provenance:
  model: gpt-5.4-nano
  date: '2026-06-26'
  modified_sections:
  - description
  - formulation
  - admonitions
  stub_improved: true
