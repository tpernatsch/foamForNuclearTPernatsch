description: |
  Chen suppression factor model for two-phase interfacial contact.
  It returns the fraction of structure interfacial contact that is in
  contact with the dispersed fluid, based on the local dispersed-fluid
  volume fraction.

  This implementation is selected at runtime via the ``type`` entry
  (see ``TypeName("Chen")``).
formulation: |
  The model computes a suppression factor as a function of the local
  dispersed-fluid volume fraction, using the Chen correlation.

  $$ a = \alpha $$
  $$ f = f(a) $$
  $$ \text{value} = f $$

  where:

  - $a$ is the local dispersed-fluid volume fraction, taken from the OpenFOAM
    field ``pair_.fluidRef().normalized()`` at cell ``celli`` (i.e. ``a = pair_.fluidRef().normalized()[celli]``)
  - $f(a)$ is the Chen suppression factor correlation implemented in
    ``Chen::value(const label& celli)``

  The model also lazily determines a pointer to the “other” fluid (the
  continuous/dispersed complement) from the mesh’s registered ``fluid`` objects,
  but the returned suppression factor is computed from the local ``a``.
admonitions:
- kind: note
  body: This model is selected solely by its runtime ``typeName`` and defines no additional options.
dictionary: neutronicsProperties
options: []
usage:
- comment: 'The model is specified via the ``type`` entry in the ``<dictName>/<subModel>/<zoneName>`` subdictionary of the
    ``phaseProperties`` file (located in ``constant/``, or ``constant/<regionName>`` for multi-region cases, e.g. ``constant/fluidRegion``).
    Here is a snippet enabling the model:'
  snippet: |-
    phaseProperties
    {
      physicsModels
      {
        <subModel>
        {
          "<zoneName>"
          {
            type Chen;
          }
        }
      }
    }
