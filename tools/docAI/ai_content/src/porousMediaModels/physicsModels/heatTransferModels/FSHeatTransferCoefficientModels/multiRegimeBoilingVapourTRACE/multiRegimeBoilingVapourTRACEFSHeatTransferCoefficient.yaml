description: |
  Heat transfer coefficient for the transition boiling regime and the
  post-CHF regimes (vapour side). It uses correlations from TRACE.

  The model computes a boiling-side heat transfer coefficient based on the
  local wall temperature and regime indicators (pre-CHF/transition/post-CHF),
  and blends/combines the relevant TRACE sub-correlations.

  Authors:
  Stefan Radman (sradman@pm.me / stefan.radman@epfl.ch)
  Gauthier Lazare (gauthier.lazare@gmail.com)
admonitions:
- kind: note
  body: This model is selected solely by its runtime ``typeName`` and defines no additional options.
options: []
usage:
- comment: 'The model is specified via the ``type`` entry in the ``<dictName>/<subModel>/<zoneName>`` subdictionary of the
    ``phaseProperties`` file (located in ``constant/``, or ``constant/<regionName>`` for multi-region cases, e.g. ``constant/fluidRegion``).
    Here is a snippet enabling the model:'
  snippet: |-
    phaseProperties
    {
      physicsModels
      {
        <subModel>
        {
          "<zoneName>"
          {
            type multiRegimeBoilingVapourTRACE;
          }
        }
      }
    }
ai_provenance:
  model: gpt-5.4-nano
  date: '2026-06-26'
  modified_sections:
  - description
  - admonitions
  stub_improved: true
