description: |
  Heat transfer coefficient model covering multiple boiling regimes, from
  single-phase convection, two-phase convection, sub-cooled and nucleate
  boiling, up to the critical heat flux (CHF) point, including the transition
  and post-CHF film boiling models. The correlations are based on TRACE.

  Stefan Radman (sradman@pm.me / stefan.radman@epfl.ch)
  Gauthier Lazare (gauthier.lazare@gmail.com)
formulation: |
  The total wall heat transfer coefficient is assembled from multiple
  sub-models representing forced convection, pool boiling, film condensation,
  and (optionally) annular-flow contributions, with additional multiplicative
  factors to account for flow enhancement and boiling suppression. CHF and
  Leidenfrost effects are used to switch between pre-CHF, transition, and
  post-CHF regimes, following TRACE-based modeling.

  $$ h = h_{FC} + S \, h_{PB} + h_{Cnd} + h_{AF} $$

  where the pool-boiling contribution is suppressed near/after CHF by a
  suppression factor $S$, and the forced-convection contribution is modified by
  a flow enhancement factor $F$:

  $$ h_{FC} = F \, h_{FC}^{base} $$

  The CHF-related regime selection introduces a transition weighting and a
  Leidenfrost temperature for vapour, which are computed by the corresponding
  TRACE sub-models.

  - $h$ is the effective wall heat transfer coefficient (returned by ``value``)
  - $h_{FC}$ is the forced-convection heat transfer coefficient
  - $h_{PB}$ is the pool-boiling heat transfer coefficient
  - $S$ is the suppression factor model output (turns off pool boiling as
    boiling transitions to film boiling)
  - $h_{Cnd}$ is the film condensation heat transfer coefficient (optional)
  - $h_{AF}$ is the annular-flow heat transfer coefficient (optional)
  - $F$ is the flow enhancement factor model output
  - $h_{FC}^{base}$ is the base forced-convection coefficient before enhancement
  - CHF-related regime switching uses ``CHFModel`` and ``TLFModel`` outputs
options:
- key: absoluteSurfaceRoughness
  type: scalar
  required: false
  default: 4e-7
  description: |
    Absolute surface roughness used by the TRACE-based CHF/boiling-related
    correlations (default: $4\times 10^{-7}$ m).
usage:
- comment: |
    The model is specified via the ``type`` entry in the ``<dictName>/<subModel>/<zoneName>`` subdictionary of the ``phaseProperties`` file (located in ``constant/``, or ``constant/<regionName>`` for multi-region cases, e.g. ``constant/fluidRegion``). Here is a snippet enabling the model:
  snippet: |-
    phaseProperties
    {
      physicsModels
      {
        <subModel>
        {
          "<zoneName>"
          {
            type multiRegimeBoilingTRACECHF;
          }
        }
      }
    }
admonitions:
- kind: note
  body: This model is selected solely by its runtime ``typeName`` and defines no additional options.
ai_provenance:
  model: gpt-5.4-nano
  date: '2026-06-26'
  modified_sections:
