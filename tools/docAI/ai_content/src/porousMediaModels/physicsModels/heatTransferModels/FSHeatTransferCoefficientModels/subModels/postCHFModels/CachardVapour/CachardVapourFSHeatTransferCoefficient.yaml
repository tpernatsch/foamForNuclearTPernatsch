description: |
  Heat transfer coefficient for Inverted Annular Flow - for the vapour phase.

  This model cooperates with the [@CachardLiquidFSHeatTransferCoefficient] model.

  The implementation is intended for rod bundles, in particular for the vapour film thickness (delta) evaluation.

  Gauthier LAZARE - gauthier.lazare@gmail.com
formulation: |
  The vapour-phase heat transfer coefficient is computed from a vapour film thickness
  correlation (Cachard-type) and a conduction-only estimate through the film.

  $$ h = \frac{2 k_g}{\delta} $$

  where the vapour film thickness $\delta$ is estimated from the hydraulic diameter $D_h$,
  the local void fraction $\alpha$, and the local pressure $p$:
  $$ \delta = \frac{D_h}{2}\left(\sqrt{1+\alpha\left(\frac{4}{\pi}\left(\frac{p}{D_{R}}\right)^2-1\right)}-1\right) $$

  In the code, $D_R$ is fixed to $0.01$ and a small floor is applied to avoid division by zero.

  - $h$ is the vapour-phase heat transfer coefficient (W/m$^2$/K)
  - $k_g$ is the vapour thermal conductivity (field: `kappa.vapour`, W/m/K)
  - $\delta$ is the vapour film thickness (m)
  - $D_h$ is the hydraulic diameter (field from `pair.fluidRef().Dh()`, m)
  - $\alpha$ is the normalized void fraction (field: `pair.fluidRef().normalized()`)
  - $p$ is the local pressure (field: `p`, Pa)
  - $D_R$ is the fixed reference length scale used in the delta correlation (set to $0.01$)
admonitions:
- kind: note
  body: This model is selected solely by its runtime ``typeName`` and defines no additional options.
options: []
usage:
- comment: |
    The model is specified via the ``type`` entry in the ``<dictName>/<subModel>/<zoneName>`` subdictionary of the ``phaseProperties`` file (located in ``constant/``, or ``constant/<regionName>`` for multi-region cases, e.g. ``constant/fluidRegion``). Here is a snippet enabling the model:
  snippet: |-
    phaseProperties
    {
      physicsModels
      {
        <subModel>
        {
          "<zoneName>"
          {
            type CachardVapour;
          }
        }
      }
    }
