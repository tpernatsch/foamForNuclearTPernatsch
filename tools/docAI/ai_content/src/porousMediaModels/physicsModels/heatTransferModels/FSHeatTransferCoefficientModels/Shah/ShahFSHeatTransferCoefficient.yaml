description: |-
  Heat transfer coefficient for pool boiling scenarios calculated via the
  correlation devised by Shah, primarily for liquid metals such as sodium or
  Na–K alloys.

  **IMPLEMENTATION NOTES**

  The original Shah pool-boiling heat transfer coefficient is given by:

  .. math::

      htc_{PB} = C \, q^{n} \, p_{R}^{m}

  where :math:`C`, :math:`n`, and :math:`m` are constants, :math:`p_{R}` is the
  reduced pressure (ratio of fluid pressure to critical pressure), and :math:`q`
  is the wall–fluid heat flux. This form is not directly usable numerically
  because :math:`htc_{PB}` depends on :math:`q`, while :math:`q` depends on
  :math:`htc`. In general:

  .. math::

      q = htc \, (T_{\mathrm{wall}} - T_{f})

  where :math:`htc` is the total heat transfer coefficient, :math:`T_{\mathrm{wall}}`
  the wall temperature, and :math:`T_f` the fluid temperature.

  By assuming :math:`htc \approx htc_{PB}` — a common approximation used in
  other codes as well — one obtains:

  .. math::

      htc_{PB}
      = C \,
        \left(
          htc_{PB} \, (T_{\mathrm{wall}} - T_f)
        \right)^{n}
        p_{R}^{m}

  which can be rearranged to isolate :math:`htc_{PB}`:

  .. math::

      htc_{PB}
      =
      \left[
        C \,
        (T_{\mathrm{wall}} - T_f)^{n}
        \, p_{R}^{m}
      \right]^{\frac{1}{1-n}}

  This rearranged form is used in the implementation. Although the assumption
  :math:`htc \approx htc_{PB}` is crude, it is widely employed in practice to
  obtain a numerically feasible formulation. For example, the TRACE code uses a
  similar strategy (though with the Gorenflo correlation rather than Shah’s),
  where :math:`htc_{PB}` depends on wall heat flux.

  **On parameters :math:`C`, :math:`m`, and :math:`n`**

  Shah provided the following values:

  - :math:`C = 13.7`, :math:`m = 0.22` for :math:`p_R < 10^{-3}`
  - :math:`C = 6.9`,  :math:`m = 0.12` for :math:`p_R > 10^{-3}`
  - :math:`n = 0.7` always

  The discontinuity at :math:`p_R = 10^{-3}` is undesirable numerically.
  Therefore, the implementation linearly interpolates :math:`C` and :math:`m`
  in the interval :math:`(pR0, \, pR0 + \Delta p_R)`, where currently
  :math:`pR0 = 5\times10^{-4}` and :math:`\Delta p_R = 10^{-3}`. These values
  are somewhat arbitrary and may (should) be revised in the future.
options:
- key: useExplicitHeatFlux
  type: bool
  required: false
  default: false
  description: |
    If true, use the explicit wall heat flux field ``heatFlux.structure``.
    If false, compute the heat-flux contribution implicitly from the wall and
    fluid temperatures using ``Twall`` and ``Tf`` from the fluid-structure pair.
usage:
- comment: "The Shah heat transfer model is constructed at run-time via the\nheatTransferModels subdictionary of the physicsModel\
    \ subdictionary of the phaseProperties dictionary. "
  snippet: |-
    physicsModels
    {
      heatTransferModels
      {
        "liquid.structure"
        {
            "heated"
            {
                type    Shah;
            }
        }
      }
    }
