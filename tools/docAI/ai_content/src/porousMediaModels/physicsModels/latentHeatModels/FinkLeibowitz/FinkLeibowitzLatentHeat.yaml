description: |
  Latent heat of vaporization model for liquid sodium based on the
  correlations reported by Fink & Leibowitz (ANL RE 95/2),
  https://www.ne.anl.gov/eda/ANL-RE-95-2.pdf.
formulation: |
  The model returns the latent heat of vaporization as a function of the
  local temperature $T$ (in K). The implementation clamps the temperature
  to the correlation validity range before evaluating the Fink–Leibowitz
  fit.

  $$
  T_c = \min\left(\max(T,\,371),\,2500\right)
  $$
  $$
  \theta = 1 - \frac{T_c}{2503.7}
  $$
  $$
  h_{fg}(T) = 393370\,\theta + 4398600\,\theta^{0.29302}
  $$

  where:

  - $T$ is the local temperature (OpenFOAM field value used as $iT_[celli]$), in K
  - $T_c$ is the clamped temperature used by the correlation, in K
  - $\theta$ is the dimensionless temperature-shift variable
  - $h_{fg}(T)$ is the latent heat of vaporization returned by
    `value(celli)`, in the model's energy units (as used consistently by the
    surrounding phase-change framework)
admonitions:
- kind: note
  body: This model is selected solely by its runtime ``typeName`` and defines no additional options.
options: []
usage:
- comment: 'The model is specified via the ``type`` entry in the ``<dictName>/<subModel>/<zoneName>`` subdictionary of the
    ``phaseProperties`` file (located in ``constant/``, or ``constant/<regionName>`` for multi-region cases, e.g. ``constant/fluidRegion``).
    Here is a snippet enabling the model:'
  snippet: |-
    phaseProperties
    {
      physicsModels
      {
        <subModel>
        {
          "<zoneName>"
          {
            type FinkLeibowitz;
          }
        }
      }
    }
ai_provenance:
  model: gpt-5.4-nano
  date: '2026-06-26'
  modified_sections:
  - description
