description: |
  Class that computes latent heat based on the specified enthalpies of
  formation of the fluids. These are specified under the `Hf` keyword
  in the thermophysical properties of the two fluids. The latent heat is thus
  computed as $Hf_{vapour} - Hf_{liquid}$.
formulation: |
  This latent-heat model derives the latent heat field $L$ directly from the
  difference between the specific enthalpies of the vapour and liquid phases
  as provided by their thermophysical models (using the `hc()` quantity).

  $$ L = LSign \left( h_c^{vapour} - h_c^{liquid} \right) $$

  where:

  - $L$ is the OpenFOAM latent heat scalar field (passed as `volScalarField& L`)
  - $LSign$ is the sign factor stored in the base class (`LSign_`)
  - $h_c^{vapour}$ is the vapour-phase thermophysical enthalpy quantity
    returned by `vapour_.thermo().hc()`
  - $h_c^{liquid}$ is the liquid-phase thermophysical enthalpy quantity
    returned by `liquid_.thermo().hc()`

  After computing $L$, the model calls the base-class adjustment routine
  (`this->adjust(L)`), which may enforce consistency constraints defined by
  the `latentHeatModel` interface.
admonitions:
- kind: note
  body: This model is selected solely by its runtime ``typeName`` and defines no additional options.
options: []
usage:
- comment: 'The model is specified via the ``type`` entry in the ``<dictName>/<subModel>/<zoneName>`` subdictionary of the
    ``phaseProperties`` file (located in ``constant/``, or ``constant/<regionName>`` for multi-region cases, e.g. ``constant/fluidRegion``).
    Here is a snippet enabling the model:'
  snippet: |-
    phaseProperties
    {
      physicsModels
      {
        <subModel>
        {
          "<zoneName>"
          {
            type fromThermophysicalPropertiesLatentHeat;
          }
        }
      }
    }
