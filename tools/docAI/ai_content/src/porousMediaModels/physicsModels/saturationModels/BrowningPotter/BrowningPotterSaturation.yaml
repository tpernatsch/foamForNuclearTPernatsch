description: |
  Saturation model based on results by Browning and Potter (see
  https://www.ne.anl.gov/eda/ANL-RE-95-2.pdf).

  The saturation pressure is expressed in terms of the saturation
  temperature as:

  lnPSat = A + B/TSat + C*ln(TSat),

  which is not directly invertible for $T_{Sat}$. In this implementation,
  $T_{Sat}$ is obtained by approximating $\ln(T_{Sat})$ with a second-order
  polynomial.
formulation: |
  The model provides saturation properties as functions of the local
  thermodynamic state. It is used by phase-change models to evaluate
  saturation temperature and pressure, and their derivatives.

  The saturation pressure correlation is written as:

  $$
  \ln P_{Sat} = A + \frac{B}{T_{Sat}} + C \ln(T_{Sat})
  $$

  where $A$, $B$, and $C$ are correlation constants (set by the selected
  saturation model parameters in the parent phase-change model).

  Since the above relation is not analytically invertible for $T_{Sat}$,
  the implementation computes $T_{Sat}$ by approximating $\ln(T_{Sat})$
  with a second-order polynomial.

  The class interface exposes the following quantities at a given cell:
  - $T_{Sat}$ is the saturation temperature returned by ``valueTSat``
  - $P_{Sat}$ is the saturation pressure returned by ``valuePSat``
  - $\ln P_{Sat}$ is the logarithm of saturation pressure returned by
    ``valueLnPSat``
  - $\frac{dP_{Sat}}{dT_{Sat}}$ is the saturation-pressure derivative returned
    by ``valuePSatPrime``
