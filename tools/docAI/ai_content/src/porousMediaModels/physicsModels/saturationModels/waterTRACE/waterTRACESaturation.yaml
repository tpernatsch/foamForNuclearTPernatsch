description: |
  Saturation model for water in the 0.01--350 $^\circ$C range based on TRACE:
  https://www.nrc.gov/docs/ML1200/ML120060218.pdf

  This implementation provides cell-wise saturation temperature and saturation
  pressure (and related derivatives) as functions of the local thermodynamic
  state.
formulation: |
  The model returns saturation properties of water as functions of temperature
  and pressure, using TRACE-based correlations.

  The class provides:
  - $T_\mathrm{sat}$ as a function of pressure $p$
  - $p_\mathrm{sat}$ as a function of temperature $T$
  - $\ln(p_\mathrm{sat})$ and the pressure derivative $\frac{dp_\mathrm{sat}}{dT}$

  where the saturation values are evaluated per-cell using the local fields
  accessed from the phase-change model:
  - $T$ is the local temperature field ``iT_`` (from ``pcm.pair().iT()``)
  - $p$ is the local pressure field ``p_`` (looked up as ``p`` on the mesh)
options: []
usage:
- comment: |
    The model is specified via the ``type`` entry in the ``<dictName>/<subModel>/<zoneName>`` subdictionary of the ``phaseProperties`` file (located in ``constant/``, or ``constant/<regionName>`` for multi-region cases, e.g. ``constant/fluidRegion``). Here is a snippet enabling the model:
  snippet: |-
    phaseProperties
    {
      physicsModels
      {
        <subModel>
        {
          "<zoneName>"
          {
            type waterTRACE;
          }
        }
      }
    }
admonitions:
- kind: note
  body: This model is selected solely by its runtime ``typeName`` and defines no additional options.
ai_provenance:
  model: gpt-5.4-nano
  date: '2026-06-26'
  modified_sections:
  - description
  - formulation
  - admonitions
  stub_improved: true
