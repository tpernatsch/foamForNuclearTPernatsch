description: |
  Constant model that returns a user-specified constant value for every cell.

  This class is a thin wrapper around a `baseModel` and overrides the
  `value(celli)` accessor to always return the same value, independent of
  the cell index.
formulation: |
  The model assumes the quantity of interest is spatially uniform and
  temporally constant, i.e. it does not depend on the local flow regime or
  any other field.

  $$ value(c) = value_ $$

  where:

  - $value(c)$ is the model output returned by `value(const label& celli)`
  - $value_$ is the constant value read from the input dictionary
admonitions: []
options:
- key: value
  type: valueType
  required: true
  description: |
    Constant value returned by `value(celli)` for all cells.
usage:
- comment: 'The model is specified via the ``type`` entry in the ``<dictName>/<subModel>/<zoneName>`` subdictionary of the
    ``phaseProperties`` file (located in ``constant/``, or ``constant/<regionName>`` for multi-region cases, e.g. ``constant/fluidRegion``).
    Here is a snippet enabling the model:'
  snippet: |-
    phaseProperties
    {
      physicsModels
      {
        <subModel>
        {
          "<zoneName>"
          {
            type constantModel;
          }
        }
      }
    }
ai_provenance:
  model: gpt-5.4-nano
  date: '2026-06-26'
  modified_sections:
  - description
  - formulation
  - admonitions
  - options
  stub_improved: true
