description: |
  constantModels model.

  This class provides a *constant* implementation of multiple interfacial/phase-coupling sub-models by selecting a `constantModel<scalar, <SubModel>>` specialization at runtime (via OpenFOAM's named run-time selection tables). It does not introduce additional physics beyond delegating to the corresponding `constantModel` specialization.
formulation: |
  The selected model is a constant-valued closure for the corresponding sub-model quantity. In practice, the sub-model implementation is provided by `constantModel<scalar, <SubModel>>`, which returns a spatially and temporally constant value for the targeted closure field.

  The exact physical meaning of the constant depends on which sub-model is selected, e.g.:
  - latent heat: $h_{fg} = \text{const}$
  - fluid diameter: $d_f = \text{const}$
  - interfacial area: $a_{i} = \text{const}$
  - contact partition: $\chi = \text{const}$
  - drag coefficient (FF/FS): $C_D^{FF}=\text{const}$, $C_D^{FS}=\text{const}$
  - virtual mass coefficient: $C_{vm}=\text{const}$
  - heat transfer coefficient (FF/FS): $h_{FF}=\text{const}$, $h_{FS}=\text{const}$

  - $h_{fg}$ is the latent heat closure value
  - $d_f$ is the characteristic fluid diameter closure value
  - $a_i$ is the interfacial area closure value
  - $\chi$ is the contact partition closure value
  - $C_D^{FF}$ and $C_D^{FS}$ are drag coefficient closure values for FF and FS interactions
  - $C_{vm}$ is the virtual mass coefficient closure value
  - $h_{FF}$ and $h_{FS}$ are interfacial heat transfer coefficient closure values for FF and FS interactions
admonitions:
- kind: note
  body: This model is selected solely by its runtime ``typeName`` and defines no additional options.
options: []
usage:
- comment: 'The model is specified via the ``type`` entry in the ``<dictName>/<subModel>/<zoneName>`` subdictionary of the
    ``phaseProperties`` file (located in ``constant/``, or ``constant/<regionName>`` for multi-region cases, e.g. ``constant/fluidRegion``).
    Here is a snippet enabling the model:'
  snippet: |-
    phaseProperties
    {
      physicsModels
      {
        <subModel>
        {
          "<zoneName>"
          {
            type constantModels;
          }
        }
      }
    }
