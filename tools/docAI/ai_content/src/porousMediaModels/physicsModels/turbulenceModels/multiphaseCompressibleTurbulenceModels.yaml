description: |-
  Runtime-selection wrapper for multiphase compressible turbulence models.

  This class provides the factory/registration mechanism for phase-based compressible turbulence
  models (laminar, RAS, and LES) built on top of the underlying
  `PhaseCompressibleTurbulenceModel` infrastructure.

  .. toctree::
     :maxdepth: 1
     :glob:

     ./**
admonitions:
- kind: note
  body: This model is selected solely by its runtime ``typeName`` and defines no additional options.
options: []
usage:
- comment: |
    The model is specified via the ``type`` entry in the ``<dictName>/<subModel>/<zoneName>`` subdictionary of the ``phaseProperties`` file (located in ``constant/``, or ``constant/<regionName>`` for multi-region cases, e.g. ``constant/fluidRegion``). Here is a snippet enabling the model:
  snippet: |-
    phaseProperties
    {
      physicsModels
      {
        <subModel>
        {
          "<zoneName>"
          {
            type multiphaseCompressibleTurbulenceModels;
          }
        }
      }
    }
ai_provenance:
  model: gpt-5.4-nano
  date: '2026-06-26'
  modified_sections:
  - description
  - admonitions
  stub_improved: true
