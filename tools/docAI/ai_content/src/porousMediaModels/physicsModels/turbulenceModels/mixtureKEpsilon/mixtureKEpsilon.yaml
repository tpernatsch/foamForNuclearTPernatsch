description: |-
  Mixture k–ε turbulence model for two-phase gas–liquid systems.

  This RANS model implements a mixture-averaged k–ε formulation for Euler–Euler
  gas–liquid flows. The basic structure follows:

      Behzadi, A., Issa, R. I., & Rusche, H. (2004).
      Modelling of dispersed bubble and droplet flow at high phase fractions.
      Chemical Engineering Science, 59(4), 759–770.

  In this implementation, an effective gas density is used in the averaging
  procedure, and bubble-generated turbulence is modelled following:

      Lahey Jr, R. T. (2005).
      The simulation of multidimensional multiphase flows.
      Nuclear Engineering and Design, 235(10), 1043–1060.

  Default model coefficients (sub-dictionary ``mixtureKEpsilonCoeffs``):

  .. code-block:: none

      mixtureKEpsilonCoeffs
      {
          Cmu       0.09;
          C1        1.44;
          C2        1.92;
          C3        C2;
          Cp        0.25;
          sigmak    1.0;
          sigmaEps  1.3;
      }

  The coefficient ``Cp`` scales the bubble-induced turbulence source terms,
  while ``Cmu``, ``C1``, ``C2``, ``C3``, ``sigmak`` and ``sigmaEps`` retain
  their standard k–ε roles in production, dissipation and diffusion.
options:
- key: mixtureKEpsilonCoeffs
  type: dictionary
  required: false
  description: Coefficient sub-dictionary for the mixture k–ε model containing Cmu, C1, C2, C3, Cp, sigmak and sigmaEps.
usage:
- comment: |-
    The model is selected in the RAS section of the``turbulenceProperties`` dictionary for the gas and
    liquid phases. A minimal example for a phase using ``mixtureKEpsilon`` is:
  snippet: |-
    RAS
    {
        RASModel            mixtureKEpsilon;
        turbulence          on;
        printCoeffs         on;

        mixtureKEpsilonCoeffs
        {
            Cmu       0.09;
            C1        1.44;
            C2        1.92;
            C3        1.92;
            Cp        0.25;
            sigmak    1.0;
            sigmaEps  1.3;
        }
    }
- comment: |-
    The model automatically identifies which phase is liquid and which is gas
    from the registered ``fluid`` objects. Ensure that in the corresponding
    (foamForNuclear) phase property dictionaries the ``stateOfMatter`` entries
    are correctly set:
  snippet: |-
    // Example: phaseProperties.liquidProperties
    stateOfMatter  liquid;

    // Example: phaseProperties.gasProperties
    stateOfMatter  gas;
