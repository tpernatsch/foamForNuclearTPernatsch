description: |-
  Same as the standard OpenFOAM kEpsilon model in non-porous regions, while
  forcing k and epsilon to their equilibrium values
  inside porous zones. These equilibium values can be set in the
  porousKepsionProperties sub-dictionary. k and epsilon are
  determined based on correlations for tubulent intensity (I) and lengh
  scale (L). Turbulent intensity correlations are in the form
  :math:`A \, Re^{\,B}`, where :math:`A` and :math:`B` are set by the
  ``turbulenceIntensityCoeff`` and ``turbulenceIntensityExp`` parameters.
  The Reynolds number is calculated by the structure class, according
  to the input data in phaseProperties.
  Please note that a porous medium simulation using the porousKEpsilon
  model entails the risk of an unstable solution. This is due to the fact
  that the turbulent viscosity will be that of the sub-scale structure, and
  thus not enough to stabilize a solution on the length scale of the coarse
  mesh. To address this problem, one can define the keyword DhStruct. This
  keyword defines the hydraulic diameter of the whole porous structure. The
  code uses it to make sure the turbulent viscosity results in a laminar
  Reynolds number (defaulted to 500).
options:
- key: DhStruct
  type: scalar
  required: false
  description: Hydraulic diameter of the whole porous structure. Used to rescale the turbulent viscosity and improve numerical
    stability.
- key: convergenceLength
  type: scalar
  required: true
  description: k and epsilon will exponentially converge to equilibrium according to this exponent.
- key: turbulenceIntensityCoeff
  type: scalar
  required: true
  description: :math:`A` in :math:`A \, Re^{\,B}`.
- key: turbulenceIntensityExp
  type: scalar
  required: true
  description: :math:`B` in :math:`A \, Re^{\,B}`.
- key: turbulenceLengthScaleCoeff
  type: scalar
  required: true
  description: :math:`C` in :math:`L = C \, D_h`, where :math:`D_h` is the hydraulic diameter.
usage:
- comment: This is an example of ``turbulenceProperties`` dictionary
  snippet: "RAS\n{\n    RASModel            porousKEpsilon;\n    turbulence          on;\n    printCoeffs         on;\n\n\
    \    porousKEpsilonCoeffs\n    {\n        Cmu       0.09;\n        C1        1.44;\n        C2        1.92;\n        C3\
    \        1.92;\n        Cp        0.25;\n        sigmak    1.0;\n        sigmaEps  1.3;\n        Prt       1.0;\n    }\n\
    }\nporousKEpsilonProperties\n{\n    \"zones of application\"\n    {\n        convergenceLength           0.5; \n     \
    \   turbulenceIntensityCoeff    0.16;\n        turbulenceIntensityExp      -0.125;\n        turbulenceLengthScaleCoeff\
    \  0.07;\n    }\n}"
notes:
- This model requires that each porous region in ``structure.regions()`` with non-zero volume fraction appears in ``porousKEpsilonProperties``.
dictionary: porousKEpsilonProperties
