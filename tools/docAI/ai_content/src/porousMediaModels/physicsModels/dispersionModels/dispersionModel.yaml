description: |-
  Base class for dispersion models defining which phase is dispersed and how. Available runtime selectable models include:

  .. toctree::
     :maxdepth: 1
     :glob:

     ./**
options: []
usage:
- comment: 'The dispersion model is constructed at run-time via the  dispersionModel subdictionary of the pairGeometryModels
    subdictionary of the physicsModel subdictionary of the phaseProperties dictionary. An example is reported below. Please
    note that the example makes use of the byRegime templated model, allowing to give different types to different regimes.
    Notice also that the constant model used in the example is not the templated constant model used elsewhere in foamForNuclear,
    but the constantDispersion sub-model listed above. '
  snippet: |-
    physicsModels
    {
      pairGeometryModels
      {
          "liquid.vapour"
          {
              dispersionModel
              {
                  type        byRegime;
                  regimeMap   "annularMist";
                  "annular"
                  {
                      type                constant;
                      dispersedPhase      "vapour";
                  }
                  "mist"
                  {
                      type                constant;
                      dispersedPhase      "liquid";
                  }
              }
          }
      }
    }
