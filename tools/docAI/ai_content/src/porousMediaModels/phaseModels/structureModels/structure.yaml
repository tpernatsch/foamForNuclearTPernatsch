description: |-
  Class to handle the description of a mesh-unresolved structure. It is
  derived from phaseBase, to represent the volume fraction of the structure.
  The key member for the understanding of this class is cellFields_.
  The structure can be in fact though of as being composed by different
  regions, with properties defined only on certain cells of the mesh.
  However, as these region are meant NOT to spatially overlap, the
  overall structure can be described by a single set of fields (Dh_, iApow_,
  etc.) that are initialized/set/modified on a cell-by-cell basis.
  The cellFields_ member is thus a HashTable of scalarFields indexed by
  region name. These scalarFields are = 1.0 where the given
  region exists, and 0 elsewhere. What the region names are, that
  is set by the actual run-time-selected instance of the structure
options:
- key: Dh
  type: scalar
  required: true
  description: Hydraulic diameter in m
- key: volumeFraction
  type: scalar
  required: true
  description: Volume fraction of structure
- key: powerModel
  type: dict
  required: false
  description: Dictionary containing the power model
- key: passiveProperties
  type: dict
  required: false
  description: Dictionary containing the passive structure properties
- key: volumetricArea
  type: scalar
  required: true
  description: Volumetric area of the passive structure in m2/m3
- key: Cp
  type: scalar
  required: true
  description: Specific heat capacity in J/kg/K of the passive structure
- key: rho
  type: scalar
  required: true
  description: Density in kg/m3 of the passive structure
- key: rhoCp
  type: scalar
  required: false
  description: Product of the density and specific heat capacity in J/m3/K of the passive structure
- key: T
  type: scalar
  required: true
  description: Initial temperature value in K applied to the ``T.passiveStructure`` field of the passive structure
- key: localTortuosity
  type: vector
  required: false
  description: |
    Local tortuosity vector components used to construct the tortuosity tensor in the global frame.
- key: localX
  type: vector
  required: false
  default: '[1 0 0]'
  description: |
    Local X direction vector used to construct the local-to-global rotation matrix. If not provided, defaults to $(1,0,0)$.
- key: localZ
  type: vector
  required: false
  default: '[0 0 1]'
  description: |
    Local Z direction vector used to construct the local-to-global rotation matrix. If not provided, defaults to $(0,0,1)$.
- key: type
  type: word
  required: true
  description: Structure type (run-time selected)
usage:
- comment: 'The model is specified via the ``type`` entry in the ``<dictName>/<subModel>/<zoneName>`` subdictionary of the
    ``phaseProperties`` file (located in ``constant/``, or ``constant/<regionName>`` for multi-region cases, e.g. ``constant/fluidRegion``).
    Here is a snippet enabling the model:'
  snippet: |-
    phaseProperties
    {
        structureProperties
        {
            "<zoneName>"
            {
                volumeFraction  0.5;
                Dh              0.01;

                powerModel
                {
                    type    ...;
                    ...
                }

                passiveProperties
                {
                    volumetricArea      2;
                    rho                 7700;
                    Cp                  500;
                    T                   600;
                }
            }
        }
    }
dictionary: structureProperties
ai_provenance:
  model: gpt-5.4-nano
  date: '2026-06-26'
  modified_sections:
  - options
  - dictionary
