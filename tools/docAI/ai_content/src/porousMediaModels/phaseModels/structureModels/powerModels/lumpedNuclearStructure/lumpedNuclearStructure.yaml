description: |-
  Model for representing a lumped-parameter structure characterized
  by a user selectable number of nodes (indicated below as T[idx]).

  \verbatim
  Tmax            T[0]           T[1]          T[n-1]         Tsurface
    | --- H[0] --- | --- H[1] --- | --- H[2] --- |  --- H[n] --- |
  \endverbatim

  Note that only T[idx] are state variables while Tmax and Tsurface can
  be found after matrix solution.
  Note also that one needs n+1 conductances when solving for n nodes
  The equation in the class can be obtained starting from a simple
  energy balance for the ith node:

  $$
      V_i \rho_i c_{p,i} \frac{dT}{dt} =
      V Q q_f + H_i (T_{i-1} - T_i) - H_{i+1}(T_i - T_{i+1})
  $$

  and dividing all terms by the volume of the structure.
  This means that the heat conductances should be calculated as
  the power flowing between two nodes divided by the difference in
  temperatures at steadystate, and divided by the volume of the
  structure.
  Note that Q is the power density from neutronics, which is
  assumed to spread over all structure. The power fraction qf
  can be used to concentrate this power over certain nodes.
  Zero-gradient BCs are used at the inner boundary and convective
  BCs are used at the external boundary (in contact with the coolant).
options:
- key: T0
  type: scalar
  required: true
  default: null
  description: Initial temperature, if no found in the time folder
- key: fractionOfPowerFromNeutronics
  type: scalar
  required: false
  default: '1.0'
  description: Fraction of power from neutronics that goes to this powerModel.  This takes into account for instance cases
    where some of the heating goes to the moderator
- key: heatConductances
  type: scalar
  required: true
  default: null
  description: Heat conductances from average to max, and average to surface. Note that heat conductances (W/K) must be divided
    by the volume of the entire structure. There must be one more conductance than the number of nodes
- key: kappaMatrix
  type: scalar
  required: false
  default: '0.0'
  description: Thermal conductivity in the matrix to compute the thermal diffusion.
- key: nodeClad
  type: int
  required: true
  default: null
  description: Define which node temperature is used to parametrize XS according to nuclearDataCladExp. Of course, it does
    not have to represent a cladding. It could be used to parametrize over the graphite temperature in PBRs
- key: nodeFuel
  type: int
  required: true
  default: null
  description: Define which node temperature is used to parametrize XS according to nuclearDataFuelTemp
- key: nodeMatrix
  type: int
  required: false
  default: '0'
  description: Thermal conductivity in the matrix to compute the thermal diffusion.
- key: nodesNumber
  type: int
  required: true
  default: null
  description: Number of nodes
- key: powerFractions
  type: scalar
  required: true
  default: null
  description: Fraction of total power in the strucure that goes to each node
- key: rhoCp
  type: scalar
  required: true
  default: null
  description: rho*Cp for each node
- key: volumeFractions
  type: scalar
  required: true
  default: null
  description: Fraction of the volume of the structure occupied by each node
usage:
- comment: The following sub-dictionary should be included as a powerModel in phaseProperties.
  snippet: "\n// Example for one node:\npowerModel\n{\n    type                lumpedNuclearStructure;\n    volumetricArea\
    \      40;\n    powerDensity        5e6; \n    nodesNumber         1; \n    nodeFuel            0; \n    nodeClad    \
    \        0; \n    nodeMatrix          0; \n    kappaMatrix         10; \n    heatConductances    (450000 225000); \n \
    \   rhoCp               (53576.92); \n    volumeFractions     (1); \n    powerFractions      (1); \n    T0           \
    \       900; \n}\n\n// Example for 3 nodes:\npowerModel\n{\n    type                lumpedNuclearStructure;\n    volumetricArea\
    \      40;\n    powerDensity        5e6;\n    nodesNumber         3;\n    nodeFuel            0;\n    nodeClad       \
    \     1;\n    nodeMatrix          2;\n    kappaMatrix         12;\n    heatConductances    (600000 240000 600000 1200000);\n\
    \    rhoCp               (53576.92 53576.92 53576.92);\n    volumeFractions     (0.75 0.125 0.125);\n    powerFractions\
    \      (1 0 0);\n    T0                  900;\n}"
- comment: 'The model is specified via the ``type`` entry in the ``<dictName>/<subModel>/<zoneName>`` subdictionary of the
    ``phaseProperties`` file (located in ``constant/``, or ``constant/<regionName>`` for multi-region cases, e.g. ``constant/fluidRegion``).
    Here is a snippet enabling the model:'
  snippet: |-
    phaseProperties
    {
        structureProperties
        {
            "<zoneName>"
            {
                powerModel
                {
                    type lumpedNuclearStructure;
                }
            }
        }
    }
dictionary: neutronicsProperties
