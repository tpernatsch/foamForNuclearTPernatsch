description: |
  Model for representing a heated pin with constant material properties that
  is coupled to the fluid(s) via a convective boundary condition. The
  pin temperature profile is computed using a finite-volume discretization
  in the radial direction with constant $\rho$, $C_p$, and $k$.
formulation: |
  The heated pin is modeled as a 1-D radial conduction problem across a
  cylindrical solid (fuel/cladding regions) with volumetric heat generation
  provided by the coupled neutronics/heat source through the local power
  density. The resulting outer surface temperature is then used to impose
  a convective boundary condition to the surrounding fluid.

  For each computational cell, the radial temperature profile is updated by
  solving the steady conduction equation with constant properties:

  $$
  \frac{1}{r}\frac{d}{dr}\left(r k \frac{dT}{dr}\right) + q''' = 0
  $$

  where:

  - $r$ is the radial coordinate across the pin (set by ``innerRadius``, ``outerRadius``, and ``meshSize``)
  - $T$ is the local pin temperature (stored in ``Trad_`` and region temperatures ``Ti_``/``To_``)
  - $k$ is the pin thermal conductivity (set by ``k``)
  - $q'''$ is the volumetric heat generation rate (provided via the coupled ``powerDensity_`` field)
  - $\rho C_p$ is the volumetric heat capacity (set by either ``rho`` and ``Cp`` or directly by ``rhoCp``)

  The model also computes a cell-averaged temperature ``Tav_`` and tracks
  local min/max temperatures (``Tmin_``, ``Tmax_``) for consistency checks.
