usage:
- comment: |
    Example configuration of the ``heatedPin`` power model (single region)
    in ``constant/<fluidRegion>/phaseProperties``.
  snippet: |-
    powerModel
            {
                type            heatedPin;
                innerRadius     0;
                outerRadius     0.003;
                k               20;
                meshSize        6;
                T               653.15;
                Cp              500;
                rho             7700;

                powerOffCriterionModel
                {
                    type            timeThreshold;
                    time            12.475;
                }
            }
