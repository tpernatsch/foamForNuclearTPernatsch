description: |
  Fuel behavior sub-solver.

  This class acts as a top-level orchestrator for the coupled fuel physics
  sub-models (materials, heat source, burnup, neutronics feedback, fission gas
  release, gap gas, thermal and mechanical sub-solvers, corrosion, and element
  transport). It advances the coupled fuel state and provides utility
  functions such as the maximum outer cladding temperature extraction.
