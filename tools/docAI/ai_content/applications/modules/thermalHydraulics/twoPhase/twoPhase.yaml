description: |-
  This class encapsulates a two‑fluid + 1 stationary‑structure Eulerian solver.
  The pressure field being solves for is *p_rgh* (pressure minus the gravitational head).
  U (or U.(name of fluid)) are the real velocities, not the Darcy velocities. In a porous structure, they
  represent the actual velocity of the fluid, and not the velocity multiplied by
  the fluid fraction. For instance, U will increase when transiting from a high-
  to a low-porosity region.
  Note that the solver makes use of the :doc:`customPimpleControl <../../../solutionControl/customPimpleControl/customPimpleControl>`, and is further with the options below.
options:
- key: partialEliminationMode
  type: word
  required: false
  default: none
  description: |
    Partial elimination strategy for momentum–pressure coupling. Modes: `none` (disabled); `explicit` (OpenFOAM-style partial elimination); `implicit` (true partial elimination; typically faster convergence and fewer pressure iterations). Compatible with all `momentumMode` values.
- key: momentumMode
  type: word
  required: false
  default: faceCentered
  description: |
    Controls the assembly of pressure-equation fluxes from momentum terms. Modes: `cellCentered` (traditional, prone to oscillations with porous jumps); `faceCentered` (recommended; face-based assembly, reduces oscillations); `cellCenteredFaceReconstruction` (mixed method; experimental; discouraged).
- key: oscillationLimiterFraction
  type: scalar
  required: false
  default: 0.0
  description: |
    Active only when `momentumMode=faceCentered`. Blends two velocity‑reconstruction strategies: `1` fully accounts for porosity jumps (eliminates oscillations but may induce cross‑flow oscillations with highly variable drag); `0` disables the limiter; values between 0 and 1 give blended behavior.
- key: solveEnergy
  type: bool
  required: false
  default: false
  description: Solve the energy equation.
- key: solveFluidMechanics
  type: bool
  required: false
  default: true
  description: Solve pressure–velocity (fluid-mechanics) equations.
- key: correctUntilConvergence
  type: bool
  required: false
  default: false
  description: |
    Perform iterative correction until convergence (see customPimpleControl documentation).
- key: massTransferSafetyFactor
  type: scalar
  required: false
  default: 1.0
  description: |
    Safety factor for explicit mass‑transfer limiting to keep phase fractions bounded. `1.0` = standard limiting; `<1.0` = more conservative; `>1.0` only for well‑behaved models.
- key: maxTInterfaceDdt
  type: scalar
  required: false
  description: |
    Maximum allowed |dT/dt| for interfacial temperature `T.interface` (K/s), limiting per‑step temperature variation to avoid unstable jumps during phase‑change coupling.
- key: enthalpyStabilizationMode
  type: word
  required: false
  default: cutoff
  description: |
    Stabilization strategy for enthalpy `he` when `alpha < thermoResidualAlpha`. Modes: `source` (smooth relaxation toward `he_interface`; recommended); `cutoff` (post‑solve clamping to `he_interface`; robust but non‑smooth).
usage:
- comment: |-
    ``customPimpleControl`` is used internally by a PIMPLE-based solver in
    the same way as ``pimpleControl``, with configuration provided via the
    ``PIMPLE`` sub-dictionary in ``fvSolution``.      Here is a minimal example showing the additional options
  snippet: "PIMPLE\n{\n    nCorrectors         12;\n    nNonOrthogonalCorrectors 0;\n\n    pMin                    10000;\
    \ // Minimum pressure in Pa to avoid numerical issues\n    pRefCell                0; // Reference cell for pressure BCs\n\
    \    pRefValue               100000; // Reference pressure value for pressure BCs\n\n    \n    partialEliminationMode\
    \  implicit;\n    momentumMode        faceCentered;\n    oscillationLimiterFraction  0;\n    correctUntilConvergence \
    \    true;\n    massTransferSafetyFactor    0.1;\n    maxTInterfaceDdt    10000;\n    enthalpyStabilizationMode   source;\n\
    \    residualControl\n    {\n        p_rgh\n        {\n            tolerance       1e-05;\n            relTol        \
    \  0;\n            useFirstPISOInitialResidual true;\n        }\n        h.liquid\n        {\n            tolerance  \
    \     1e-05;\n            relTol          0;\n        }\n    }\n    solveEnergy         true;\n    solveFluidMechanics\
    \ true;\n    nOuterCorrectors    24;\n}"
dictionary: neutronicsProperties
