options: []

usage:
  - comment: |-
      The model is specified via the ``mixture`` subdictionary of the ``thermophysicalProperties`` file (located in ``constant/``, or ``constant/<regionName>`` for multi-region cases, e.g. ``constant/fluidRegion``). Here is a snippet enabling the model:
    snippet: |
      thermoType
      {
          type            heRhoThermo;    // General thermophysical model calculation
                                          // based on enthalpy h or internal energy e,
                                          // and density rho
          mixture         pureMixture;
          properties      liquid;
          energy          sensibleEnthalpy;
      }

      mixture
      {
          H2;
      }
