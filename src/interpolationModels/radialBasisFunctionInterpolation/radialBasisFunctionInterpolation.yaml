description: |-
  Base file for radial basis functions. These radial basis functions can
  interpolate any smooth data samples. The functions usually work in pairs. For
  example, ``solvePolyharmonicSpline`` computes the RBF weights for
  ``polyharmonicSpline``, which computes the interpolated value. This works
  effectively in cases the data points change in value but not in location.
  The computation overhead is done once in ``solvePolyharmonicSpline`` which
  inverses the RBF matrix. Then the interpolation value evaluation is relatively
  fast.

  Available functions:

  \table
      Function                          | Return      | Description
      solveGaussianRadialBasisFunction  | scalarList  | Weight calculation for the Radial Basis Function interpolation https://en.wikipedia.org/wiki/Radial_basis_function_interpolation
      gaussianRadialBasisFunction       | scalar      | Compute the interpolation value based on the Radial Basis Function weights https://en.wikipedia.org/wiki/Radial_basis_function_interpolation
      polyharmonicSplineFunction        | scalar      | Polyharmonic spline basis function
      solvePolyharmonicSpline           | scalarList  | Polyharmonic spline RBF solver for 3 dimensions, computes RBF weights
      polyharmonicSpline                | scalar      | Polyharmonic spline RBF for 3 dimensions, computes the interpolation value
      solvePolyharmonicSpline           | scalarList  | Generalized polyharmonic spline RBF solver for N dimensions, computes RBF weights
      polyharmonicSpline                | scalar      | Generalized polyharmonic spline RBF for N dimensions, computes the interpolation value
      solvePolyharmonicSplineDerivative | scalarList  | Experimental RBF solver using derivative information (XY plane only), computes RBF weights
      polyharmonicSplineDerivative      | scalar      | Experimental RBF using derivative information (XY plane only), computes the interpolation value
      solvePolyharmonicSplineIntegral   | scalarList  | Experimental RBF solver imposing an integral under the interpolation field, computes RBF weights
      polyharmonicSplineIntegral        | scalar      | Experimental RBF imposing an integral under the interpolation field, computes the interpolation value
      solveKriging                      | void        | Solve Kriging matrix
      solveKriging                      | scalarList  | Solve Kriging matrix
      getVariogramVector                | scalarList  |
      kriging                           | scalar      |
  \endtable


  \mainauthor
    Thomas Guilbaud (thomas.guilbaud@epfl.ch)

