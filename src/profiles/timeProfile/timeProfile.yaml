description: |-
  Base class for time profile functions. This object embeds the OpenFOAM
      Function1 object used to represents tables. timeProfile is also able to
      input data from an FMI.

      Example of time dependant source entries:
      \verbatim
          // Using table
          externalReactivityTimeProfile
          {
              type        table;
              startTime   100;
              table       table
              (
                  (   0   0)
                  (   1   0.0005767131    ) //- i.e. 57.67131 pcm, == 0.2*Beta
              );
          }

          // Using FMI
          externalReactivityTimeProfile
          {
              type            fmi;
              nameFromFMU     gfExtReact;
              initialValue    0.0;
          }
      \endverbatim

      Author of this file (and associated .C or included .H files):
      Thomas Guilbaud <thomas.guilbaud@epfl.ch;>, EPFL/Transmutex SA (Swizerland)

admonitions:
  - kind: warning
    body: |-
      Preliminary autogenerated documentation. Validate the description, options, and usage before publishing.

options:
  - key: initialValue
    type: scalar
    required: false
    default: '0.0'
    description: |
  - key: startTime
    type: scalar
    required: false
    default: '0.0'
    description: |
  - key: type
    type: word
    required: true
    default:
    description: |

usage:
  - comment: |-
      The model is specified via the ``type`` entry in the ``<dictName>/<subModel>/<zoneName>`` subdictionary of the ``phaseProperties`` file (located in ``constant/``, or ``constant/<regionName>`` for multi-region cases, e.g. ``constant/fluidRegion``). Here is a snippet enabling the model:
    snippet: |
      phaseProperties
      {
        physicsModels
        {
          <subModel>
          {
            "<zoneName>"
            {
              type neutronics;
            }
          }
        }
      }

