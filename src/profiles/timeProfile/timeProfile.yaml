description: |-
  Base class for time profile functions. This object embeds the OpenFOAM
  Function1 object used to represents tables. timeProfile is also able to
  input data from an FMI.

  \mainauthor of this file (and associated .C or included .H files):
      Thomas Guilbaud <thomas.guilbaud@epfl.ch;>, EPFL/Transmutex SA (Switzerland)

options:
  - key: type
    type: word
    required: true
    default:
    description: Type of time profile. Options ``table`` or ``fmi``
  - key: startTime
    type: scalar
    required: false
    default: '0.0'
    description: Time offset of the table if type ``table`` is selected
  - key: table
    type: table
    required: false
    default:
    description: Table containing the time profile if type ``table`` is selected. List of tuple with time as first element and the value as second element
  - key: initialValue
    type: scalar
    required: false
    default: '0.0'
    description: Initial value used by the FMI port if type ``fmi``
  - key: nameFromFMU
    type: word
    required: false
    default:
    description: FMI port name if type ``fmi``

usage:
  - comment: |-
      Example of usage with a table in the ``nuclearData`` file:
    snippet: |-
      externalReactivityTimeProfile
      {
          type        table;
          startTime   100;
          table       table
          (
              (   0   0)
              (   1   0.0005767131    )
          );
      }
  - comment: |-
      Example of usage with an FMI input in the ``nuclearData`` file:
    snippet: |-
      externalReactivityTimeProfile
      {
          type            fmi;
          nameFromFMU     gfExtReact;
          initialValue    0.0;
      }
