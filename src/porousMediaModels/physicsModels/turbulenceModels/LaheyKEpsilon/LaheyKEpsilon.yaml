description: |-
  Continuous-phase k-epsilon model including bubble-generated turbulence.

      Reference:
      \verbatim
          Lahey Jr, R. T. (2005).
          The simulation of multidimensional multiphase flows.
          Nuclear Engineering and Design, 235(10), 1043-1060.
      \endverbatim

      The default model coefficients are
      \verbatim
          LaheyKEpsilonCoeffs
          {
              Cmu             0.09;
              C1              1.44;
              C2              1.92;
              C3              -0.33;
              sigmak          1.0;
              sigmaEps        1.3;
              Cp              0.25;
              Cmub            0.6;
              alphaInversion  0.3;
          }
      \endverbatim

      Last modified by Stefan Radman for compatibility with FFSEulerFoam
      (stefan.radman@epfl.ch, stefanradman92@gmail.com)

admonitions:
  - kind: warning
    body: |-
      Preliminary autogenerated documentation. Validate the description, options, and usage before publishing.
  - kind: note
    body: |-
      This model is selected solely by its runtime ``typeName`` and defines no additional options.

options: []

usage:
  - comment: |-
      The model is specified via the ``type`` entry in the ``<dictName>/<subModel>/<zoneName>`` subdictionary of the ``phaseProperties`` file (located in ``constant/``, or ``constant/<regionName>`` for multi-region cases, e.g. ``constant/fluidRegion``). Here is a snippet enabling the model:
    snippet: |
      phaseProperties
      {
        physicsModels
        {
          <subModel>
          {
            "<zoneName>"
            {
              type LaheyKEpsilon;
            }
          }
        }
      }

