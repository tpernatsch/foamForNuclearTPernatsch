description: |-
  Same as the standard OpenFOAM kEpsilon model in non-porous regions, while
  forcing k and epsilon to their equilibrium values
  inside porous zones. These equilibium values can be set in the
  porousKepsionProperties sub-dictionary. k and epsilon are
  determined based on correlations for tubulent intensity (I) and lengh
  scale (L). Turbulent intensity correlations are in the form
  :math:`turbulenceIntensityCoeff*{Reynolds^turbulenceIntensityExp}`,
  with Reynolds number calculated by the structure class, according
  to the input data in phaseProperties.
  Please note that a porous medium simulation using the porousKEpsilon
  model entails the risk of an unstable solution. This is due to the fact
  that the turbulent viscosity will be that of the sub-scale structure, and
  thus not enough to stabilize a solution on the length scale of the coarse
  mesh. To address this problem, one can define the keyword DhStruct. This keyword defines the hydraulic diameter of the whole
  porous structure. The code uses it to make sure the turbulent viscosity
  results in a  laminar Reynolds number (defaulted to 500).


options:
  - key: DhStruct
    type: scalar
    required: true
    default:
    description: Hydraulic diameter of the whole porous structure. Used to rescale the turbulent viscosity and improve numerical stability.
  - key: convergenceLength
    type: scalar
    required: true
    default:
    description: k and epsilon will exponentially converge to equilibrium according  to this exponent
  - key: turbulenceIntensityCoeff
    type: scalar
    required: true
    default:
    description: :math:`turbulenceIntensityCoeff` in :math:`turbulenceIntensityCoeff*Reynolds^turbulenceIntensityExp`
  - key: turbulenceIntensityExp
    type: scalar
    required: true
    default:
    description:  :math:`turbulenceIntensityExp` in :math:`turbulenceIntensityCoeff*Reynolds^turbulenceIntensityExp`
  - key: turbulenceLengthScaleCoeff
    type: scalar
    required: true
    default:
    description:  :math:`turbulenceLengthScaleCoeff` in :math:`turbulenceIntensityCoeff*Reynolds^turbulenceIntensityExp`

usage:
  - comment: |-
      The model is selected in the RAS section of the ``turbulenceProperties`` dictionary. A minimal example for a phase using ``mixtureKEpsilon`` is:
    snippet: |-
      RAS
      {
          RASModel            porousKEpsilon;
          turbulence          on;
          printCoeffs         on;

          porousKEpsilonCoeffs
          {
              Cmu       0.09;
              C1        1.44;
              C2        1.92;
              C3        1.92;
              Cp        0.25;
              sigmak    1.0;
              sigmaEps  1.3;
              Prt       1.0;
          }
      }
  - comment: |-
      An additional sub-dictionary similar to the following should be then included in the ``turbulenceProperties``  dictionary:
    snippet: |-
      porousKEpsilonProperties
      {
          "zones of application"
          {
              convergenceLength           0.5; 
              turbulenceIntensityCoeff    0.16;
              turbulenceIntensityExp      -0.125;
              turbulenceLengthScaleCoeff  0.07;
          }
      }


notes:
  - This model requires that each porous region in ``structure.regions()`` with
    non-zero volume fraction appears in ``porousKEpsilonProperties``.

