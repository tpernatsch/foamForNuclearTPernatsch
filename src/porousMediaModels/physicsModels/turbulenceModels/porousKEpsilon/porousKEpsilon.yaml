description: |-
  Same as the standard OpenFOAM kEpsilon model in non-porous regions, while
  forcing k and epsilon to their equilibrium values
  inside porous zones. These equilibium values can be set in the
  porousKepsionProperties sub-dictionary. k and epsilon are
  determined based on correlations for tubulent intensity (I) and lengh
  scale (L). Turbulent intensity correlations are in the form
  :math:`turbulenceIntensityCoeff*Reynolds^turbulenceIntensityExp`,
  with Reynolds number calculated by the structure class, according
  to the input data in phaseProperties.
  Please note that a porous medium simulation using the porousKEpsilon
  model entails the risk of an unstable solution. This is due to the fact
  that the turbulent viscosity will be that of the sub-scale structure, and
  thus not enough to stabilize a solution on the length scale of the coarse
  mesh. To address this problem, one can define the keyword DhStruct. This keyword defines the hydraulic diameter of the whole
  porous structure. The code uses it to make sure the turbulent viscosity
  results in a  laminar Reynolds number (defaulted to 500).



options:
  # --------------------------------------------------------------------------
  # RAS model coefficient dictionary (porousKEpsilonCoeffs)
  # --------------------------------------------------------------------------
  - key: porousKEpsilonCoeffs
    type: dictionary
    required: false
    default: |
      Cmu       0.09;
      C1        1.44;
      C2        1.92;
      C3        0;
      sigmak    1.0;
      sigmaEps  1.3;
      Prt       1.0;
    description: |-
      Coefficients for the porous k–ε turbulence model:
        - Cmu:       coefficient for turbulent viscosity (ν_t = Cmu k²/ε)
        - C1:        production coefficient in the ε-equation
        - C2:        destruction coefficient in the ε-equation
        - C3:        porous-region ε production modifier (default 0)
        - sigmak:    turbulent diffusivity coefficient for k
        - sigmaEps:  turbulent diffusivity coefficient for ε
        - Prt:       turbulent Prandtl number (used for alphat), default 1.0


  - key: porousKEpsilonProperties
    type: dictionary
    required: true
    default:
    description: |-
      Subdictionary containing porous-region definitions. Each entry name may
      represent a single region or a colon-separated list of regions, e.g.,
      ``regionA:regionB``. For every porous region where the structure field has
      non-zero volume fraction, a corresponding entry must be present.
      Required entries per region:
        - convergenceLength:            characteristic turbulence convergence length [m]
        - turbulenceIntensityCoeff:     coefficient for inlet turbulence intensity correlation
        - turbulenceIntensityExp:       exponent for Reynolds-number-based turbulence intensity
        - turbulenceLengthScaleCoeff:   coefficient for porous length-scale estimation
      Optional entries (trigger nut stabilization):
        - DhStruct:         hydraulic diameter of porous channels [m]
        - laminarReStruct:  laminar Reynolds number threshold (default: 500)

usage:
  - comment: |-
      Minimal RAS setup enabling porousKEpsilon. The RAS coefficients are placed
      in the standard turbulence model coefficient dictionary (often
      ``turbulenceProperties`` or ``RASProperties``).
    snippet: |-
      RAS
      {
          RASModel        porousKEpsilon;
          turbulence      on;
          printCoeffs     on;

          porousKEpsilonCoeffs
          {
              Cmu       0.09;
              C1        1.44;
              C2        1.92;
              C3        0;
              sigmak    1.0;
              sigmaEps  1.3;
              Prt       1.0;
          }
      }

  - comment: |-
      Example porous region configuration. If the mesh contains porous regions
      named ``matrix`` and ``support`` in the ``structure`` object, the following
      dictionary must be provided.
    snippet: |-
      porousKEpsilonProperties
      {
          matrix
          {
              convergenceLength           0.05;
              turbulenceIntensityCoeff    0.10;
              turbulenceIntensityExp      0.25;
              turbulenceLengthScaleCoeff  0.50;

              // Optional stabilization terms
              DhStruct        0.003;
              laminarReStruct 600;
          }

          support
          {
              convergenceLength           0.03;
              turbulenceIntensityCoeff    0.05;
              turbulenceIntensityExp      0.20;
              turbulenceLengthScaleCoeff  0.40;
          }
      }

notes:
  - This model requires that each porous region in ``structure.regions()`` with
    non-zero volume fraction appears in ``porousKEpsilonProperties``.
  - When ``DhStruct`` is provided for a region, nut stabilization is activated
    and the fields ``DhStructure.porousKEpsilon`` and
    ``laminarReStructure.porousKEpsilon`` are created automatically.
  - Fields such as ``equilibriumK`` and ``equilibriumEpsilon`` are managed
    internally by the model and should not be supplied by the user.




