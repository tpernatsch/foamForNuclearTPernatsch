description: |-
  Same as porousKEpsiolon but turbulent intensity correlation in the form
     turbulenceIntensityCoeff*Reynolds^turbulenceIntensityExp +
     turbulenceIntensityAlphaCoeff *
     * (1-alpha), where alpha is the phase fraction.

admonitions:
  - kind: warning
    body: |-
      Preliminary autogenerated documentation. Validate the description, options, and usage before publishing.

options:
  - key: DhStruct
    type: scalar
    required: true
    default:
    description: |
  - key: convergenceLength
    type: scalar
