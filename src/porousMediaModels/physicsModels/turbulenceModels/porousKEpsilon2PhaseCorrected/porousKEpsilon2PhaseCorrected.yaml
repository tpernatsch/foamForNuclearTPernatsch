description: |-
  Same as porousKEpsilon but turbulent intensity correlation in the form
  :math:`turbulenceIntensityCoeff*Reynolds^{turbulenceIntensityExp} +
  turbulenceIntensityAlphaCoeff *
  * (1-alpha)`, where alpha is the phase fraction.


options:
  - key: DhStruct
    type: scalar
    required: true
    default:
    description: Hydraulic diameter of the whole porous structure. Used to rescale the turbulent viscosity and improve numerical stability.
  - key: convergenceLength
    type: scalar
    required: true
    default:
    description: k and epsilon will exponentially converge to equilibrium according  to this exponent
  - key: turbulenceIntensityCoeff
    type: scalar
    required: true
    default:
    description: :math:`turbulenceIntensityCoeff` in :math:`turbulenceIntensityCoeff*Reynolds^{turbulenceIntensityExp}`
  - key: turbulenceIntensityExp
    type: scalar
    required: true
    default:
    description:  :math:`turbulenceIntensityExp` in :math:`turbulenceIntensityCoeff*Reynolds^{turbulenceIntensityExp}`
  - key: turbulenceLengthScaleCoeff
    type: scalar
    required: true
    default:
    description:  :math:`turbulenceLengthScaleCoeff` in :math:`turbulenceIntensityCoeff*Reynolds^{turbulenceIntensityExp}`

usage:
  - comment: |-
      This is an example of ``turbulenceProperties`` dictionary
    snippet: |
      simulationType  RAS;

      RAS
      {
          RASModel        porousKEpsilon2PhaseCorrected;

          turbulence      on;

          printCoeffs     on;

          liquidName      "liquid";
          gasName         "vapour";
      }

      porousKEpsilon2PhaseCorrectedProperties
      {
          "regionsName"
          {
              convergenceLength           0.1;
              turbulenceIntensityCoeff    2.6;//3.2;//1.6;//0.32;//0.16;
              turbulenceIntensityAlphaCoeff   100;//20;//10;//5;
              turbulenceIntensityExp      -0.125;
              turbulenceLengthScaleCoeff  0.07;
          }
      }

notes:
  - Note that multiphase simulation require a ``turbulenceProperties`` dictionary for every phase (e.g., turbulenceProperties.liquid and turbulenceProperties.vapour)