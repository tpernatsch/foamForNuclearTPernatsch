description: |-
  Correlation to be used in annular flow scenarios in which the phase of
      interest to which this model is applied flows in a film along the walls
      of a circular pipe, so that the film thickness is proportional to
      1-sqrt(1-alphaN) with alphaN being the normalized phase fraction of the
      phase of interest

      Stefan Radman (stefan.radman@alumni.epfl.ch; sradman@protonmail.com)

admonitions:
  - kind: warning
    body: |-
      Preliminary autogenerated documentation. Please refer to the source code and tutorials for more reliable information.
  - kind: note
    body: |-
      This model is selected solely by its runtime ``typeName`` and defines no additional options.

options: []

usage:
  - comment: |-
      The model is specified via the ``type`` entry in the ``<dictName>/<subModel>/<zoneName>`` subdictionary of the ``phaseProperties`` file (located in ``constant/``, or ``constant/<regionName>`` for multi-region cases, e.g. ``constant/fluidRegion``). Here is a snippet enabling the model:
    snippet: |
      phaseProperties
      {
        physicsModels
        {
          <subModel>
          {
            "<zoneName>"
            {
              type pipeFilm;
            }
          }
        }
      }

