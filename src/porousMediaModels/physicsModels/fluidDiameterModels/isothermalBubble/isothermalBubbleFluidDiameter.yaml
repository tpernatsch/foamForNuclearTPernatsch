description: |-
  Compute bubble/droplet diameter based on pressure changes assuming
      constant temperature and mass within bubble/droplet (i.e. no mass exchange)
      via ideal gas law

      Stefan Radman (stefan.radman@alumni.epfl.ch; sradman@protonmail.com)

admonitions:
  - kind: warning
    body: |-
      Preliminary autogenerated documentation. Validate the description, options, and usage before publishing.

options:
  - key: p0
    type: scalar
    required: true
    default:
    description: |
  - key: value
    type: scalar
    required: true
    default:
    description: |

usage:
  - comment: |-
      The model is specified via the ``type`` entry in the ``<dictName>/<subModel>/<zoneName>`` subdictionary of the ``phaseProperties`` file (located in ``constant/``, or ``constant/<regionName>`` for multi-region cases, e.g. ``constant/fluidRegion``). Here is a snippet enabling the model:
    snippet: |
      phaseProperties
      {
        physicsModels
        {
          <subModel>
          {
            "<zoneName>"
            {
              type isothermal;
            }
          }
        }
      }

