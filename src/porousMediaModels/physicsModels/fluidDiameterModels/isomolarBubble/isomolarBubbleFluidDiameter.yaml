description: |-
  Implements an isomolar bubble diameter model. The diameter is scaled from an
  initial reference value `d0` using the ratio of `(p0*T)/(p*T0)` evaluated in
  each cell, taking the cubic root. This produces a thermodynamic-based bubble
  diameter for multiphase flows.


options:
  - key: value
    type: scalar
    required: true
    description: Reference bubble diameter d0.
  - key: p0
    type: scalar
    required: true
    description: Reference pressure p0.
  - key: T0
    type: scalar
    required: true
    description: Reference temperature T0.



usage:
  - comment: |-
      The isomolarBubble fluid diameter model is selected at run-time as: 
    snippet: |-
      fluid1 "liquid";
      fluid2 "vapour";

      liquidProperties
      {
          stateOfMatter   liquid;
          dispersedDiameterModel
          {
              type    isomolarBubble;
              T0      300;
              p0      1e5;
              value   1e-3;
          }
          thermoResidualAlpha 1e-6;
      }

