description: |-

  One-parameter regime map model.

  The model partitions the range of a single scalar control parameter into
  named regimes defined via the ``regimeBounds`` sub-dictionary. Each entry
  in ``regimeBounds`` provides a regime name and a pair of scalar thresholds
  (lower, upper) for that regime.

  Bounds may be specified in arbitrary order; the constructor sorts them into
  ascending order of their lower threshold. If a regime is specified with
  an inverted range (upper < lower), the endpoints are automatically swapped.
  When the upper bound of regime *i* does not coincide with the lower bound
  of regime *i+1*, the model inserts an implicit interpolation interval between
  the two regimes.

  At run-time, the model looks up a ``volScalarField`` specified by the
  ``parameter`` keyword and, for each cell, determines which regime(s) are
  active based on the parameter value. The resulting per-cell regime weights
  are stored in ``regimeLabelCoeffs_`` as pairs of (regime label, coefficient).

  Two interpolation modes are available for the implicit intervals:
    * ``linear`` (default): linear blending between adjoining regimes.
    * ``quadratic``: a quadratic blend, with a mid-point biased transition.


options:
  - key: parameter
    type: word
    required: true
    default:
    description: name of the volScalarField used as the regime‑mapping parameter

  - key: interpolationMode
    type: word
    required: false
    default: linear
    description: interpolation mode used in gap intervals between regimes (linear or quadratic)

  - key: regimeBounds
    type: dictionary
    required: true
    default:
    description: dictionary mapping regime names to (lower upper) parameter bounds


usage:
  - comment: |-
      The model is selected via the ``type`` entry in the appropriate      ``regimeMapModel``-related sub-dictionary. Here is a snippet enabling the model:
    snippet: |
      regimeMapModels
      {
          "annularMist"
          {
              type                oneParameter;
              interpolationMode   quadratic;
              parameter           "normalized.alpha.vapour";
              regimeBounds
              {
                  "annular"       (0          0.94);
                  "mist"          (0.99       1);
              }
          }
      }

