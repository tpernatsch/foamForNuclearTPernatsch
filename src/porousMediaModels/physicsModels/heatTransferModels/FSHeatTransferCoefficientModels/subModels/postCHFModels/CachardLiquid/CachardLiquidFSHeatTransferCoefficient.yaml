description: |-
  Heat transfer coefficient for Inverted Annular Flow - for the liquid phase.
      This code cooperate with the CachardVapourFSHeatTransferCoefficient.
      Warning, this model has been coded for rod bundle, especially for delta model,
      the thickness of the film of vapor.

      Gauthier LAZARE - gauthier.lazare@gmail.com

admonitions:
  - kind: warning
    body: |-
      Preliminary autogenerated documentation. Please refer to the source code and tutorials for more reliable information.

options:
  - key: liquidEmissivity
    type: scalar
    required: true
    default:
    description: |
  - key: wallEmissivity
    type: scalar
    required: true
    default:
    description: |

usage:
  - comment: |-
      The model is specified via the ``type`` entry in the ``<dictName>/<subModel>/<zoneName>`` subdictionary of the ``phaseProperties`` file (located in ``constant/``, or ``constant/<regionName>`` for multi-region cases, e.g. ``constant/fluidRegion``). Here is a snippet enabling the model:
    snippet: |
      phaseProperties
      {
        physicsModels
        {
          <subModel>
          {
            "<zoneName>"
            {
              type CachardLiquid;
            }
          }
        }
      }

