description: |-
  Calculate the Leidenfrost Temperature at which the heat flux is minimal in the
      hysteresis after the CHF. The formula used is the same as TRACE with the correlation
      of GroeneveldStewart. WARNING, it is not complete yet, it lack the term due to
      quality.

      Gauthier Lazare (gauthier.lazare@gmail.com)

admonitions:
  - kind: warning
    body: |-
      Preliminary autogenerated documentation. Please refer to the source code and tutorials for more reliable information.

options:
  - key: criticalPressure
    type: scalar
    required: true
    default:
    description: |

usage:
  - comment: |-
      The model is specified via the ``type`` entry in the ``<dictName>/<subModel>/<zoneName>`` subdictionary of the ``phaseProperties`` file (located in ``constant/``, or ``constant/<regionName>`` for multi-region cases, e.g. ``constant/fluidRegion``). Here is a snippet enabling the model:
    snippet: |
      phaseProperties
      {
        physicsModels
        {
          <subModel>
          {
            "<zoneName>"
            {
              type GroeneveldStewart;
            }
          }
        }
      }

