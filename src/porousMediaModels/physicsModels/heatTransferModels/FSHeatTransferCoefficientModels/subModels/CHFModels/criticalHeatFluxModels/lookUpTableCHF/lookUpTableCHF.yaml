  Author
      - Yuhang Niu (niu.yuhang@epfl.ch)
      - A. Scolaro - EPFL (ECOLE POLYTECHNIQUE FEDERALE
      DE LAUSANNE, Switzerland, Laboratory for Reactor Physics and Systems
      Behaviour)
      - C. Fiorina - Texas A&M University (TAMU)

admonitions:
  - kind: warning
    body: |-
      Preliminary autogenerated documentation. Please refer to the source code and tutorials for more reliable information.

options:
  - key: PitchToDiameter
    type: scalar
    required: true
    default:
    description: |
  - key: massFlowRateInterpolationMethod
    type: word
    required: false
    default: '"linear"'
    description: |
  - key: pressureInterpolationMethod
    type: word
    required: false
    default: '"linear"'
    description: |
  - key: qualityInterpolationMethod
    type: word
    required: false
    default: '"linear"'
    description: |

usage:
  - comment: |-
      The model is specified via the ``type`` entry in the ``<dictName>/<subModel>/<zoneName>`` subdictionary of the ``phaseProperties`` file (located in ``constant/``, or ``constant/<regionName>`` for multi-region cases, e.g. ``constant/fluidRegion``). Here is a snippet enabling the model:
    snippet: |
      phaseProperties
      {
        physicsModels
        {
          <subModel>
          {
            "<zoneName>"
            {
              type lookUpTableCHF;
            }
          }
        }
      }

