description: |-
  Calculate the temperature of onset of nucleate boiling according to the
      model by N. SahaZuber, G.R. Warrier, and V.K. Dhir, "Onset of Nucleate Boiling
      and Active Nucleation Site Density During Subcooled Flow Boiling,"
      J. Heat Transfer, 124, 717-728, 2002..
      This model should only to be used in the following parameter range:
      *   p =         0.1 - 13.8 MPa
      *   massFlux =  95 - 2760 kg/m2/s   (i.e. ~ 0.1 - 2.7 m/s for water at ~
                                          1000 kg/m3)
      *   heatFlux =  0.28 - 1.89 MW/m^2

      Stefan Radman (sradman@protonmail.com / stefan.radman@epfl.ch)

admonitions:
  - kind: warning
    body: |-
      Preliminary autogenerated documentation. Please refer to the source code and tutorials for more reliable information.
  - kind: note
    body: |-
      This model is selected solely by its runtime ``typeName`` and defines no additional options.

options: []

usage:
  - comment: |-
      The model is specified via the ``type`` entry in the ``<dictName>/<subModel>/<zoneName>`` subdictionary of the ``phaseProperties`` file (located in ``constant/``, or ``constant/<regionName>`` for multi-region cases, e.g. ``constant/fluidRegion``). Here is a snippet enabling the model:
    snippet: |
      phaseProperties
      {
        physicsModels
        {
          <subModel>
          {
            "<zoneName>"
            {
              type SahaZuber;
            }
          }
        }
      }

