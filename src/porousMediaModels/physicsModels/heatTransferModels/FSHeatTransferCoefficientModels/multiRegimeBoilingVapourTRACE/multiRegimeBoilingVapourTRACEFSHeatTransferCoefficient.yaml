description: |-
  Heat transfer coefficient for the transition Boiling Regime and the
      POST CHF Regimes (vapour side). It uses the correlations from TRACE.

      Authors:
      Stefan Radman (sradman@pm.me / stefan.radman@epfl.ch)
      Gauthier Lazare (gauthier.lazare@gmail.com)

admonitions:
  - kind: warning
    body: |-
      Preliminary autogenerated documentation. Please refer to the source code and tutorials for more reliable information.
  - kind: note
    body: |-
      This model is selected solely by its runtime ``typeName`` and defines no additional options.

options: []

usage:
  - comment: |-
      The model is specified via the ``type`` entry in the ``<dictName>/<subModel>/<zoneName>`` subdictionary of the ``phaseProperties`` file (located in ``constant/``, or ``constant/<regionName>`` for multi-region cases, e.g. ``constant/fluidRegion``). Here is a snippet enabling the model:
    snippet: |
      phaseProperties
      {
        physicsModels
        {
          <subModel>
          {
            "<zoneName>"
            {
              type multiRegimeBoilingVapourTRACE;
            }
          }
        }
      }

