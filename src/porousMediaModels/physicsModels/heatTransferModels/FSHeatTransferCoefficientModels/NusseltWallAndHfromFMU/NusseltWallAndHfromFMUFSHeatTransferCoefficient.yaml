description: |-
  Heat transfer coefficient for forced convective flows, computed from the
  Nusselt number obtained via the correlation:

  .. math::

      Nu = A + B \, Re^{C} \, Pr^{D}

  where :math:`Re` and :math:`Pr` are the Reynolds number (superficial in
  two-phase) and Prandtl number of the fluid, respectively, and :math:`A`,
  :math:`B`, :math:`C`, :math:`D` are selectable constants.

  An additional heat transfer contribution accounts for wall resistance and
  for an auxiliary external contribution (e.g. from an FMU), giving:

  .. math::

      \frac{1}{H}
      =
      \frac{1}{
        \dfrac{Nu \, \kappa}{D_h}
      }
      +
      \frac{1}{H_{\mathrm{wall}}}
      +
      \frac{1}{H_{\mathrm{fromFMU}}}



options:
  - key: addH
    type: scalar
    required: true
    default:
    description: |
  - key: coeff
    type: scalar
    required: true
    default:
    description: |
  - key: const
    type: scalar
    required: true
    default:
    description: |
  - key: expPr
    type: scalar
    required: true
    default:
    description: |
  - key: expRe
    type: scalar
    required: true
    default:
    description: |

usage:
  - comment: |-
      The NusseltAndWall heat transfer model is constructed at run-time via the
      heatTransferModels subdictionary of the physicsModel subdictionary of the phaseProperties dictionary. 
    snippet: |-
      physicsModels
      {
        heatTransferModels
        {
          "hx1"
          {
              type            NusseltWallAndHfromFMU;
              HNameFromFMU    gfHin1;
              const   0.0;
              coeff   0.023;
              expRe   0.8;
              expPr   0.4;
              addH    30000;
          }
        }
      }

