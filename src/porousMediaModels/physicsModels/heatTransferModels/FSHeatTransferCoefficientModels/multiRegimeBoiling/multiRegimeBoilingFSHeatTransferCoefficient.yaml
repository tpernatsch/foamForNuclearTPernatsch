description: |-
  Heat transfer coefficient that covers many regimes, from single phase
      convection, two-phase convection, sub-cooled and nucleate boiling, to
      film boiling (the latter, hopefully).

      Stefan Radman (sradman@pm.me / stefan.radman@epfl.ch)

admonitions:
  - kind: warning
    body: |-
      Preliminary autogenerated documentation. Validate the description, options, and usage before publishing.

options:
  - key: heatFluxSuperposition
    type: bool
    required: true
    default:
    description: |
  - key: superpositionExponent
    type: scalar
    required: true
    default:
    description: |

usage:
  - comment: |-
      The model is specified via the ``type`` entry in the ``<dictName>/<subModel>/<zoneName>`` subdictionary of the ``phaseProperties`` file (located in ``constant/``, or ``constant/<regionName>`` for multi-region cases, e.g. ``constant/fluidRegion``). Here is a snippet enabling the model:
    snippet: |
      phaseProperties
      {
        physicsModels
        {
          <subModel>
          {
            "<zoneName>"
            {
              type multiRegimeBoiling;
            }
          }
        }
      }

