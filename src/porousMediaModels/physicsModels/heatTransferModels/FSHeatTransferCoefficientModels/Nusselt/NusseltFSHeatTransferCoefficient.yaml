description: |-
  Heat transfer coefficient for forced convective flows that is computed
      starting from the Nusselt, which is turn obtained via correlation in the
      form

      $$
          Nu = const + coeff \times Re^{expRe} Pr^{expPr} \left( \frac{T_w}{T_b} \right)^{expTc}
      $$

admonitions:
  - kind: warning
    body: |-
      Preliminary autogenerated documentation. Please refer to the source code and tutorials for more reliable information.

options:
  - key: coeff
    type: scalar
    required: true
    default:
    description: |
  - key: const
    type: scalar
    required: true
    default:
    description: |
  - key: expPr
    type: scalar
    required: true
    default:
    description: |
  - key: expRe
    type: scalar
    required: true
    default:
    description: |
  - key: expTc
    type: scalar
    required: false
    default: '0.0'
    description: |

usage:
  - comment: |-
      Usage already present in Header (verbatim):
    snippet: |-
      Example of mandatory dictionary entries:
          \verbatim
          <cellZoneName>
          {
              const   4;
              coeff   0.01;
              expRe   0.8;
              expPr   0.8;
          }
          \endverbatim

          Example using wall/fluid temperature ratio from:
          Walton 1992, (10) Wolf-McCarthy II
          \f$ Nu = 0.023 Re^{0.8} Pr^{0.4} \left( \frac{T_w}{T_b} \right)^{-0.3} \f$
          with Re = [7800; 1.55e6] and \f$ T_w/T_b \f$ = [1.5; 2.8]

          \verbatim
          <cellZoneName>
          {
              const   0;
              coeff   0.023;
              expRe   0.8;
              expPr   0.4;
              expTc   -0.3;
          }
          \endverbatim
  - comment: |-
      The model is specified via the ``type`` entry in the ``<dictName>/<subModel>/<zoneName>`` subdictionary of the ``phaseProperties`` file (located in ``constant/``, or ``constant/<regionName>`` for multi-region cases, e.g. ``constant/fluidRegion``). Here is a snippet enabling the model:
    snippet: |
      phaseProperties
      {
        physicsModels
        {
          <subModel>
          {
            "<zoneName>"
            {
              type Nusselt;
            }
          }
        }
      }

