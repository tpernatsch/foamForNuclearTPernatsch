
description: |-
  Heat transfer coefficient for forced convective flows computed from the
  Nusselt number, which is in turn obtained from a correlation of the form

  .. math::

      Nu = A_ + B_ (Re^{C_})(Pr^{D_})

  where :math:`Re` and :math:`Pr` are the Reynolds number (superficial in
  two-phase flows) and the Prandtl number of the fluid, respectively, and
  :math:`A`, :math:`B`, :math:`C`, :math:`D` are selectable constants.



options:
  - key: coeff
    type: scalar
    required: true
    default:
    description: |
  - key: const
    type: scalar
    required: true
    default:
    description: |
  - key: expPr
    type: scalar
    required: true
    default:
    description: |
  - key: expRe
    type: scalar
    required: true
    default:
    description: |

usage:
  - comment: |-
      The NusseltReynoldsPrandtlPower heat transfer model is constructed at run-time via the
      heatTransferModels subdictionary of the physicsModel subdictionary of the phaseProperties dictionary. 
    snippet: |
      physicsModels
      {
          heatTransferModels
          {
              "liquid.vapour"
              {
                  "liquid"
                  {
                      type            NoKazimi;

                  }
                  "vapour"
                  {
                      type            NusseltReynoldsPrandtlPower;
                      const           10;
                      coeff           0;
                      expRe           0;
                      expPr           0;
                  }
              }
          }
      }
