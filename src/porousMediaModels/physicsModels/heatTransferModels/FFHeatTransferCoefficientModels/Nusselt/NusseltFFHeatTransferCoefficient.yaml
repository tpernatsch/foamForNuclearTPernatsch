description: |-
  Heat transfer coefficient for forced convective flows that is computed
      starting from the Nusselt, which is turn obtained via correlation in the
      form

      \f[
          Nu = A_+B_*(Re^C_)*(Pr^D_)
      \f]

      with Re, Pr being the Reynolds (superficial in two-phase) and Prandlt
      of the fluid, and A, B, C, D selectable consts

      Stefan Radman (sradman@pm.me / stefan.radman@epfl.ch)

admonitions:
  - kind: warning
    body: |-
      Preliminary autogenerated documentation. Please refer to the source code and tutorials for more reliable information.

options:
  - key: coeff
    type: scalar
    required: true
    default:
    description: |
  - key: const
    type: scalar
    required: true
    default:
    description: |
  - key: expPr
    type: scalar
    required: true
    default:
    description: |
  - key: expRe
    type: scalar
    required: true
    default:
    description: |

usage:
  - comment: |-
      Usage already present in Header (verbatim):
    snippet: |-
      Example of mandatory dictionary entries:
          \verbatim
          const   4;
          coeff   0.01;
          expRe   0.8;
          expPr   0.8;
          \endverbatim
  - comment: |-
      The model is specified via the ``type`` entry in the ``<dictName>/<subModel>/<zoneName>`` subdictionary of the ``phaseProperties`` file (located in ``constant/``, or ``constant/<regionName>`` for multi-region cases, e.g. ``constant/fluidRegion``). Here is a snippet enabling the model:
    snippet: |
      phaseProperties
      {
        physicsModels
        {
          <subModel>
          {
            "<zoneName>"
            {
              type Nusselt;
            }
          }
        }
      }

