description: |-
  NoKazimi model for the liquid side of a liquid-vapour heat transfer
  coefficient. Can be only used if a phaseChangeModel is specified as this
  models relies on latent heat.


options: []

usage:
  - comment: |-
      The NoKazimi heat transfer model is constructed at run-time via the
      heatTransferModels subdictionary of the physicsModel subdictionary of the phaseProperties dictionary. 
    snippet: |
      physicsModels
      {
          heatTransferModels
          {
              "liquid.vapour"
              {
                  "liquid"
                  {
                      type            NoKazimi;

                  }
                  "vapour"
                  {
                      type            NusseltReynoldsPrandtlPower;
                      const           10;
                      coeff           0;
                      expRe           0;
                      expPr           0;
                  }
              }
          }
      }

