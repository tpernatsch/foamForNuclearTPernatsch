description: |-
  Model by Kaiser et al. for the multiplier, specifically for sodium
      two-phase flows:

      phi = 8.2/(X^0.55)

      X2 is the well-known Lockhart-Martinelli
      parameter defined as:

      X2 = (mu_I/mu_O)^0.2 * (flowQuality_I/flowQuality_O)^1.8 * rho_O/rho_I

      Please note that X in use in phi is X = sqrt(X2) and that phi2 = phi^2

      Kaiser, A., Peppler, W., Vöröss, L., 1974. "Type of flow, pressure drop,
      and critical heat flux of a two-phase sodium flow". Nucl. Eng. Des. 30,
      pp. 305–315.

      Stefan Radman (sradman@protonmail.com / stefan.radman@epfl.ch)

admonitions:
  - kind: warning
    body: |-
      Preliminary autogenerated documentation. Please refer to the source code and tutorials for more reliable information.
  - kind: note
    body: |-
      This model is selected solely by its runtime ``typeName`` and defines no additional options.

options: []

usage:
  - comment: |-
      The model is specified via the ``type`` entry in the ``<dictName>/<subModel>/<zoneName>`` subdictionary of the ``phaseProperties`` file (located in ``constant/``, or ``constant/<regionName>`` for multi-region cases, e.g. ``constant/fluidRegion``). Here is a snippet enabling the model:
    snippet: |
      phaseProperties
      {
        physicsModels
        {
          <subModel>
          {
            "<zoneName>"
            {
              type Kaiser74;
            }
          }
        }
      }

