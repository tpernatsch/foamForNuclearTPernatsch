description: |-
  Model in the spirit of Lottes-Flinn, i.e.:

      phi2 = 1/(alpha^exp)

      with alpha being the normalized phase fraction (by the void fraction) of
      the multiplierFluid and exp defaulting to 2 (which is the actual
      Lottes-Flinn model). The exp can be user-provided (it is know from e.g.
      TRACE development that this exponent can be slightly smaller for bubbly
      flows, e.g. in the 1.7-1.8 range).

      Stefan Radman (sradman@protonmail.com / stefan.radman@epfl.ch)

admonitions:
  - kind: warning
    body: |-
      Preliminary autogenerated documentation. Validate the description, options, and usage before publishing.

options:
  - key: exp
    type: scalar
    required: false
    default: '2.0'
    description: |

usage:
  - comment: |-
      The model is specified via the ``type`` entry in the ``<dictName>/<subModel>/<zoneName>`` subdictionary of the ``phaseProperties`` file (located in ``constant/``, or ``constant/<regionName>`` for multi-region cases, e.g. ``constant/fluidRegion``). Here is a snippet enabling the model:
    snippet: |
      phaseProperties
      {
        physicsModels
        {
          <subModel>
          {
            "<zoneName>"
            {
              type LottesFlinn;
            }
          }
        }
      }

