description: |-
  Base class to represent a FSDragFactor with basing name access
      functionality.

admonitions:
  - kind: warning
    body: |-
      Preliminary autogenerated documentation. Validate the description, options, and usage before publishing.
  - kind: note
    body: |-
      This model is selected solely by its runtime ``typeName`` and defines no additional options.

options: []

usage:
  - comment: |-
      Usage already present in Header (verbatim):
    snippet: |-
      The following sub-dictionary should be included as a powerModel
          in phaseProperties.

          Example for isotropic:
          \verbatim
          physicsModels
          {
              dragModels
              {
                  [nameOfCellZone]
                  {
                  type    ReynoldsPower;
                  coeff   1.84; //
                  exp     -0.2;
                  }
              }
          }

          \endverbatim

          Example for anisotropic:
          \verbatim
          physicsModels
          {
              dragModels
              {
                  [nameOfCellZone]
                  {
                      localX
                      {
                          type    ReynoldsPower;
                          coeff   1.84; //
                          exp     -0.2;
                      }
                      localY
                      {
                          type    ReynoldsPower;
                          coeff   1.84; //
                          exp     -0.2;
                      }
                      localZ
                      {
                          type    ReynoldsPower;
                          coeff   0.184; //
                          exp     -0.2;
                      }

                  }
              }
          }
          \endverbatim

      \mainauthor
          Stefan Radman (stefan.radman@epfl.ch / stefanradman92@gmail.com)
  - comment: |-
      The model is specified via the ``type`` entry in the ``<dictName>/<subModel>/<zoneName>`` subdictionary of the ``phaseProperties`` file (located in ``constant/``, or ``constant/<regionName>`` for multi-region cases, e.g. ``constant/fluidRegion``). Here is a snippet enabling the model:
    snippet: |
      phaseProperties
      {
        physicsModels
        {
          <subModel>
          {
            "<zoneName>"
            {
              type FSDragFactor;
            }
          }
        }
      }

