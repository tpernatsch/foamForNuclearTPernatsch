description: |-
  NoKazimi correlation for fluid-structure pressure drop

      https://dspace.mit.edu/handle/1721.1/60581

      Stefan Radman (sradman@protonmail.com / stefan.radman@epfl.ch)

admonitions:
  - kind: warning
    body: |-
      Preliminary autogenerated documentation. Please refer to the source code and tutorials for more reliable information.

options:
  - key: pinDiameter
    type: scalar
    required: true
    default:
    description: |
  - key: wireDiameter
    type: scalar
    required: true
    default:
    description: |
  - key: wireLeadLen
    type: scalar
    required: true
    default:
    description: |

usage:
  - comment: |-
      Usage already present in Header (verbatim):
    snippet: |-
      Example of mandatory dictionary entries:
          \verbatim
          pinPitch        0.006;
          pinDiameter     0.0076;
          wireDiameter    0.0016;
          wireLeadLen     0.2;
          \endverbatim
  - comment: |-
      The model is specified via the ``type`` entry in the ``<dictName>/<subModel>/<zoneName>`` subdictionary of the ``phaseProperties`` file (located in ``constant/``, or ``constant/<regionName>`` for multi-region cases, e.g. ``constant/fluidRegion``). Here is a snippet enabling the model:
    snippet: |
      phaseProperties
      {
        physicsModels
        {
          <subModel>
          {
            "<zoneName>"
            {
              type NoKazimi;
            }
          }
        }
      }

