description: |-
  NoKazimi correlation for fluid-structure pressure drop.


options:
  - key: pinDiameter
    type: scalar
    required: true
    default:
    description: |
  - key: wireDiameter
    type: scalar
    required: true
    default:
    description: |
  - key: wireLeadLen
    type: scalar
    required: true
    default:
    description: |

usage:
  - comment: |-
      Usage already present in Header (verbatim):
    snippet: |-
      Example of mandatory dictionary entries:
          \verbatim
          pinPitch        0.006;
          pinDiameter     0.0076;
          wireDiameter    0.0016;
          wireLeadLen     0.2;


usage:
  - comment: |
      The drag model is specified via the ``type`` entry in the ``physicsModels/dragModels/<zoneName>`` subdictionary of the ``phaseProperties`` file.
      (located in ``constant/``, or ``constant/<regionName>`` for multi-region cases, e.g.
      ``constant/fluidRegion``).

      Here is a snippet of a ``phaseProperties`` file enabling the NoKazimi fluid–structure drag model:
    snippet: |
      // ... other phaseProperties subdictionaries

      physicsModels
      {
        dragModels
        {
          "<zoneName>"
          {
            type    NoKazimi;
            pinDiameter     0.0076;
            wireDiameter    0.0016;
            wireLeadLen     0.2;
          }

          // ... other zone subdictionaries

        }

        // ... other physicsModels subdictionaries
      }

      // ... other subdictionaries