description: |-
  Drag coefficient in the form $f_d = ( A \log_{10}(Re) + B )^C$

  $$
    f_d = ( coeff \times \log_{10}(Re) + const )^{exp} \\
    K_d = 0.5 f_d \frac{\alpha \rho |U|}{D_h}
  $$

options:
  - key: coeff
    type: scalar
    required: true
    default:
    description: |
  - key: const
    type: scalar
    required: true
    default:
    description: |
  - key: exp
    type: scalar
    required: true
    default:
    description: |

usage:
  - comment: |-
      Example of mandatory dictionary entries (Filonenko correlation):
    snippet: |-
      physicsModels
      {
          dragModels
          {
              <cellZoneName>
              {
                  type    Colebrook;
                  coeff   1.82;
                  const   -1.64;
                  exp     2.0;
              }
          }
      }
