description: |-
  Drag coefficient in the form $f_d = ( A \log_{10}(Re) + B )^C$

      $$
          f_d = ( coeff \times \log_{10}(Re) + const )^{exp} \\
  	    K_d = 0.5 f_d \frac{\alpha \rho |U|}{D_h}
      $$

admonitions:
  - kind: warning
    body: |-
      Preliminary autogenerated documentation. Validate the description, options, and usage before publishing.

options:
  - key: coeff
    type: scalar
    required: true
    default:
    description: |
  - key: const
    type: scalar
    required: true
    default:
    description: |
  - key: exp
    type: scalar
    required: true
    default:
    description: |

usage:
  - comment: |-
      Usage already present in Header (verbatim):
    snippet: |-
      Example of mandatory dictionary entries (with this coefficients, this
          is the Filonenko correlation):

          \verbatim
          <cellZoneName>
          {
              type    Colebrook;
              coeff   1.82;
              const   -1.64;
              exp     2.0;
          }
          \endverbatim
  - comment: |-
      The model is specified via the ``type`` entry in the ``<dictName>/<subModel>/<zoneName>`` subdictionary of the ``phaseProperties`` file (located in ``constant/``, or ``constant/<regionName>`` for multi-region cases, e.g. ``constant/fluidRegion``). Here is a snippet enabling the model:
    snippet: |
      phaseProperties
      {
        physicsModels
        {
          <subModel>
          {
            "<zoneName>"
            {
              type Colebrook;
            }
          }
        }
      }

