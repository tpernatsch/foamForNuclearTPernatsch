description: |-
  Drag coefficient in the form $f_d = A + B \times Re^C$

  $$
    f_d = const + coeff \times Re^{exp} \\
    K_d = 0.5 f_d \frac{\alpha \rho |U|}{D_h}
  $$

options:
  - key: coeff
    type: scalar
    required: true
    default:
    description: Coefficient multiplying Reynolds power value (B)
  - key: exp
    type: scalar
    required: true
    default:
    description: Exponential coefficient on the Reynolds number (C)
  - key: const
    type: scalar
    required: false
    default: '0.0'
    description: Constant added to the power law (A)

usage:
  - comment: |-
      Example of mandatory dictionary entries (Blasius correlation):
    snippet: |-
      physicsModels
      {
          dragModels
          {
              <cellZoneName>
              {
                  type    ReynoldsPower;
                  coeff   0.316;
                  exp     -0.25;
              }
          }
      }
