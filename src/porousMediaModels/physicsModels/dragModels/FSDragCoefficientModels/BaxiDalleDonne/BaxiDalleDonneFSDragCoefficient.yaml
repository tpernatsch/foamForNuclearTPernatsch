description: |-
  Baxi-Dalle Donne correlation for pressure drop.

options:
  - key: pinDiameter
    type: scalar
    required: true
    default:
    description: |
  - key: wireDiameter
    type: scalar
    required: true
    default:
    description: |
  - key: wireLeadLen
    type: scalar
    required: true
    default:
    description: |

usage:
  - comment: |
      The drag model is specified via the ``type`` entry in the ``physicsModels/dragModels/<zoneName>`` subdictionary of the ``phaseProperties`` file.
      (located in ``constant/``, or ``constant/<regionName>`` for multi-region cases, e.g.
      ``constant/fluidRegion``).

      Here is a snippet of a ``phaseProperties`` file enabling the BaxiDalleDonne fluid–structure drag model:
    snippet: |
      // ... other phaseProperties subdictionaries

      physicsModels
      {
        dragModels
        {
          "<zoneName>"
          {
            type BaxiDalleDonne;
            wireDiameter    0.012;  // example value [m]
            pinDiameter 0.009;  // example value [m]
            wireLeadLen  0.1;  // example value [m]
          }

          // ... other zone subdictionaries

        }

        // ... other physicsModels subdictionaries
      }

      // ... other subdictionaries

