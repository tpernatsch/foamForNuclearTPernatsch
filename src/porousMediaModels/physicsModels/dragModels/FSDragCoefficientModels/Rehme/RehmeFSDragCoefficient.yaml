description: |-
  Rheme correlation for pressure drop

      $$
          P_t = D_p + 1.0444 D_w \\
          P_{w,pin} = N_p \pi (D_p + D_w) \\
          B = \sqrt{\frac{P_t}{D_p}}
              + \left(
                  7.6 \frac{D_p+D_w}{L_w} \left( \frac{P_t}{D_p} \right)^2
              \right)^{2.16} \\
          \\
          A = \frac{P_{w,pin}}{P_{w,pin} + P_{w,wrap}} \\
          B_1 = 64 \sqrt{B} \\
          B_2 = 0.0816 B^{0.9335} \\
          \\
          f_d = A \left( \frac{B_1}{Re} + \frac{B_2}{Re^{0.133}} \right)
      $$

      Reference publications:
      Klaus Rehme, "PRESSURE DROP CORRELATIONS FOR FUEL ELEMENT SPACERS", Nuclear
      Technology, 1973, Vol. 17, 1, pages 15-23, DOI:10.13182/NT73-A31250.

admonitions:
  - kind: warning
    body: |-
      Preliminary autogenerated documentation. Validate the description, options, and usage before publishing.

options:
  - key: numberOfPins
    type: int
    required: true
    default:
    description: |
  - key: pinDiameter
    type: scalar
    required: true
    default:
    description: |
  - key: wetWrapPerimeter
    type: scalar
    required: true
    default:
    description: |
  - key: wireDiameter
    type: scalar
    required: true
    default:
    description: |
  - key: wireLeadLen
    type: scalar
    required: true
    default:
    description: |

usage:
  - comment: |-
      Usage already present in Header (verbatim):
    snippet: |-
      Example of mandatory dictionary entries:
          \verbatim
          <cellZoneName>
          {
              numberOfPins        37;
              pinDiameter         0.006000;
              wireDiameter        0.0016;
              wireLeadLen         0.1;        //- I.e. pitch of the wrapper wire
              wetWrapPerimeter    0.175237;   //- Wetted wrapper perimeter (wrapper only)
          }
          \endverbatim
  - comment: |-
      The model is specified via the ``type`` entry in the ``<dictName>/<subModel>/<zoneName>`` subdictionary of the ``phaseProperties`` file (located in ``constant/``, or ``constant/<regionName>`` for multi-region cases, e.g. ``constant/fluidRegion``). Here is a snippet enabling the model:
    snippet: |
      phaseProperties
      {
        physicsModels
        {
          <subModel>
          {
            "<zoneName>"
            {
              type Rehme;
            }
          }
        }
      }

