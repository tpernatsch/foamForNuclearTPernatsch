description: |-
  Rehme correlation for pressure drop.

  .. math::

      P_t = D_p + 1.0444 D_w

  .. math::

      P_{w,pin} = N_p \pi (D_p + D_w)

  .. math::

      B = \sqrt{\frac{P_t}{D_p}}
          + \left(
              7.6\, \frac{D_p + D_w}{L_w}
              \left( \frac{P_t}{D_p} \right)^2
            \right)^{2.16}

  .. math::

      A = \frac{P_{w,pin}}{P_{w,pin} + P_{w,wrap}}

  .. math::

      B_1 = 64 \sqrt{B}

  .. math::

      B_2 = 0.0816\, B^{0.9335}

  .. math::

      f_d = A \left( \frac{B_1}{Re} + \frac{B_2}{Re^{0.133}} \right)

  Reference publications:

  - Klaus Rehme, "PRESSURE DROP CORRELATIONS FOR FUEL ELEMENT SPACERS",
    *Nuclear Technology*, 1973, Vol. 17(1), 15–23,
    DOI: 10.13182/NT73-A31250.


options:
  - key: numberOfPins
    type: int
    required: true
    default:
    description: Number of pins (Np)
  - key: pinDiameter
    type: scalar
    required: true
    default:
    description: Diameter of the pin (Dp)
  - key: wetWrapPerimeter
    type: scalar
    required: true
    default:
    description: Wetted wrapper perimeter (wrapper only)
  - key: wireDiameter
    type: scalar
    required: true
    default:
    description: Diameter of the wire (Dw)
  - key: wireLeadLen
    type: scalar
    required: true
    default:
    description: Pitch of the wrapper wire



usage:
  - comment: |
      The drag model is specified via the ``type`` entry in the ``physicsModels/dragModels/<zoneName>`` subdictionary of the ``phaseProperties`` file.
      (located in ``constant/``, or ``constant/<regionName>`` for multi-region cases, e.g.
      ``constant/fluidRegion``).

      Here is a snippet of a ``phaseProperties`` file enabling the Rehme fluid–structure drag model:
    snippet: |
      // ... other phaseProperties subdictionaries

      physicsModels
      {
        dragModels
        {
          "<zoneName>"
          {
            type    Rehme;
            numberOfPins        37;
            pinDiameter         0.006000;
            wireDiameter        0.0016;
            wireLeadLen         0.1;        //- I.e. pitch of the wrapper wire
            wetWrapPerimeter    0.175237;   //- Wetted wrapper perimeter (wrapper only)
          }

          // ... other zone subdictionaries

        }

        // ... other physicsModels subdictionaries
      }

      // ... other subdictionaries


