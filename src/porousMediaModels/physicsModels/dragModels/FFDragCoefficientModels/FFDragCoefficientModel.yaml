description: |-
  Class to manage the fluid-fluid (i.e. liquid-vapor) drag coefficient models. Available runtime selectable models include:

  toctreeHere

usage:
  - comment: |-
      The fluid-structure drag coefficient model is constructed at run-time via the
      dragModels subdictionary of the physicsModel subdictionary of the phaseProperties dictionary. 
    snippet: |-
      physicsModels
      {
          dragModels
          {
              "liquid.vapour"
              {
                  type    Bestion;
              }
          }
        }
      }