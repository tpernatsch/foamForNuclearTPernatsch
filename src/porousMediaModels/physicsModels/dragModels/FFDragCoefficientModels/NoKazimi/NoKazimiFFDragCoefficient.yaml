description: |
  NoKazimi fluid–fluid drag coefficient model for liquid–gas systems. Includes
  pin-lattice geometry effects via the ``pinPitch`` and ``pinDiameter`` inputs.

admonitions:
  - kind: warning
    body: |
      Applicable **only** to liquid–gas systems. Ensure ``stateOfMatter`` is set
      correctly in ``phaseProperties.<phaseName>Properties`` to distinguish gas and liquid.

options:
  - key: pinPitch
    type: scalar
    required: true
    default: null
    description: Pin-to-pin pitch (same units as ``pinDiameter``).
  - key: pinDiameter
    type: scalar
    required: true
    default: null
    description: Pin (rod) outer diameter.

usage:
  - comment: |
      The drag model is specified via the ``type`` entry in the ``physicsModels/dragModels/<zoneName>`` subdictionary of the ``phaseProperties`` file.
      (located in ``constant/``, or ``constant/<regionName>`` for multi-region cases, e.g.
      ``constant/fluidRegion``).

      Here is a snippet of a ``phaseProperties`` file enabling the NoKazimi fluid–fluid drag model:
    snippet: |
      // ... other phaseProperties subdictionaries

      physicsModels
      {
        dragModels
        {
          "<zoneName>"
          {
            type NoKazimi;
            pinPitch    0.012;  // example value [m]
            pinDiameter 0.009;  // example value [m]
          }

          // ... other zone subdictionaries

        }

        // ... other physicsModels subdictionaries
      }

      // ... other subdictionaries
