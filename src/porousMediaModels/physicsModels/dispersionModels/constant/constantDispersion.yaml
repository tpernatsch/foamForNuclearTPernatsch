description: |-
  Class implementing a constant dispersion model by delecting the dispersed phase

admonitions:
  - kind: warning
    body: |-
      Preliminary autogenerated documentation. Validate the description, options, and usage before publishing.

options:
  - key: dispersedPhase
    type: word
    required: true
    default:
    description: dispersed phase


usage:
  - comment: |-
      The dispersion model is constructed at run-time via the  dispersionModel subdictionary of the pairGeometryModels subdictionary of the physicsModel subdictionary of the phaseProperties dictionary. An example is reported below. Please note that the example makes use of the byRegime templated model, allowing to give different types to different regimes. 
    snippet: |-
      physicsModels
      {
        pairGeometryModels
        {
            "liquid.vapour"
            {
                dispersionModel
                {
                    type        byRegime;
                    regimeMap   "annularMist";
                    "annular"
                    {
                        type                constant;
                        dispersedPhase      "vapour";
                    }
                    "mist"
                    {
                        type                constant;
                        dispersedPhase      "liquid";
                    }
                }
            }
        }
      }