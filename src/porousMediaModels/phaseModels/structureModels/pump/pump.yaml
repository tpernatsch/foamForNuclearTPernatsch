description: |-
  Allow defining a momentum source, including options for a time
  dependent source, and a source coming from an FMU

  \mainauthor
      Stefan Radman (stefan.radman@epfl.ch / stefanradman92@gmail.com),
      Carlo Fiorina for the FMU part

admonitions:
  - kind: warning
    body: |-
      Preliminary autogenerated documentation. Please refer to the source code and tutorials for more reliable information.

options:
  - key: momentumSource
    type: vector
    required: true
    default:
    description: Momentum source vector
  - key: momentumSourceTimeProfile
    type: timeTable
    required: false
    default:
    description: Momentum source scaling factor as a time table or FMI port.

usage:
  - comment: |-
      Usage already present in Header (verbatim):
    snippet: |-
      // Example of mandatory dictionary entries:
      volumeFraction      0.5;
      Dh                  1;
      momentumSource      (0 0 1000);

      // Example of time dependant momentum source scaling entries:
      momentumSourceTimeProfile
      {
          type        table;
          startTime   100;
          table       table
          (
              //- <Time>  <Momentum source scaling factor>
              (   0       1   )
              (   1       0.1 )
          );
      }

      // Example of entries for scaling source coming from FMUs:
      momentumSourceTimeProfile
      {
          type            fmi;
          nameFromFMU     momentumSourceCoupled;
          initialValue    1.0;
      }
  - comment: |-
      The model is specified via the ``momentumSource`` entry in the ``structureModels/<zoneName>`` subdictionary of the ``phaseProperties`` file (located in ``constant/``, or ``constant/<regionName>`` for multi-region cases, e.g. ``constant/fluidRegion``). Here is a snippet enabling the model:
    snippet: |
      phaseProperties
      {
          structureModels
          {
              "<zoneName>"
              {
                  volumeFraction          0;
                  Dh                      0.0032;
                  momentumSource          (0 0 -166000);
                  momentumSourceTimeProfile
                  {
                      type        table;
                      startTime   910;
                      table       table
                      (
                          (   0   1   )
                          (   1   0.8490104619    )
                      );
              }
          }
      }
