description: |-
  Allow defining a momentum source, including options for a time
      dependent source, and a source coming from an FMU

      Authors:
      Stefan Radman (stefan.radman@epfl.ch / stefanradman92@gmail.com),
      Carlo Fiorina for the FMU part

admonitions:
  - kind: warning
    body: |-
      Preliminary autogenerated documentation. Validate the description, options, and usage before publishing.

options:
  - key: momentumSource
    type: vector
    required: true
    default:
    description: |

usage:
  - comment: |-
      Usage already present in Header (verbatim):
    snippet: |-
      Example of mandatory dictionary entries:
          \verbatim
              volumeFraction      0.5;
              Dh                  1;
              momentumSource      (0 0 1000);
          \endverbatim

          Example of time dependant momentum source scaling entries:
          \verbatim
              momentumSourceTimeProfile
              {
                  type        table;
                  startTime   100;
                  table       table
                  (
                      //- <Time>  <Momentum source scaling factor>
                      (   0       1   )
                      (   1       0.1 )
                  );
              }
          \endverbatim

          Example of entries for scaling source coming from FMUs:
          \verbatim
              pumpMultiplierNameFromFMU   momentumSourceCoupled;
          \endverbatim
  - comment: |-
      The model is specified via the ``type`` entry in the ``<dictName>/<subModel>/<zoneName>`` subdictionary of the ``phaseProperties`` file (located in ``constant/``, or ``constant/<regionName>`` for multi-region cases, e.g. ``constant/fluidRegion``). Here is a snippet enabling the model:
    snippet: |
      phaseProperties
      {
        physicsModels
        {
          <subModel>
          {
            "<zoneName>"
            {
              type pump;
            }
          }
        }
      }

