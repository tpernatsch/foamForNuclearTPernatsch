description: |-
  Turns power off if the field value maximum exceeds a provided value.

options:
  - key: fieldName
    type: word
    required: true
    default:
    description: Name of the volScalarField used for the criterion evaluation
  - key: fieldOperation
    type: word
    required: true
    default:
    description: Field operation performed to obtain value for comparison against  a threshold. Currently, only min and max are available.
  - key: criterion
    type: scalar
    required: true
    default:
    description: Criterion to be applied. Currently, only valueAboveThreshold and valueBelowThreshold are available
  - key: threshold
    type: scalar
    required: true
    default:
    description: Threshold
  - key: timeDelay
    type: scalar
    required: false
    default: '0.0'
    description: Time delay between the satifaction of the criterion and the moment power is actually turned off

usage:
  - comment: |-
      Example of usage:
    snippet: |-
      type            fieldValueThreshold;

      fieldName       "normalized.alpha.vapour";

      fieldOperation  max;

      criterion       valueAboveThreshold;

      threshold       0.957;

      timeDelay       0.0;

