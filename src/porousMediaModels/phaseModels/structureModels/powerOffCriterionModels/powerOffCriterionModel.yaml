description: |-
  Used to turn off structure power sources  if a certain criterion is met. Beside ``type``, the other keywords depend on the model selected. Available models listed below.

options: []

usage:
  - comment: |-
      The model is specified via the ``type`` entry in the ``<dictName>/<subModel>/<zoneName>`` subdictionary of the ``phaseProperties`` file (located in ``constant/``, or ``constant/<regionName>`` for multi-region cases, e.g. ``constant/fluidRegion``). Here is a snippet enabling the model:
    snippet: |
      phaseProperties
      {
        physicsModels
        {
          <subModel>
          {
            "<zoneName>"
            {
              type powerOffCriterionModel;
            }
          }
        }
      }

