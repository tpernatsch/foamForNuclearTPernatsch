usage:
  - comment: |-
      Usage already present in Header (verbatim):
    snippet: |-
      // From the one phase and PK tutorial.
      powerModel
      {
          type                nuclearFuelPin;

          // Initial power density if not computed by the neutronics sub-solver
          powerDensity        0;

          // Fuel pin dimensions in m
          fuelInnerRadius     0.0012;
          fuelOuterRadius     0.004715;
          cladInnerRadius     0.004865;
          cladOuterRadius     0.005365;

          // Fuel pin radial mesh
          fuelMeshSize        16;
          cladMeshSize        4;

          // Fuel constant thermophysical properties
          fuelRho             10480; // kg/m3
          fuelCp              250; // J/kg/K
          fuelK               3; // W/m/K

          // Cladding constant thermophysical properties
          cladRho             7500;
          cladCp              500;
          cladK               20;

          // Gap gas heat transfer coefficient
          gapH                3000;

          // Initial fuel and cladding temperatures
          fuelT               600;
          cladT               600;
      }

      // From the FFTF tutorial.
      powerModel
      {
          //- This volume fraction accounts for the pins only
          type                nuclearFuelPin;
          volumeFraction      0.5539729557;
          fuelMeshSize        10;
          cladMeshSize        5;
          fuelT               574.56;
          cladT               574.56;
          cladK               20;
          fuelK               3;
          cladRho             7870;
          fuelRho             10480;
          cladCp              500;
          fuelCp              250;
          cladOuterRadius     0.002921;
          cladInnerRadius     0.002540;
          fuelOuterRadius     0.002470;
          fuelInnerRadius     0.0;

          // Optional power-dependent heat transfer coefficient
          gapHPowerDensity    table
          (
              (   0               528.4782467867  )
              (   795443280.75916 3170.8694807204 )
          );
      }
  - comment: |-
      The model is specified via the ``type`` entry in the ``<dictName>/<subModel>/<zoneName>`` subdictionary of the ``phaseProperties`` file (located in ``constant/``, or ``constant/<regionName>`` for multi-region cases, e.g. ``constant/fluidRegion``). Here is a snippet enabling the model:
    snippet: |
      phaseProperties
      {
          physicsModels
          {
              <subModel>
              {
                  "<zoneName>"
                  {
                      type nuclearFuelPin;
                  }
              }
          }
      }
