description: |-
  Base class for lattices.

admonitions:
  - kind: warning
    body: |-
      Preliminary autogenerated documentation. Validate the description, options, and usage before publishing.

options:
  - key: lattice
    type: word
    required: true
    default:
    description: |
  - key: nElements
    type: int
    required: true
    default:
    description: |
  - key: origin
    type: scalar
    required: true
    default:
    description: |
  - key: pitch
    type: scalar
    required: true
    default:
    description: |
  - key: rotationAngle
    type: scalar
    required: false
    default: '0'
    description: |
  - key: type
    type: word
    required: true
    default:
    description: |

usage:
  - comment: |-
      Usage already present in Header (verbatim):
    snippet: |-
      Exemple for an hexagonal lattice
          \verbatim
          xyPosLattice
          {
              origin      (0 0);
              nElements   (5 5);
              pitch       0.6;
              type        hexagonal;
              lattice
              (
                  e e F F F      //   y -->
                   e F F F F     // x
                    F F F F F    // |
                     F F F F e   // V
                      F F F e e
              );
          }
          \endverbatim

          Exemple for a square lattice
          \verbatim
          xyPosLattice
          {
              origin      (0 0);
              nElements   (15 15);
              pitch       0.12;
              type        square;
              lattice
              (
                  e e e e e F F F F F e e e e e  //   y -->
                  e e e F F F F F F F F F e e e  // x
                  e e F F F F F F F F F F F e e  // |
                  e F F F F F F F F F F F F F e  // V
                  e F F F F F F F F F F F F F e
                  F F F F F F F F F F F F F F F
                  F F F F F F F F F F F F F F F
                  F F F F F F F F F F F F F F F
                  F F F F F F F F F F F F F F F
                  F F F F F F F F F F F F F F F
                  e F F F F F F F F F F F F F e
                  e F F F F F F F F F F F F F e
                  e e F F F F F F F F F F F e e
                  e e e F F F F F F F F F e e e
                  e e e e e F F F F F e e e e e
              );
          }
          \endverbatim

      \mainauthor
          Thomas Guilbaud (thomas.guilbaud@epfl.ch)
  - comment: |-
      The model is specified via the ``type`` entry in the ``<dictName>/<subModel>/<zoneName>`` subdictionary of the ``phaseProperties`` file (located in ``constant/``, or ``constant/<regionName>`` for multi-region cases, e.g. ``constant/fluidRegion``). Here is a snippet enabling the model:
    snippet: |
      phaseProperties
      {
        physicsModels
        {
          <subModel>
          {
            "<zoneName>"
            {
              type latticeMap;
            }
          }
        }
      }

