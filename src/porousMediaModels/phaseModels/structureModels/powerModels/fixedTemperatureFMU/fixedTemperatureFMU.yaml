description: |-
  Describes a structure with a temperature taken from an FMU

  \mainauthor
      Carlo Fiorina (carlo.fiorina@epfl.ch / carlo.fiorina@outlook.com)

admonitions:
  - kind: warning
    body: |-
      Preliminary autogenerated documentation. Validate the description, options, and usage before publishing.

options:
  - key: T
    type: scalar
    required: true
    default:
    description: |

usage:
  - comment: |-
      Usage already present in Header (verbatim):
    snippet: |-
      type            NusseltWallAndHfromFMU;
      HNameFromFMU    HCoupled;
      const   0.0;
      coeff   0.023;
      expRe   0.8;
      expPr   0.4;
      addH    30000;
  - comment: |-
      The model is specified via the ``type`` entry in the ``<dictName>/<subModel>/<zoneName>`` subdictionary of the ``phaseProperties`` file (located in ``constant/``, or ``constant/<regionName>`` for multi-region cases, e.g. ``constant/fluidRegion``). Here is a snippet enabling the model:
    snippet: |
      phaseProperties
      {
          physicsModels
          {
              <subModel>
              {
                  "<zoneName>"
                  {
                      type fixedTemperatureFMU;
                  }
              }
          }
      }
