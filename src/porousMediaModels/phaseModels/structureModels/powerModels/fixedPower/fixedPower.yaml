description: |-
  Describes a generic structure with a constant or time depdendent internal
  power production.
  Solves an energy equation for the structure, updating the average
  structure temperature (assumed equal to the structure surface temperature
  for fluid heat transfer purposes).

admonitions:
  - kind: warning
    body: |-
      Preliminary autogenerated documentation. Validate the description, options, and usage before publishing.

options:
  - key: Cp
    type: scalar
    required: true
    default:
    description: |
  - key: rho
    type: scalar
    required: true
    default:
    description: |
  - key: rhoCp
    type: scalar
    required: true
    default:
    description: |

usage:
  - comment: |-
      Usage already present in Header (verbatim):
    snippet: |-
      powerModel
      {
          type                fixedPower;
          volumetricArea      100;
          T                   652.15;
          Cp                  500;
          rho                 7700;
          powerDensity        4.5e8;
          powerTimeProfile // Optional
          {
              type        table;
              startTime   0;
              table       table
              (
                  (   0   4.5e8   )
                  ( 100   4.5e7   )
              );
          }
      }

      // Using FMI input
      powerModel
      {
          type                fixedPower;
          volumetricArea      100;
          T                   652.15;
          Cp                  500;
          rho                 7700;
          powerDensity        4.5e8;
      }
  - comment: |-
      The model is specified via the ``type`` entry in the ``<dictName>/<subModel>/<zoneName>`` subdictionary of the ``phaseProperties`` file (located in ``constant/``, or ``constant/<regionName>`` for multi-region cases, e.g. ``constant/fluidRegion``). Here is a snippet enabling the model:
    snippet: |
      phaseProperties
      {
          physicsModels
          {
              <subModel>
              {
                  "<zoneName>"
                  {
                      type fixedPower;
                  }
              }
          }
      }
