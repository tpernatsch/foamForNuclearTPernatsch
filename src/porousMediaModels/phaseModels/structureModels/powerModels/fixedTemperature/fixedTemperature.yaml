description: |-
  Describes a structure with a constant surface temperature.

  If the ``temperatureTimeProfile`` is provided, the new temperature $T$ at
  position $r$ and time $t+dt$ is computed as follow with the time profile $P$:

  $$
  T(r, t+dt) = T(r, t) \times \frac{P(t+dt)}{P(t)}
  $$

options:
  - key: volumetricArea
    type: scalar
    required: true
    default:
    description: Volumetric area of structure in m2/m3
  - key: volumeFraction
    type: scalar
    required: false
    default:
    description: Volume fraction of structure
  - key: T
    type: scalar
    required: true
    default:
    description: Initial temperature value in K applied to the ``T`` field
  - key: temperatureTimeProfile
    type: timeProfile
    required: false
    default:
    description: Temperature time profile as a table or via FMI

usage:
  - comment: |-
      Usage using a time table:
    snippet: |-
      powerModel
      {
          type            fixedTemperature;
          volumetricArea  121;
          T               617;
          temperatureTimeProfile // Optional
          {
              type        table;
              startTime   0;
              table       table
              (
                  (   0   617   )
                  (  10   717   )
              );
          }
      }
  - comment: |-
      Usage using an FMI input:
    snippet: |-
      powerModel
      {
          type            fixedTemperature;
          volumetricArea  450;
          T               850;
          temperatureTimeProfile
          {
              type            fmi;
              nameFromFMU     temperatureCoupled;
              initialValue    850;
          }
      }
  - comment: |-
      The model is specified via the ``type`` entry in the ``<dictName>/<subModel>/<zoneName>`` subdictionary of the ``phaseProperties`` file (located in ``constant/``, or ``constant/<regionName>`` for multi-region cases, e.g. ``constant/fluidRegion``). Here is a snippet enabling the model:
    snippet: |
      phaseProperties
      {
          structureProperties
          {
              "<zoneName>"
              {
                  powerModel
                  {
                      type fixedTemperature;
                  }
              }
          }
      }
