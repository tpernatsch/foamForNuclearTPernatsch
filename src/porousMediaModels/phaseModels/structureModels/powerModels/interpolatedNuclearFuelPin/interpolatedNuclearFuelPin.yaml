
description: |-
  Power model that interpolates heat flux and computes fuel-pin surface
  temperature based on region-specific fuel outer radius and
  interfacial-area density.  Provides region-wise mapping for fuel-pin substructures.


options:
  - key: fuelOuterRadius
    type: scalar
    required: true
    default:
    description: |

usage:
  - comment: |-
      The model is specified via the ``type`` entry in the ``<dictName>/<subModel>/<zoneName>`` subdictionary of the ``phaseProperties`` file (located in ``constant/``, or ``constant/<regionName>`` for multi-region cases, e.g. ``constant/fluidRegion``). Here is a snippet enabling the model:
    snippet: |
      phaseProperties
      {
          structureProperties
          {
              "<zoneName>"
              {
                  powerModel
                  {
                      type interpolatedNuclearFuelPin;
                  }
              }
          }
      }
