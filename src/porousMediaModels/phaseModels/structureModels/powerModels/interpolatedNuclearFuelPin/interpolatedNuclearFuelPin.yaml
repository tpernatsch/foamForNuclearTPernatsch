description: |-
  Model for representing a nuclear fuel pin with constant material
  properties. Models fuel, gap, cladding and solves for the heat equation
  with a finite differences scheme. Only radial heat diffusion is considered.
  Derivation of the equations is provided at the end of the present file.

  \mainauthor
      Stefan Radman (stefan.radman@epfl.ch / stefanradman92@gmail.com),
      Carlo Fiorina (carlo.fiorina@outlook.com / carlo.fiorina@epfl.ch)

admonitions:
  - kind: warning
    body: |-
      Preliminary autogenerated documentation. Validate the description, options, and usage before publishing.

options:
  - key: fuelOuterRadius
    type: scalar
    required: true
    default:
    description: |

usage:
  - comment: |-
      The model is specified via the ``type`` entry in the ``<dictName>/<subModel>/<zoneName>`` subdictionary of the ``phaseProperties`` file (located in ``constant/``, or ``constant/<regionName>`` for multi-region cases, e.g. ``constant/fluidRegion``). Here is a snippet enabling the model:
    snippet: |
      phaseProperties
      {
          structureProperties
          {
              "<zoneName>"
              {
                  powerModel
                  {
                      type interpolatedNuclearFuelPin;
                  }
              }
          }
      }
