description: |-
  Power models are used to simulate the behavior  of sub-scale structures that produce power. Main entries are repoted below.
  In the code, this is a run-time selectable class to handle the thermal description (i.e. energy   source/sinks) of a structure.
  It returns a heat source term to the main solver be used in the energy
  equations.


options:
  - key: type
    type: word
    required: true
    default:
    description: Run-type selectable model 
  - key: volumetricArea
    type: scalar
    required: true
    default:
    description: Structure surface area per unit volume. Normally needed. Not needed e.g., for nuclearFuelPin and heatedPin power models  since it can be derived by the volumeFraction
  - key: volumeFraction
    type: scalar
    required: false
    default:
    description: Used to compute the volumetric heat capacity of the structure as volumeFraction*rho*Cp.  Defaults to the overall structure volumeFraction the start of the cellZone subDict.
  - key: powerOffCriterionModel
    type: word
    required: false
    default:
    description: See :ref:`powerOffCriterionModel <powerOffCriterionModel>`

usage:
  - comment: |-
      The model is specified via the ``type`` entry in the ``powerModel`` subdictionary, within the ``structureProperties`` subdictionary  of the ``phaseProperties`` file (located in ``constant/``, or ``constant/<regionName>`` for multi-region cases, e.g. ``constant/fluidRegion``). Here below is a snippet enabling the model. All keywords except for ``type`` depends on the specific power model selected. 
      
    snippet: |
      structureProperties
      {
        "innerCore"
        {
          powerModel 
          {
            type                nuclearFuelPin;
            powerDensity        0;
            fuelInnerRadius     0.0012;
            fuelOuterRadius     0.004715;
            cladInnerRadius     0.004865;
            cladOuterRadius     0.005365;
            fuelMeshSize        30;
            cladMeshSize        5;
            fuelRho             10480;
            fuelCp              250;
            cladRho             7500;
            cladCp              500;
            gapH                3000;
            fuelK               3;
            cladK               20;
            fuelT               668;
            cladT               668;

          }
        }
      }
    comment: |-
      Available power models include:

      toctreeHere