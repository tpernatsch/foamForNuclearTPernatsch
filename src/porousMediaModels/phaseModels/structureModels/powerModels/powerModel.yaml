description: |-
  Run-time selectable class to handle the thermal description (i.e. energy
      source/sinks) of a structure.
      It returns a heat source term to the main solver be used in the energy
      equations.

      Stefan Radman (stefan.radman@epfl.ch / stefanradman92@gmail.com)

admonitions:
  - kind: warning
    body: |-
      Preliminary autogenerated documentation. Validate the description, options, and usage before publishing.

options:
  - key: volumeFraction
    type: scalar
    required: true
    default:
    description: |
  - key: volumetricArea
    type: scalar
    required: true
    default:
    description: |

usage:
  - comment: |-
      The model is specified via the ``type`` entry in the ``<dictName>/<subModel>/<zoneName>`` subdictionary of the ``phaseProperties`` file (located in ``constant/``, or ``constant/<regionName>`` for multi-region cases, e.g. ``constant/fluidRegion``). Here is a snippet enabling the model:
    snippet: |
      phaseProperties
      {
        physicsModels
        {
          <subModel>
          {
            "<zoneName>"
            {
              type powerModel;
            }
          }
        }
      }

