description: |-
  Class to handle the description of a mesh-unresolved structure. It is
  derived from phaseBase, to represent the volume fraction of the structure.
  The key member for the understanding of this class is cellFields_.
  The structure can be in fact though of as being composed by different
  regions, with properties defined only on certain cells of the mesh.
  However, as these region are meant NOT to spatially overlap, the
  overall structure can be described by a single set of fields (Dh_, iApow_,
  etc.) that are initialized/set/modified on a cell-by-cell basis.
  The cellFields_ member is thus a HashTable of scalarFields indexed by
  region name. These scalarFields are = 1.0 where the given
  region exists, and 0 elsewhere. What the region names are, that
  is set by the actual run-time-selected instance of the structure


options:
  - key: Dh
    type: scalar
    required: true
    default:
    description: Hydraulic diameter in m
  - key: volumeFraction
    type: scalar
    required: true
    default:
    description: Volume fraction of structure
  - key: powerModel
    type: dict
    required: false
    default:
    description: Dictionary containing the power model
  - key: passiveProperties
    type: dict
    required: false
    default:
    description: Dictionary containing the passive structure properties
  - key: volumetricArea
    type: scalar
    required: true
    default:
    description: Volumetric area of the passive structure in m2/m3
  - key: Cp
    type: scalar
    required: true
    default:
    description: Specific heat capacity in J/kg/K of the passive structure
  - key: rho
    type: scalar
    required: true
    default:
    description: Density in kg/m3 of the passive structure
  - key: rhoCp
    type: scalar
    required: false
    default:
    description: Product of the density and specific heat capacity in J/m3/K of the passive structure
  - key: T
    type: scalar
    required: true
    default:
    description: Initial temperature value in K applied to the ``T.passiveStructure`` field of the passive structure
  - key: localTortuosity
    type: vector
    required: true
    default:
    description: |
  - key: localX
    type: vector
    required: true
    default:
    description: |
  - key: localZ
    type: vector
    required: true
    default:
    description: |
  - key: type
    type: word
    required: true
    default:
    description: |

usage:
  - comment: |-
      The model is specified via the ``type`` entry in the ``<dictName>/<subModel>/<zoneName>`` subdictionary of the ``phaseProperties`` file (located in ``constant/``, or ``constant/<regionName>`` for multi-region cases, e.g. ``constant/fluidRegion``). Here is a snippet enabling the model:
    snippet: |
      phaseProperties
      {
          structureProperties
          {
              "<zoneName>"
              {
                  volumeFraction  0.5;
                  Dh              0.01;

                  powerModel
                  {
                      type    ...;
                      ...
                  }

                  passiveProperties
                  {
                      volumetricArea      2;
                      rho                 7700;
                      Cp                  500;
                      T                   600;
                  }
              }
          }
      }
