description: |-
  Heat exchanger.

  \mainauthor
      Stefan Radman (stefan.radman@epfl.ch / stefanradman92@gmail.com)

admonitions:
  - kind: warning
    body: |-
      Preliminary autogenerated documentation. Validate the description, options, and usage before publishing.

options:
  - key: primary
    type: word
    required: true
    default:
    description: Name of the source cellZone
  - key: secondary
    type: word
    required: true
    default:
    description: Name of the target cellZone
  - key: volumetricArea
    type: scalar
    required: true
    default:
    description: Voluemtric area of structure
  - key: wallConductance
    type: scalar
    required: true
    default:
    description: Wall conductance between the primary and the secondary

usage:
  - comment: |-
      The model is specified via the ``type`` entry in the ``<dictName>/<subModel>/<zoneName>`` subdictionary of the ``phaseProperties`` file (located in ``constant/``, or ``constant/<regionName>`` for multi-region cases, e.g. ``constant/fluidRegion``). Here is a snippet enabling the model:
    snippet: |
      phaseProperties
      {
          structureProperties
          {
              "IHXPrimary:IHXSecondary"
              {
                  volumeFraction          0;
                  Dh                      0.00113;
              }
              heatExchangers
              {
                  // Declare twice the Heat Exchanger, one per cellZone. This allows to
                  // link 2 heat exchanegr side from 2 different mesh (e.g. 1 with sodium
                  // fluid and 1 with water fluid)
                  "pIHX"
                  {
                      primary             "IHXPrimary";
                      secondary           "IHXSecondary";
                      volumetricArea      106.6673;
                      wallConductance     16736.4017;
                  }
                  "sIHX"
                  {
                      primary             "IHXSecondary";
                      secondary           "IHXPrimary";
                      volumetricArea      106.6673;
                      wallConductance     16736.4017;
                  }
              }
      }
