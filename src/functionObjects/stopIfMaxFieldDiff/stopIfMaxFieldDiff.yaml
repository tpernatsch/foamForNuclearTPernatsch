description: |-
  Stops the simulation when max(field1-field2) > 0 and prints out the
  simulation time. Both field1 and field2 must be volSclaraFields

  See also
      Foam::functionObjects::fvMeshFunctionObject
      Foam::functionObjects::writeFile

options:
  - key: field1
    type: word
    required: true
    default:
    description: |
  - key: field2
    type: word
    required: true
    default:
    description: |

usage:
  - comment: |-
      A functionObject is normally specified via the ``type`` entry in the ``functionObjects`` subdictionary of the ``controlDict`` file (located in ``system/``. Here is a snippet enabling a functionObject:
    snippet: |
      functions
      {
          <functionObject1>
          {
              type fieldDiffExtents;
          }
      }

  - comment: |-
      This is a detailed example of use of this specific function object.
    snippet: |-
      functions
      {
        stopIfMaxFieldDiff1
        {
            type          stopIfMaxFieldDiff;
            libs          ("libFFNFunctionObjects.so");
            ...
            writeToFile   yes;
            log           yes;
            field1        fieldName;
            field2        fieldName;
        }
      }
