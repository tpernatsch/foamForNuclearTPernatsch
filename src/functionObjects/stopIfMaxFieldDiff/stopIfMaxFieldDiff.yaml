description: |-
  Stops the simulation when max(field1-field2) > 0 and prints out the
      simulation time. Both field1 and field2 must be volSclaraFields

admonitions:
  - kind: warning
    body: |-
      Preliminary autogenerated documentation. Validate the description, options, and usage before publishing.

options:
  - key: field1
    type: word
    required: true
    default:
    description: |
  - key: field2
    type: word
    required: true
    default:
    description: |

usage:
  - comment: |-
      Usage already present in Header (verbatim):
    snippet: |-
      Example of function object specification:
          \verbatim
          stopIfMaxFieldDiff1
          {
              type                stopIfMaxFieldDiff;
              libs                ("libfieldFunctionObjects.so");
              ...
              writeToFile             yes;
              log                     yes;
              field1                  fieldName;
              field2                  fieldName;
          }
          \endverbatim

      Note
          For non-scalar fields, the magnitude of the field is employed and compared
          to the threshold value.

      See also
          Foam::functionObjects::fvMeshFunctionObject
          Foam::functionObjects::writeFile
  - comment: |-
      The model is specified via the ``type`` entry in the ``<dictName>/<subModel>/<zoneName>`` subdictionary of the ``phaseProperties`` file (located in ``constant/``, or ``constant/<regionName>`` for multi-region cases, e.g. ``constant/fluidRegion``). Here is a snippet enabling the model:
    snippet: |
      phaseProperties
      {
        physicsModels
        {
          <subModel>
          {
            "<zoneName>"
            {
              type stopIfMaxFieldDiff;
            }
          }
        }
      }

