description: |-
  Writes the values of an fvPatchScalarField

admonitions:
  - kind: warning
    body: |-
      Preliminary autogenerated documentation. Validate the description, options, and usage before publishing.

options:
  - key: field
    type: word
    required: true
    default:
    description: |
  - key: patch
    type: word
    required: true
    default:
    description: |

usage:
  - comment: |-
      Usage already present in Header (verbatim):
    snippet: |-
      Example of function object specification:
          \verbatim
          patchScalarFieldValue1
          {
              type                patchScalarFieldValue;
              libs                ("libfieldFunctionObjects.so");
              ...
              writeToFile             true;
              log                     false;
              field               fieldName
          }
          \endverbatim

      See also
          Foam::functionObjects::fvMeshFunctionObject
          Foam::functionObjects::writeFile
  - comment: |-
      The model is specified via the ``type`` entry in the ``<dictName>/<subModel>/<zoneName>`` subdictionary of the ``phaseProperties`` file (located in ``constant/``, or ``constant/<regionName>`` for multi-region cases, e.g. ``constant/fluidRegion``). Here is a snippet enabling the model:
    snippet: |
      phaseProperties
      {
        physicsModels
        {
          <subModel>
          {
            "<zoneName>"
            {
              type patchScalarFieldValue;
            }
          }
        }
      }

