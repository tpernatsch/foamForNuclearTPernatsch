description: |-
  Writes the values of an fvPatchScalarField

  See also
      Foam::functionObjects::fvMeshFunctionObject
      Foam::functionObjects::writeFile

options:
  - key: type
    type: word
    required: true
    default:
    description: type name patchScalarFieldValue
  - key: writeToFile
    type: bool
    required: false
    default: true
    description: write data to file 
  - key: field
    type: word
    required: true
    default:
    description: field name 
  - key: log
    type: bool
    required: false
    default: false
    description: rite  data to standard output


usage:
  - comment: |-
      A functionObject is normally specified via the ``type`` entry in the ``functionObjects`` subdictionary of the ``controlDict`` file (located in ``system/``. Here is a snippet enabling a functionObject:
    snippet: |
      functionObjects
      {
          <functionObject1>
          {
              type fieldDiffExtents;
          }
      }
  - comment: |-
      This is a detailed example of use of this specific function object. 
    snippet: |-
      functionObjects
      {
        patchScalarFieldValue1
        {
            type        patchScalarFieldValue;
            libs        ("libFunctionObjects.so");
            ...
            writeToFile   true;
            log           false;
            field         fieldName;
        }
      }
