description: |-
  Calculates the total mass flux in kg/s through a set of faceSets, faceZones
  or patches.

admonitions:
  - kind: warning
    body: |-
      Preliminary autogenerated documentation. Validate the description, options, and usage before publishing.
  - kind: note
    body: |-
      For non-scalar fields, the magnitude of the field is employed and compared
      to the threshold value.

options:
  - key: alphaRhoPhiName
    type: word
    required: true
    default:
    description: |
  - key: regionName
    type: word
    required: true
    default:
    description: |
  - key: regionType
    type: word
    required: true
    default:
    description: |
  - key: scaleFactor
    type: scalar
    required: false
    default: '1.0'
    description: |

usage:
  - comment: |-
      Usage already present in Header (verbatim):
    snippet: |-
      // Example of function object specification:
      massFlow1
      {
          type              massFlow;
          libs              ("libfieldFunctionObjects.so");
          ...
          writeToFile       yes;
          log               yes;
          regionType        patch;
          regionName        outlet;
          alphaRhoPhiName   "alphaRhoPhi.liquid"
      }
  - comment: |-
      The functionObject is specified via the ``type`` entry in the ``functionObjects`` subdictionary of the ``controlDict`` file (located in ``system/``. Here is a snippet enabling the functionObject:
    snippet: |
      functionObjects
      {
          <functionObject1>
          {
              type massFlow;
          }
      }
