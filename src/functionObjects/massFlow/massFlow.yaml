description: |-
  Calculates the total mass flux in kg/s through a faceSet, faceZone or patch.

options:
  - key: alphaRhoPhiName
    type: word
    required: true
    default:
    description: name of the alphaRhoPhi field in the solver
  - key: regionName
    type: word
    required: true
    default:
    description: name of the patch, faceSet or faceZone
  - key: regionType
    type: word
    required: true
    default:
    description: patch, faceSet or faceZone
  - key: scaleFactor
    type: scalar
    required: false
    default: '1.0'
    description: scale the flow rate with the provided factor

usage:
  - comment: |-
      A functionObject is normally specified via the ``type`` entry in the ``functionObjects`` subdictionary of the ``controlDict`` file (located in ``system/``. Here is a snippet enabling a functionObject:
    snippet: |
      functions
      {
          <functionObject1>
          {
              type massFlow;
          }
      }

  - comment: |-
      This is a detailed example of use of this specific function object.
    snippet: |-
      functions
      {
        yourMassFlowName
        {
            type              massFlow;
            libs              ("libFFNFunctionObjects.so");
            ...
            writeToFile       yes;
            log               yes;
            regionType        patch;
            regionName        outlet;
            alphaRhoPhiName   "alphaRhoPhi.liquid"
        }
      }
