description: |-
  Calculates the spatial minimum and maximum extents of a field

      The extents are derived from the bound box limits after identifying the
      locations where field values exceed the user-supplied threshold value.

admonitions:
  - kind: warning
    body: |-
      Preliminary autogenerated documentation. Validate the description, options, and usage before publishing.

options:
  - key: pressure
    type: word
    required: false
    default: '"p_rgh"'
    description: |
  - key: region1
    type: word
    required: true
    default:
    description: |
  - key: region1Type
    type: word
    required: true
    default:
    description: |
  - key: region2
    type: word
    required: true
    default:
    description: |
  - key: region2Type
    type: word
    required: true
    default:
    description: |

usage:
  - comment: |-
      Usage already present in Header (verbatim):
    snippet: |-
      Example of function object specification:
          \verbatim
          pressureDrop1
          {
              type                pressureDrop;
              libs                ("libfieldFunctionObjects.so");
              ...
              writeToFile             yes;
              log                     yes;
              upstreamRegionType      patch/faceSet;
              upstreamRegion          inlet;
              downstreamRegionType    faceSet;
              downstreamRegion        outlet;
              pressure                p_rgh
          }
          \endverbatim

      Note
          For non-scalar fields, the magnitude of the field is employed and compared
          to the threshold value.

      See also
          Foam::functionObjects::fvMeshFunctionObject
          Foam::functionObjects::writeFile
  - comment: |-
      The model is specified via the ``type`` entry in the ``<dictName>/<subModel>/<zoneName>`` subdictionary of the ``phaseProperties`` file (located in ``constant/``, or ``constant/<regionName>`` for multi-region cases, e.g. ``constant/fluidRegion``). Here is a snippet enabling the model:
    snippet: |
      phaseProperties
      {
        physicsModels
        {
          <subModel>
          {
            "<zoneName>"
            {
              type pressureDrop;
            }
          }
        }
      }

