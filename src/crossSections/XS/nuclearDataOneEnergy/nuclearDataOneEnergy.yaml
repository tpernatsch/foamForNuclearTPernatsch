description: |-
  Object for a single nuclear quantity handling at a specific energy. The
  interpolation scheme used is based on the polyharmonic spline radial basis
  function (RBF). This class is able to interpolate any
  number of perturbed states for any number of parameters. This class is mainly
  used by the ``XS`` object.

  $$
  \sigma_{E_g, \Omega_l}(\textbf{x})
      = \sum_{i=1}^{N_{perturb}} w_i \phi(\|\textbf{x} - \textbf{c}_i\|)
      + v_0
      + \sum_{k=1}^{N_{param}} v_k x_k
  $$

  The default basis function form used is linear

  $$
  \phi(\| \textbf{x} - \textbf{c}_i \|) = \| \textbf{x} - \textbf{c}_i \| \quad
  (\phi(r) = | r |)
  $$

  It is possible to use higher order basis functions using
  ``polyharmonicSplineMode`` in the ``nuclearData`` file:

  :`1`: :math:`\phi(r) = |r|`
  :`2`: :math:`\phi(r) = r^2 \ln(r)`
  :`3`: :math:`\phi(r) = |r^3|`
  :`4`: :math:`\phi(r) = r^4 \ln(r)`

  The weights $w_i$ and $v_j$ are determined such that the function
  interpolates $N_{perturb}$ given points $(\textbf{c}_i, \sigma_{i})$
  (for i = 1, 2, …, $N_{perturb}$) and fulfills the $N_{param} + 1$
  orthogonality conditions

  $$
  \sum_{i=1}^{N} w_{i} = 0 \quad \quad
  \sum_{i=1}^{N} w_{i} \textbf{c}_{i} = \textbf{0}
  $$

  All together, these constraints are equivalent to the symmetric linear system
  of equations

  $$
  \begin{bmatrix} A & B \\ B^{\textrm {T}} & 0 \end{bmatrix}
  \begin{bmatrix} \textbf{w} \\ \textbf{v} \end{bmatrix}
  =
  \begin{bmatrix} \sigma \\ \textbf{0} \end{bmatrix}
  $$

  where

  $$
  A_{i,j} = \phi(|\textbf{c}_i - \textbf{c}_j|)
  \quad \quad
  B = \begin{bmatrix}
      1 & 1 & \cdots & 1 \\
      \textbf{c}_1 & \textbf{c}_2 & \cdots & \textbf{c}_N
  \end{bmatrix}^{\textrm {T}}
  \quad \quad
  \sigma = \left[ \sigma_1, \sigma_2, \ldots, \sigma_N \right]^{\textrm {T}}
  $$


  \mainauthor of this file (and associated .C or included .H files):
    Thomas Guilbaud <thomas.guilbaud@epfl.ch>, EPFL/Transmutex SA (Switzerland)

