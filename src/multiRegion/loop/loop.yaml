description: |-
  Many multi-physics simulations require flexible control over the time
  advancement procedure. While some physics must be tightly coupled, others
  interact only weakly. This situation is common in multi-scale simulations:
  physics are strongly coupled within a single scale but only loosely coupled
  across scales.

  To provide this flexibility, dedicated *loops* are introduced. A loop defines
  a set of solvers that are iterated together using a prescribed convergence
  strategy. For example, the ``picardLoop`` contains a list of solvers that
  must be tightly coupled. During run-time, when any of the involved physics is
  corrected, all solvers in the ``picardLoop`` are iteratively updated until a
  user-specified convergence criterion is satisfied. At each iteration, both
  volumetric and boundary field exchanges are performed to update the coupling
  variables between regions.

  In addition to the standard ``picardLoop``, other loop types exist, each
  designed for specific coupling strategies. These may include additional field
  manipulations, residual evaluations, or specialized update sequences tailored
  to the physics being solved.

  All *loops* are defined in the ``system/regionsDict`` file, within the
  ``regionSolvers`` sub-dictionary. Each loop entry specifies:

  - the list of sub-solvers that are tightly coupled,
  - the convergence residual threshold,
  - the maximum number of iterations, and
  - any optional parameters associated with the chosen loop type.

  Loops may also be nested, resulting in hierarchical or tree-like coupling
  structures, as illustrated in the usage below.

  Current loops available in *GeN-Foam* include:

  .. toctree::
    :maxdepth: 1
    :glob:

    ./**

  .. raw:: html

   <br><br>

options:
  - key: fluidRegionName
    type: word
    required: true
    default:
    description: |
  - key: fluidSidePatchName
    type: word
    required: true
    default:
    description: |
  - key: solidRegionName
    type: word
    required: true
    default:
    description: |
  - key: solidSidePatchName
    type: word
    required: true
    default:
    description: |
  - key: underRelaxation
    type: scalar
    required: true
    default:
    description: |

usage:
  - comment: |-
      General usage is as follow  
  - snippet: |- 
      regionSolvers
      {
          multiPhysicsSolver1 //multiPhysicsSolverName
          {
              solvers // list of solvers
              {
                  regionName              solverName;
                  fluidRegion             onePhase;
                  neutroRegion            diffusionNeutronics;
                  multiPhysicsSolver2     loop;
              }
              maxResidual 0.00005;   // residual after which the iteration is ended
              maxIterations 3;       // maximum number of iterations before the loop is ended
              includeFluidMechanicsInLoop  false; //defaulted to false
          }
          multiPhysicsSolver2
          {
              ...
          }
      }
  - comment: |-
     A specific example of coupling is reported below  
            .. mermaid::

                graph TD
                    A[GeN-Foam] --> B[Solver 1]
                    A --> C[MultiPhysicsSolver 1]
                    C --> D[Solver 2]
                    C --> E[MultiPhysicsSolver 2]
                    E --> F[Solver 3]
                    E --> G[Solver 4]


      Which can be translated in *system/regionsDict*:

      .. code :: cpp

          // In system/regionsDict

          regionSolvers
          {
              Level_0
              {
                  Solver1                 physicsB;
                  MultiPhysicsSolver1     picardLoop;
              }
              MultiPhysicsSolver1
              {
                  subSolvers
                  {
                      Solver2                 physicsD;
                      MultiPhysicsSolver2     picardLoop;
                  }
                  maxResidual     0.00005;
                  maxIterations   3;
              }
              MultiPhysicsSolver2
              {
                  subSolvers
                  {
                      Solver3     physicsF;
                      Solver4     physicsG;
                  }
                  maxResidual     0.00005;
                  maxIterations   3;
              }
          }


      Note that all the physics that are specified in the ``Level_0`` of the ``regionSolvers`` dict are
      loosely coupled, whereas only those specified within a ``picardLoop`` are
      tightly coupled.

      The previous example would correspond to a time loop as shown below.

      .. mermaid::

          graph TD
              S@{ shape: sm-circ, label: "Small start" } --> A
              A[New time step] --> B[Solver 1]
              B --> C[Solver 2]
              C --> D[Solver 3]
              D --> E[Solver 4]
              E --> F{Is MultiPhysicsSolver 2 converged?}
              F -- No --> D
              F -- Yes --> G{Is MultiPhysicsSolver 1 converged?}
              G -- No --> C
              G -- Yes --> A
              G --> End@{ shape: framed-circle, label: "Stop" }
  - comment: |-
      If includeFluidMechanicsInLoop entry is set to false (default value), for the thermal-hydraulics
      solvers only the energy is solved iteratively with the other physics, while the fluid-mechanics
      is solved only once at the beginning of the iteration. This is done so that useless
      fluid-mechanics iterations are solved.

