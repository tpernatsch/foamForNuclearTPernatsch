description: |-
  Identical to the picardLoop, but it does not solve the fluid-mechancs equations at
      each of the iterations. Instead, it solves the fluid-mechanics equations only once
      at the beginning of the iteration, and then solves the energy equation of the
      thermal-hydraulics solver iteratively with the other physics.

admonitions:
  - kind: warning
    body: |-
      Preliminary autogenerated documentation. Validate the description, options, and usage before publishing.

options:
  - key: maxIterations
    type: int
    required: true
    default:
    description: |
  - key: minResidual
    type: scalar
    required: true
    default:
    description: |

usage:
  - comment: |-
      Usage already present in Header (verbatim):
    snippet: |-
      In regionsDict, the following subDict is used to create a picardLoopNoFluid

          \verbatim
              regionSolvers
              {
                  Level_0
                  {
                      Level_1     picardLoopNoFluid;
                  }
                  Level_1
                  {
                      subSolvers // list of solvers
                      {
                          regionName              solverName;
                          fluidRegion             onePhase;
                          neutroRegion            diffusionNeutronics;
                          Level_2                 picardLoopNoFluid;
                      }
                      minResidual 0.00005;   // residual after which the iteration is ended
                      maxIterations 3;       // maximum number of iterations before the loop is ended
                  }

                  Level_2
                  {
                      ...
                  }
              }
          \endverbatim
  - comment: |-
      The model is specified via the ``type`` entry in the ``<dictName>/<subModel>/<zoneName>`` subdictionary of the ``phaseProperties`` file (located in ``constant/``, or ``constant/<regionName>`` for multi-region cases, e.g. ``constant/fluidRegion``). Here is a snippet enabling the model:
    snippet: |
      phaseProperties
      {
        physicsModels
        {
          <subModel>
          {
            "<zoneName>"
            {
              type picardLoopNoFluid;
            }
          }
        }
      }

