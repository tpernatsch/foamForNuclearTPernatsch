description: |-
  This class implements a dedicated Fluid–Structure Interaction (FSI) solver
  that couples a single fluid region to a single solid region using the
  Arbitrary Lagrangian–Eulerian (ALE) approach. The solver is designed as a
  specialized loop that advances both physics in a tightly coupled manner
  within each time step, ensuring consistent interface conditions for velocity,
  displacement, and traction. It assumes that the solid and fluid are coupled
  through a single patch on both sides, allowing for a direct exchange of
  information between the fluid and solid regions. The fluid solver is expected
  to support dynamicFvMesh in order to deform the mesh according to the solid
  displacement. The loop assumes that the solid region is not deformed, using
  a non-updated approach for the displacement solution.

options:
  - key: fluidRegionName
    type: word
    required: true
    default:
    description: |
  - key: fluidSidePatchName
    type: word
    required: true
    default:
    description: |
  - key: maxIterations
    type: int
    required: true
    default:
    description: |
  - key: minResidual
    type: scalar
    required: true
    default:
    description: |
  - key: solidRegionName
    type: word
    required: true
    default:
    description: |
  - key: solidSidePatchName
    type: word
    required: true
    default:
    description: |
  - key: underRelaxationFactor
    type: scalar
    required: true
    default:
    description: |
  - key: useHTC
    type: bool
    required: true
    default:
    description: |

usage:
  - comment: |-
      The following subDict is an example on how to create an FSILoop in regionsDict:
    snippet: |-
      regionSolvers
      {
        Level_0
        {
          Level_1 FSILoop;
        }
        
        Level_1
        {
          subSolvers
          {
            fluid rhoPimpleFoam;
            solid extendedThermoMechanics;
          }
   
          maxIterations 100;
          maxResidual 1e-5;
          
          FSILoopCoeffs
          {
            FSIInterface true;
            fluidRegionName fluid;
            solidRegionName solid;
            solidSidePatchName plate;
            fluidSidePatchName plate;
            underRelaxationFactor 0.05;
            couplingStartTime 2;
          }

        }
      }
