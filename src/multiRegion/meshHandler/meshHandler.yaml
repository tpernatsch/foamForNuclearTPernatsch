description: |-
  Class to hold all the region meshes and perform the volumetric mappings

admonitions:
  - kind: warning
    body: |-
      Preliminary autogenerated documentation. Validate the description, options, and usage before publishing.

options:
  - key: axialDirection
    type: vector
    required: true
    default:
    description: |
  - key: axialLocations
    type: scalar
    required: true
    default:
    description: |
  - key: interpolationType
    type: word
    required: true
    default:
    description: |
  - key: locations
    type: vectorList
    required: true
    default:
    description: |
  - key: patchName
    type: word
    required: true
    default:
    description: |
  - key: regionToReplicate
    type: word
    required: true
    default:
    description: |
  - key: sourceField
    type: word
    required: true
    default:
    description: |
  - key: sourceFields
    type: word
    required: true
    default:
    description: |
  - key: sourceRegions
    type: word
    required: true
    default:
    description: |
  - key: targetField
    type: word
    required: true
    default:
    description: |
  - key: type
    type: word
    required: true
    default:
    description: |

usage:
  - comment: |-
      Usage already present in Header (verbatim):
    snippet: |-
      In regionsDict
          \verbatim
              mappings
              {
                  <Name of region ONTO which I am mapping>
                  {
                      <Name of region FROM which I am mapping>
                      {
                          sourceFields    (nameOfSourceField1 nameOfSourceField2);
                          targetFields    (nameOfTargetField1 nameOfTargetField2);
                      }
                  }
                  neutroRegion
                  {
                      fluidRegion
                      {
                          sourceFields    ( T U mu alpha );
                          targetFields    (TCool U mu alpha );
                      }
                  }
              }
          \endverbatim
  - comment: |-
      The model is specified via the ``type`` entry in the ``<dictName>/<subModel>/<zoneName>`` subdictionary of the ``phaseProperties`` file (located in ``constant/``, or ``constant/<regionName>`` for multi-region cases, e.g. ``constant/fluidRegion``). Here is a snippet enabling the model:
    snippet: |
      phaseProperties
      {
        physicsModels
        {
          <subModel>
          {
            "<zoneName>"
            {
              type meshHandler;
            }
          }
        }
      }

