description: |
  Burnup model that allows the burnup field to be prescribed
  explicitly from a `Bu` field file located in the starting time folder.

  If a `Bu` file is present in the starting time folder, the internal field and
  boundary conditions are read directly from that file. If the `Bu` file is not
  present, the burnup field is initialized to 0 MWd/MT in all cells,
  with `zeroGradient` boundary conditions applied to all non-empty and non-wedge
  patches.

  When this model is selected, the burnup field **does not evolve over time** and
  remains constant throughout the simulation, either as defined in the starting
  time folder or as set by default by OFFBEAT.

admonitions:
  - kind: note
    body: |
      The `constant` burnup model is the appropriate choice when coupling OFFBEAT
      to an external solver that provides the burnup field `Bu` directly.

      At each coupled iteration, the `Bu` file generated by the external solver
      should be placed in the starting time folder before (re)starting the OFFBEAT
      simulation.

  - kind: warning
    body: |
      For backward compatibility, `fromLatestTime` can still be used as the
      type name for the `constant` burnup model. However, its use is deprecated
      and should be avoided in new input files.

options: []

usage:
  - comment: |
      Activate the `constant` burnup model in the `solverDict`.
    snippet: |
      burnup constant;
