description: |
  Gap gas model that computes gap gas composition, pressure, temperature,
  and volume using correlations derived from the FRAPCON 4.0 manual.

  The gap gas state at the initial time (presure and composition) must 
  be separately provided via the `gapGas` file.

  The model assumes:
  - ideal gas behavior,
  - multiple free-volume regions (gap, plena, central hole, cracks),
  - instantaneous pressure equalization over the entire free volume.

formulation: |
  The gas pressure is going to be calculated as:

  $$
  \begin{aligned}
  p = \frac{nR}{\sum_i(Vi/Ti)}
  \end{aligned}
  $$
                    
  where the i might stand for the gap, plena, central hole or cracks.
  The calculation of the various V/T terms is done separately for the various
  sections of the free volume. 

  The calculation of the gap and plena volumes is done applying the 
  gauss-green theorem applied to the bounding surfaces:

  $$
  \begin{aligned}
  V = \int_V dV =\frac{1}{3} \int_V div(\vec{r}) dV =  = \frac{1}{3} \oint_S 
  (\vec{r_s} \cdot n) dS
  \end{aligned}
  $$   

admonitions:
  - kind: warning
    body: |
      Gap patches must use the `regionCoupledOFFBEAT` boundary condition.
      This is required for correct AMI-based volume and temperature evaluation.


options:
  - key: gapPatches
    location: gapGasOptions
    type: list[word]
    required: true
    description: |
      Patches defining the fuel–cladding gap (e.g. `fuelOuter cladInner`).

  - key: holePatches
    location: gapGasOptions
    type: list[word]
    required: false
    default: []
    description: |
      Patches defining internal fuel holes.

  - key: topFuelPatches
    location: gapGasOptions
    type: list[word]
    required: false
    description: |
      Patches at the top of the fuel stack.

  - key: bottomFuelPatches
    location: gapGasOptions
    type: list[word]
    required: false
    description: |
      Patches at the bottom of the fuel stack.

  - key: gapVolumeOffset
    location: gapGasOptions
    type: scalar
    required: false
    default: 0.0
    description: |
      Offset applied to the initial gap volume.

  - key: gasReserveVolume
    location: gapGasOptions
    type: scalar
    required: false
    default: 0.0
    description: |
      Additional reserve gas volume used in pressure calculation.

  - key: gasReserveTemperature
    location: gapGasOptions
    type: scalar
    required: false
    default: 290
    description: |
      Temperature of the reserve gas (K).

  - key: gasReserveTemperatureList
    location: gapGasOptions
    type: table
    required: false
    py:
      type: OffbeatTimeProfile
      imports:
        - "from foamForNuclear.timeProfile import OffbeatTimeProfile"
    description: |
      Time-dependent table for reserve gas temperature.
      If present, it overrides `gasReserveTemperature`.

  - key: includeCentralHole
    location: gapGasOptions
    type: bool
    required: false
    default: true
    description: |
      Include fuel central hole volume in the free volume calculation.

  - key: includeDishes
    location: gapGasOptions
    type: bool
    required: false
    default: true
    description: |
      Include dish geometry in the free volume calculation.


externalOptions:
  - key: massFractions
    path: <timeDirectory>.uniform.gapGas
    type: dictionary[str, scalar]
    required: true
    description: |
      Initial gas mass fractions for:
      `Ar`, `He`, `Kr`, `Ne`, `Rn`, `Xe`.

  - key: gasPressureType
    path: <timeDirectory>.uniform.gapGas
    type: word
    required: false
    default: fromModel
    description: |
      Pressure prescription method:
      - `fromModel`: computed by the gap gas model (default)
      - `fixed`: use `gasPressure`
      - `fromList`: use `gapPressureList`

  - key: gasPressure
    path: <timeDirectory>.uniform.gapGas
    type: scalar
    required: false
    description: |
      Fixed gas pressure (Pa), only used when `gasPressureType` is `fixed`.

  - key: gapPressureList
    path: <timeDirectory>.uniform.gapGas
    type: table
    required: false
    description: |
      Time-dependent table for gap pressure (Pa), only used when
      `gasPressureType` is `fromList`.

      Expected structure:
      - `type`: table
      - `values`: list of (time, pressure)
      - optional `outOfBounds` (default: clamp)
      - optional `interpolationScheme` (e.g. linear)


usage:
  - comment: |
      Snippet of `solverDict` to activate the FRAPCON-based gap gas model.
    snippet: |
      gapGas Frapcon;

      gapGasOptions
      {
          gapPatches ( fuelOuter cladInner );
          holePatches ( fuelInner );
          topFuelPatches ( fuelTop );
          bottomFuelPatches ( fuelBottom );

          gapVolumeOffset 0.0;
          gasReserveVolume 0.0;
          gasReserveTemperature 290;

          includeCentralHole on;
          includeDishes on;
      }
  
  - comment: |
      At the same time the user **must** set the `gapGas` file inside the time 
      step folder (e.g. `0/uniform/`):
    snippet: | 
      massFractions
      {
          Ar 0;
          He 1;
          Kr 0;
          Ne 0;
          Rn 0;
          Xe 0;
      };

      gasPressureType                 fromModel;// fixed;// fromList;
      gasPressure                     2.25e6;
          
      //  gapPressureList
      //  {
      //  type    table;
      //  
      //      values
      //      (
      //          (0.0    1e5)
      //          (100.0  1e6)
      //      );

      //      outOfBounds         clamp;     // optional out-of-bounds handling
      //      interpolationScheme linear;    // optional interpolation method
      //  }