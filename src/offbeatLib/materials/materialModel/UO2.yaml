description: |
  The `UO2` material model represents UO$_2$ nuclear fuel.

  The class selects thermophysical and mechanical property models as well as
  fuel behavioral models (densification, swelling, relocation, failure, and
  pore velocity). If not specified in the material dictionary, default models
  are used.

options:
  - key: densityModel
    type: word
    required: false
    default: UO2Constant
    description: |
      Selects the density correlation used by the `UO2` material.

  - key: heatCapacityModel
    type: word
    required: false
    default: UO2Matpro
    description: |
      Selects the heat capacity correlation used by the `UO2` material.

  - key: conductivityModel
    type: word
    required: false
    default: UO2Matpro
    description: |
      Selects the thermal conductivity correlation used by the `UO2` material.

  - key: emissivityModel
    type: word
    required: false
    default: UO2Relap
    description: |
      Selects the emissivity correlation used by the `UO2` material.

  - key: YoungModulusModel
    type: word
    required: false
    default: UO2Matpro
    description: |
      Selects the Young's modulus correlation used by the `UO2` material.

  - key: PoissonRatioModel
    type: word
    required: false
    default: UO2Constant
    description: |
      Selects the Poisson's ratio correlation used by the `UO2` material.

  - key: thermalExpansionModel
    type: word
    required: false
    default: UO2Relap
    description: |
      Selects the thermal expansion correlation used by the `UO2` material.

  - key: densificationModel
    type: word
    required: false
    default: none
    description: |
      Selects the densification (additional strain) model used by the `UO2` material.

  - key: swellingModel
    type: word
    required: false
    default: none
    description: |
      Selects the swelling (additional strain) model used by the `UO2` material.

  - key: relocationModel
    type: word
    required: false
    default: none
    description: |
      Selects the relocation (additional strain) model used by the `UO2` material.

  - key: failureModel
    type: word
    required: false
    default: none
    description: |
      Selects the failure model used by the `UO2` material.

  - key: poreVelocityModel
    type: word
    required: false
    default: none
    description: |
      Selects the pore velocity model used by the `UO2` material.

usage:
  - comment: |
      Example of a `solverDict` materials entry using the `UO2` material model
      with its default sub-model selections.
    snippet: |
      materials
      {
          fuel
          {
              material UO2;

              // Optional overrides (defaults shown)
              densityModel            UO2Constant;
              heatCapacityModel       UO2Matpro;
              conductivityModel       UO2Matpro;
              emissivityModel         UO2Relap;
              YoungModulusModel       UO2Matpro;
              PoissonRatioModel       UO2Constant;
              thermalExpansionModel   UO2Relap;

              densificationModel      UO2Frapcon;
              swellingModel           UO2Frapcon;
              relocationModel         UO2Frapcon;
              failureModel            none;
              poreVelocityModel       none;
          }
      }
