description: |
  The `Molybdenum` material model represents molybdenum structural material.

  The class selects thermophysical and mechanical property models and a swelling
  model. Default correlations are primarily taken from the BISON manual.

options:
  - key: densityModel
    type: word
    required: false
    default: MoConstant
    description: |
      Selects the density model used by the `Molybdenum` material.

  - key: heatCapacityModel
    type: word
    required: false
    default: Mo
    description: |
      Selects the heat capacity correlation used by the `Molybdenum` material.

  - key: conductivityModel
    type: word
    required: false
    default: Mo
    description: |
      Selects the thermal conductivity correlation used by the `Molybdenum`
      material.

  - key: emissivityModel
    type: word
    required: false
    default: MoConstant
    description: |
      Selects the emissivity model used by the `Molybdenum` material.

  - key: YoungModulusModel
    type: word
    required: false
    default: Mo
    description: |
      Selects the Young's modulus correlation used by the `Molybdenum` material.

  - key: PoissonRatioModel
    type: word
    required: false
    default: MoConstant
    description: |
      Selects the Poisson's ratio model used by the `Molybdenum` material.

  - key: thermalExpansionModel
    type: word
    required: false
    default: Mo
    description: |
      Selects the thermal expansion correlation used by the `Molybdenum` material.

  - key: swellingModel
    type: word
    required: false
    default: FeCrAl
    description: |
      Selects the swelling model used by the `Molybdenum` material.

usage:
  - comment: |
      Example of a `solverDict` materials entry using the `Molybdenum` material
      model.
    snippet: |
      materials
      {
          disc
          {
              material Molybdenum;

              densityModel            MoConstant;
              heatCapacityModel       Mo;
              conductivityModel       Mo;
              emissivityModel         MoConstant;
              YoungModulusModel       Mo;
              PoissonRatioModel       MoConstant;
              thermalExpansionModel   Mo;

              swellingModel           FeCrAl;
          }
      }
