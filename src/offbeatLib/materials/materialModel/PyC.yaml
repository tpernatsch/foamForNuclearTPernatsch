description: |
  The `PyC` material model represents pyrolytic carbon used in TRISO fuel
  particles.

  The class selects thermophysical and mechanical property models together
  with a swelling model, primarily based on PARFUME correlations.

options:
  - key: densityModel
    type: word
    required: false
    default: constant
    description: |
      Selects the density model used by the `PyC` material.

  - key: heatCapacityModel
    type: word
    required: false
    default: constant
    description: |
      Selects the heat capacity model used by the `PyC` material.

  - key: conductivityModel
    type: word
    required: false
    default: constant
    description: |
      Selects the thermal conductivity model used by the `PyC` material.

  - key: emissivityModel
    type: word
    required: false
    default: "- missing -"
    description: |
      Selects the emissivity model used by the `PyC` material.

  - key: YoungModulusModel
    type: word
    required: false
    default: PyCParfume
    description: |
      Selects the Young's modulus correlation used by the `PyC` material.

  - key: PoissonRatioModel
    type: word
    required: false
    default: constant
    description: |
      Selects the Poisson's ratio model used by the `PyC` material.

  - key: thermalExpansionModel
    type: word
    required: false
    default: PyCParfume
    description: |
      Selects the thermal expansion correlation used by the `PyC` material.

  - key: swellingModel
    type: word
    required: false
    default: PyCParfume
    description: |
      Selects the irradiation-induced swelling model used by the `PyC` material.

usage:
  - comment: |
      Example of a `solverDict` materials entry using the `PyC` material model.
    snippet: |
      materials
      {
          PyC
          {
              material PyC;

              YoungModulusModel       PyCParfume;
              thermalExpansionModel   PyCParfume;
              swellingModel           PyCParfume;
          }
      }
