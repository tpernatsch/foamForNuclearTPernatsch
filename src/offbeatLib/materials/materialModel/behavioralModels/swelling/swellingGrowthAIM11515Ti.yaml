description: |
  Class modelling the void swelling growth phenomenon for 15-15 Ti cladding
  material according to the 'AIM1 15-15 Ti' correlation.
  Source : "Modeling and Analysis of Nuclear Fuel Pin Behavior for Innovative
  Lead Cooled FBR - L.Luzzi et al. - 2014"

options:
  - key: fastFluenceName
    type: word
    required: false
    default: fastFluence
    description: |
      Name of the fast fluence field.
  - key: par1
    type: scalar
    required: false
    default: 1.3e-5
    description: |
      Correlation parameter.
  - key: par2
    type: scalar
    required: false
    default: -2.5
    description: |
      Correlation parameter.
  - key: par3
    type: scalar
    required: false
    default: 490
    description: |
      Correlation parameter.
  - key: par4
    type: scalar
    required: false
    default: 100
    description: |
      Correlation parameter.
  - key: par5
    type: scalar
    required: false
    default: 3.9
    description: |
      Correlation parameter.

usage:
  - comment: |
      Example selection of `Steel1515TiAim1`.
    snippet: |
        materials
        {
            clad
            {
                type Steel1515Ti;

                swelling
                {
                    type Steel1515TiAim1;
                    // fastFluenceName fastFluence;
                    // par1 1.3e-5;
                    // par2 -2.5;
                    // par3 490;
                    // par4 100;
                    // par5 3.9;
                }
            }
        }
