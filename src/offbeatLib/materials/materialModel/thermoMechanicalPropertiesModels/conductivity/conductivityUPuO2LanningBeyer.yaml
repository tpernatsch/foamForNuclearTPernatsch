description: |
  Thermal conductivity correlation for MOX fuel (U-Pu-O₂) based on the
  Lanning–Beyer formulation.

options:
  - key: densityFraction
    type: scalar
    required: false
    default: 0.95
    description: |
      Fraction of theoretical density used by the correlation.

      Optional override: if not provided here, it is expected in the material
      base/composition dictionary.

usage:
  - comment: |
      Example selection of the Lanning–Beyer conductivity correlation for MOX fuel in the `solverDict`.
    snippet: |
        materials
        {
            fuel
            {
                type UPuO2;

                conductivity
                {
                    type UPuO2LanningBeyer;

                    // Optional override
                    // densityFraction 0.95;
                }
            }
        }
