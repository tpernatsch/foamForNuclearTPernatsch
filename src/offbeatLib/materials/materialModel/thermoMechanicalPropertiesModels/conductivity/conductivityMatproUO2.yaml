usage:
  - comment: |
      Typical selection in a fuel material dictionary in the `solverDict`.
    snippet: |
      materials
      {
          fuel
          {
              material UO2;

              // Typically required by the model (read from base dictionary)
              densityFraction 0.95;
              GdContent  0.0;

              conductivity
              {
                  type UO2Matpro;

                  // Optional
                  burnupName Bu;
                  
                  // Optional override of base values
                  densityFraction 0.95;
                  GdContent  0.0;
              }
          }
      }

  - comment: |
      Legacy selection (deprecated).
    snippet: |
      materials
      {
          fuel
          {
              material UO2;

              densityFraction 0.95;

              conductivityModel UO2Matpro;
          }
      }
