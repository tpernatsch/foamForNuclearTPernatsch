description: |
  The `Molybdenum` conductivity model provides a temperature-dependent thermal
  conductivity correlation for molybdenum.

  Parameters can optionally be provided in the `conductivity` sub-dictionary.
  If not provided, the default values embedded in the model are used.

options:
  - key: par1
    type: scalar
    required: false
    default: 9.128e-06
    description: |
      Quadratic coefficient in the correlation.

  - key: par2
    type: scalar
    required: false
    default: 4.945e-2
    description: |
      Linear coefficient in the correlation.

  - key: par3
    type: scalar
    required: false
    default: 152
    description: |
      Constant term in the correlation.

usage:
  - comment: |
      Example selection using a `conductivity` sub-dictionary in the `solverDict`.
    snippet: |
      materials
      {
          disc
          {
              material Molybdenum;

              conductivity
              {
                  type Molybdenum;

                  // Optional overrides
                  // par1 9.128e-06;
                  // par2 4.945e-2;
                  // par3 152;
              }
          }
      }
