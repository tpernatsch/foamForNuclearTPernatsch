description: |
  Heat Capacity model for UO2 derived from Matprov11.

options:
  - key: ED
    type: scalar
    required: false
    default: 1.577e5
    description: |
      Model parameter.
  - key: K1
    type: scalar
    required: false
    default: 296.7
    description: |
      Model parameter.
  - key: K2
    type: scalar
    required: false
    default: 2.43e-2
    description: |
      Model parameter.
  - key: K3
    type: scalar
    required: false
    default: 8.745e7
    description: |
      Model parameter.
  - key: OM
    type: scalar
    required: false
    default: 2.0
    description: |
      Model parameter.
  - key: par1
    type: scalar
    required: false
    default: 2.0
    description: |
      Model parameter.
  - key: par2
    type: scalar
    required: false
    default: 2.0
    description: |
      Model parameter.
  - key: par3
    type: scalar
    required: false
    default: 2.0
    description: |
      Model parameter.
  - key: phi
    type: scalar
    required: false
    default: 535.285
    description: |
      Model parameter.

usage:
  - comment: |
      Example selection of the `UO2Matpro` heat capacity model.
    snippet: |
      materials
      {
          fuel
          {
              type UO2;
      
              heatCapacity
              {
                  type UO2Matpro;
                  // ED 1.577e5;
                  // K1 296.7;
                  // K2 2.43e-2;
                  // K3 8.745e7;
                  // OM 2.0;
                  // par1 2.0;
                  // par2 2.0;
                  // par3 2.0;
              }
          }
      }