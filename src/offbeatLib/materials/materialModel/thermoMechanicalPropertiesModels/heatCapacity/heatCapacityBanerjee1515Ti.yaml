description: |
  Correlation for 15-15 Ti heat capacity from Banerjee et al. (2007).

options:
  - key: par1
    type: scalar
    required: false
    default: 431
    description: |
      Model parameter.
  - key: par2
    type: scalar
    required: false
    default: 0.177
    description: |
      Model parameter.
  - key: par3
    type: scalar
    required: false
    default: 8.72e-5
    description: |
      Model parameter.

usage:
  - comment: |
      Example selection of the `Steel1515TiBanerjee` heat capacity model.
    snippet: |
      materials
      {
          structure
          {
              type Steel1515Ti;
      
              heatCapacity
              {
                  type Steel1515TiBanerjee;
                  // par1 431;
                  // par2 0.177;
                  // par3 8.72e-5;
              }
          }
      }