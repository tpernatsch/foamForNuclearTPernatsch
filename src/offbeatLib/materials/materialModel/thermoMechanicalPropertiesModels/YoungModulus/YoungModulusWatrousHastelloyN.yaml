description: |
  Class modelling Young Modulus of HN from work of Watrous.

options:
  - key: par1
    type: scalar
    required: false
    default: 9.944e-08
    description: |
      Option read by the model.
  - key: par2
    type: scalar
    required: false
    default: 1.178e-4
    description: |
      Option read by the model.
  - key: par3
    type: scalar
    required: false
    default: 1.033e-1
    description: |
      Option read by the model.
  - key: par4
    type: scalar
    required: false
    default: 220.9
    description: |
      Option read by the model.

usage:
  - comment: |
      Example selection of the `HastelloyNWatrous` thermalExpansion model.
    snippet: |
      materials
      {
        cladding
        {
          type HastelloyN;
          thermalExpansion
          {
            type HastelloyNWatrous;
            // par1 9.944e-08;
            // par2 1.178e-4;
            // par3 1.033e-1;
            // par4 220.9;
          }
        }
      }
