description: |
  Class modelling the Young's modulus of D9 Steel cladding using the Hofman
  correlation.

options:
  - key: par1
    type: scalar
    required: false
    default: 2.01e5
    description: |
      Option read by the model.
  - key: par2
    type: scalar
    required: false
    default: 79.29
    description: |
      Option read by the model.

usage:
  - comment: |
      Example selection of the `SteelD9Hofman` thermalExpansion model.
    snippet: |
      materials
      {
        cladding
        {
          type Steel1515Ti;
          thermalExpansion
          {
            type SteelD9Hofman;
            // par1 2.01e5;
            // par2 79.29;
          }
        }
      }
