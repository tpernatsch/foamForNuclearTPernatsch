description: |
  Class modelling Young Modulus of SiC from Snead et al. work:
  L. L. Snead, T. Nozawa, Y. Katoh, T.-S. Byun, S. Kondo, and D. A. Petti.
  Handbook of sic properties for fuel performance modeling.
  Journal of Nuclear Materials, 371:329–377, 2007.

options:
  - key: B
    type: scalar
    required: false
    default: 0.04e9
    description: |
      Option read by the model.
  - key: C
    type: scalar
    required: false
    default: 0.0
    description: |
      Option read by the model.
  - key: E0
    type: scalar
    required: false
    default: 460e9
    description: |
      Option read by the model.
  - key: T0
    type: scalar
    required: false
    default: 962.0
    description: |
      Option read by the model.

usage:
  - comment: |
      Example selection of the `SiCSnead` thermalExpansion model.
    snippet: |
      materials
      {
        SiC
        {
          type SiC;
          thermalExpansion
          {
            type SiCSnead;
            // B 0.04e9;
            // C 0.0;
            // E0 460e9;
            // T0 962.0;
          }
        }
      }
