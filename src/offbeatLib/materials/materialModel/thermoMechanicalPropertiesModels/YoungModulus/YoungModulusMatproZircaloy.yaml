description: |
  Class modelling Young Modulus of Zircaloy from Matprov11.

options:
  - key: fastFluenceName
    type: word
    required: false
    default: "fastFluence"
    description: |
      Option read by the model.

  - key: par1
    type: scalar
    required: false
    default: 6.61e11
    description: |
      Option read by the model.
  - key: par10
    type: scalar
    required: false
    default: 4.05e7
    description: |
      Option read by the model.
  - key: par2
    type: scalar
    required: false
    default: 5.912e8
    description: |
      Option read by the model.
  - key: par3
    type: scalar
    required: false
    default: 2.6e10
    description: |
      Option read by the model.
  - key: par4
    type: scalar
    required: false
    default: 0.88
    description: |
      Option read by the model.
  - key: par5
    type: scalar
    required: false
    default: 0.12
    description: |
      Option read by the model.
  - key: par6
    type: scalar
    required: false
    default: 1e25
    description: |
      Option read by the model.
  - key: par7
    type: scalar
    required: false
    default: 1.088e11
    description: |
      Option read by the model.
  - key: par8
    type: scalar
    required: false
    default: 5.475e7
    description: |
      Option read by the model.
  - key: par9
    type: scalar
    required: false
    default: 9.21e10
    description: |
      Option read by the model.

usage:
  - comment: |
      Example selection of the `ZircaloyMatpro` thermalExpansion model.
    snippet: |
      materials
      {
        cladding
        {
          type Zircaloy;
          thermalExpansion
          {
            type ZircaloyMatpro;
            // fastFluenceName "fastFluence";
            // par1 6.61e11;
            // par10 4.05e7;
            // par2 5.912e8;
            // par3 2.6e10;
            // par4 0.88;
            // par5 0.12;
            // par6 1e25;
            // par7 1.088e11;
            // par8 5.475e7;
            // par9 9.21e10;
          }
        }
      }
