description: |
  Class modelling the Young's modulus of (U,Pu)O2 MOX fuel.

options:
  - key: densityFraction
    type: scalar
    required: false
    description: |
      Fraction of theoretical density.
      Optional override. If not provided here, the value is read from the 
      material base dictionary (preferred).
  - key: oxygenMetalRatio
    type: scalar
    required: false
    description: |
      Oxygen to metal ratio.
      Optional override. If not provided here, the value is read from the 
      material base dictionary (preferred).
  - key: par1
    type: scalar
    required: false
    default: 2.334e11
    description: |
      Option read by the model.
  - key: par2
    type: scalar
    required: false
    default: 2.752
    description: |
      Option read by the model.
  - key: par3
    type: scalar
    required: false
    default: 1.0915e-4
    description: |
      Option read by the model.

usage:
  - comment: |
      	Example selection of the `UPuO2Matpro` thermalExpansion model.
    snippet: |
      materials
      {
        fuel
        {
          type UPuO2;
          thermalExpansion
          {
            type UPuO2Matpro;
            // densityFraction 0.945;
            // oxygenMetalRatio 2.0;
            // par1 2.334e11;
            // par2 2.752;
            // par3 1.0915e-4;
          }
        }
      }
