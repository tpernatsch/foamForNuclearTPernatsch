description: |
  Class modelling the transversly isotropic thermal expansion of PyC through
  the code Parfume.

options:
  - key: par1
    type: scalar
    required: false
    default: 30.0
    description: |
      Option read by the model.
  - key: par2
    type: scalar
    required: false
    default: 37.5
    description: |
      Option read by the model.
  - key: par3
    type: scalar
    required: false
    default: 0.11
    description: |
      Option read by the model.
  - key: par4
    type: scalar
    required: false
    default: 673.0
    description: |
      Option read by the model.
  - key: par5
    type: scalar
    required: false
    default: 700.0
    description: |
      Option read by the model.
  - key: par6
    type: scalar
    required: false
    default: 36.0
    description: |
      Option read by the model.

usage:
  - comment: |
      Example selection of the `PyCParfume` thermalExpansion model.
    snippet: |
      materials
      {
        PyC
        {
          type PyC;
          thermalExpansion
          {
            type PyCParfume;
            // par1 30.0;
            // par2 37.5;
            // par3 0.11;
            // par4 673.0;
            // par5 700.0;
            // par6 36.0;
          }
        }
      }
