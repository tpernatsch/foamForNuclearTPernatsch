description: |
  Class modelling the constant density of (U,Pu)O2 MOX fuel.

options:
  - key: densityFraction
    type: scalar
    required: false
    description: |
      Fraction of theoretical density.
      Optional override. If not provided here, the value is read from the 
      material base dictionary (preferred).

  - key: theoreticalDensity
    type: scalar
    required: false
    description: |
      Theoretical density.
      Optional override. If not provided here, the value is read from the 
      material base dictionary (preferred).

usage:
  - comment: |
      Example selection of the `UPuO2Constant` density model.
    snippet: |
      materials
      {
        fuel
        {
          type UPuO2;
          density
          {
            type UPuO2Constant;
            // densityFraction 0.945;
            // theoreticalDensity 10430;
          }
        }
      }
