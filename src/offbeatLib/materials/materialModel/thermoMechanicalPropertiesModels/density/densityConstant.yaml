description: |
  Model for constant density. The value is read from dictionary.

options:  
  - key: value
    type: scalar
    required: true
    description: |
      Density value in kg/m^3

usage:
  - comment: |
      Example selection of the `constant` density model.
    snippet: |
      materials
      {
        fuel
        {
          type constant;
          density
          {
            type constant;
            value 10960;
          }
        }
      }
