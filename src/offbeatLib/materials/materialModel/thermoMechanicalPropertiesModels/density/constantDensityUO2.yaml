description: |
  Class to set UO2 density to a constant input value.

options:
  - key: densityFraction
    type: scalar
    required: false
    description: |
      Fraction of theoretical density.
      Optional override. If not provided here, the value is read from the 
      material base dictionary (preferred).

  - key: theoreticalDensity
    type: scalar
    required: false
    description: |
      Theoretical density.
      Optional override. If not provided here, the value is read from the 
      material base dictionary (preferred).

usage:
  - comment: |
      Example selection of the `UO2Constant` density model.
    snippet: |
      materials
      {
        fuel
        {
          type UO2;
          density
          {
            type UO2Constant;
            // densityFraction 0.95;
            // theoreticalDensity 10960;
          }
        }
      }
