description: |
  Class modelling Poisson's ratio of 15-15 Ti cladding material based on Tobbe
  correlation (1975).

options:
  - key: par1
    type: scalar
    required: false
    default: 0.277
    description: |
      Option read by the model.
  - key: par2
    type: scalar
    required: false
    default: 6e-5
    description: |
      Option read by the model.

usage:
  - comment: |
      Example selection of the `Steel1515TiTobbe` thermalExpansion model.
    snippet: |
      materials
      {
        cladding
        {
          type Steel1515Ti;
          thermalExpansion
          {
            type Steel1515TiTobbe;
            // par1 0.277;
            // par2 6e-5;
          }
        }
      }
