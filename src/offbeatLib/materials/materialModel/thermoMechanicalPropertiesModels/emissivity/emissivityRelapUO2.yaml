description: |
  UO2 emissivity model derived from Relap.

options:
  - key: par1
    type: scalar
    required: false
    default: 0.7856
    description: |
      Correlation parameter.
  - key: par2
    type: scalar
    required: false
    default: 1.5263e-5
    description: |
      Correlation parameter.

usage:
  - comment: |
      Example selection of the RELAP-based UO2 emissivity correlation.
    snippet: |
      materials
      {
          fuel
          {
              material UO2;
              
              emissivity
              {
                  type UO2Relap;
              
                  // Optional overrides
                  // par1 0.7856;
                  // par2 1.5263e-5;
              }
          }
      }