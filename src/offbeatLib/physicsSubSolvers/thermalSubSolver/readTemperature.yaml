description: |
  Thermal solver class that reads the temperature `T`  field from the time-step 
  folders stored in a separate sub-folder (`constant/timeDependentInput/`).

  If the `T` file is present in the corresponding time folder for a given time
  step, the temperature field will be set accordingly. Otherwise, the `T` field
  remains constant.

  The `readTemperature` class provides a convenient way to explicitly couple
  OFFBEAT with an external solver that separately generates the `T` field.
  To use this class, simply place the `T` files generated by the external solver
  in the corresponding time folders within the
  `constant/timeDependentInput/` sub-folder.

admonitions:
  - kind: warning
    body: |
      This class might be redundant, as the same functionality can be achieved
      using standard OpenFOAM functionObjects.

options: []

usage:
  - comment: |
      Code snippet of the `solverDict` to activate the `readTemperature`
      thermal solver.
    snippet: |
      thermalSolver
      {
        type readTemperature;
        // Print summary of boundary-heat fluxes at each iteration
        heatFluxSummary false;

        // Activate calculation of enthalpy - false by default
        calculateEnthalpy false;
      }
