description: |
  St. Venant–Kirchhoff **hyperelastic constitutive law**.

  This model describes finite-strain elastic behaviour using the
  St. Venant–Kirchhoff formulation.

options: []

usage:
  - comment: |
      Example of the `solverDict` configuration to activate the
      `hyperElasticity` constitutive law.
    snippet: |
      materials
      {
        solid
        {
          type Steel;

          // other material options/models

          constitutiveLaw
          {
            type hyperElasticity;
          }
        }

        // other materials subdict
      }
