description: |-
  Albedo boundary condition for SP3 or diffusion calculations. Please note that
  the boundary condition needs to be set both for first and second moments in
  SP3.

admonitions:
  - kind: warning
    body: |-
      Preliminary autogenerated documentation. Please refer to the source code and tutorials for more reliable information.

options:
  - key: diffCoeffName
    type: word
    required: false
    default: '"diffCoeffName"'
    description: |
  - key: fluxStarAlbedo
    type: word
    required: false
    default: '"fluxStarAlbedo"'
    description: |
  - key: forSecondMoment
    type: bool
    required: false
    default: 'false'
    description: true in case it is a condition for a second moment flux (for SP3 calculations)
  - key: gamma
    type: scalar
    required: true
    default:
    description: Defined as (1-alpha)/(1+alpha)/2, alpha being the albedo coefficient

usage:
  - comment: |-
      Usage already present in Header (verbatim):
    snippet: |-
      <patchName>
      {
          type            albedoSP3;
          gamma           0.5;            // defined as (1-alpha)/(1+alpha)/2, alpha being the albedo coefficient
          diffCoeffName   Dalbedo;        // not to be changed
          fluxStarAlbedo  fluxStarAlbedo; // not to be changed
          forSecondMoment false;          // true in case it is a condition for a second moment flux (for SP3 calculations)
          value           uniform 1;
      }
  - comment: |-
      The boundary condition is specified via the ``type`` entry in the ``boundaryField/<patchName>`` subdictionary of the ``<fieldName>`` file (located in ``<timeFolder>/``, or ``<timeFolder>/<regionName>/`` for multi-region cases, e.g. ``0/neutroRegion``). Here is a snippet enabling the boundary condition:
    snippet: |
      boundaryField
      {
          <patch1>
          {
              type albedoSP3;
          }
      }
