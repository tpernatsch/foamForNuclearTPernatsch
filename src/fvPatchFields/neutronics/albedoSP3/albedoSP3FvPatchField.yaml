description: |-
  Albedo boundary condition for SP3 or diffusion calculations. Please note that the
      boundary condition needs to be set both for first and second moments in SP3.

admonitions:
  - kind: warning
    body: |-
      Preliminary autogenerated documentation. Validate the description, options, and usage before publishing.

options:
  - key: diffCoeffName
    type: word
    required: false
    default: '"diffCoeffName"'
    description: |
  - key: fluxStarAlbedo
    type: word
    required: false
    default: '"fluxStarAlbedo"'
    description: |
  - key: forSecondMoment
    type: bool
    required: false
    default: 'false'
    description: |
  - key: gamma
    type: scalar
    required: true
    default:
    description: |

usage:
  - comment: |-
      Usage already present in Header (verbatim):
    snippet: |-
      \verbatim
          <patchName>
          {
              type            albedoSP3;
              gamma           0.5; // defined as (1-alpha)/(1+alpha)/2, alpha being the albedo coefficient
              diffCoeffName   Dalbedo;  //not to be changed
              fluxStarAlbedo  fluxStarAlbedo; //not to be changed
              forSecondMoment false;  //true in case it is a condition for a second moment flux (for SP3 calculations)
              value           uniform 1;
          }
          \endverbatim
  - comment: |-
      The model is specified via the ``type`` entry in the ``<dictName>/<subModel>/<zoneName>`` subdictionary of the ``phaseProperties`` file (located in ``constant/``, or ``constant/<regionName>`` for multi-region cases, e.g. ``constant/fluidRegion``). Here is a snippet enabling the model:
    snippet: |
      phaseProperties
      {
        physicsModels
        {
          <subModel>
          {
            "<zoneName>"
            {
              type albedoSP3FvPatchField;
            }
          }
        }
      }

