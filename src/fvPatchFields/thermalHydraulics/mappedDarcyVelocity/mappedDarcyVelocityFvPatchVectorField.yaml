description: |-
  Velocity inlet boundary condition either correcting the extrapolated
  velocity or creating a uniform velocity field normal to the patch adjusted
  to match the specified flow rate

  For a mass-based flux:

  - the flow rate should be provided in kg/s
  - if ``rho`` is "none" the flow rate is in m3/s
  - otherwise ``rho`` should correspond to the name of the density field
  - if the density field cannot be found in the database, the user must
    specify the inlet density using the ``rhoInlet`` entry

  For a volumetric-based flux:

  - the flow rate is in m3/s

  Sets a time-dependent velocity in the form

  $$
  U(t) = U_0 (A + B (t-t_0))^C
  $$

  See also
      Foam::fixedValueFvPatchField

admonitions:
  - kind: warning
    body: |-
      Preliminary autogenerated documentation. Validate the description, options, and usage before publishing.

options:
  - key: isPorousRegion
    type: bool
    required: true
    default:
    description: |

usage:
  - comment: |-
      The boundary condition is specified via the ``type`` entry in the ``boundaryField/<patchName>`` subdictionary of the ``<fieldName>`` file (located in ``<timeFolder>/``, or ``<timeFolder>/<regionName>/`` for multi-region cases, e.g. ``0/neutroRegion``). Here is a snippet enabling the boundary condition:
    snippet: |
      boundaryField
      {
          <patch1>
          {
              type mappedDarcyVelocity;
          }
      }
