description: |-
  This boundary condition provides a simplified black body radiation condition
      calculated as:

      $$
          T_{mat} = \sqrt[4]{\frac{q''}{\sigma \epsilon} + T_a^4}
      $$

      The heat flux is approximated using the Fourier law with the cells at the
      boundary:

      $$
          q'' = \kappa \frac{T_{cell} - T_{patch face}}{d}
      $$

admonitions:
  - kind: warning
    body: |-
      Preliminary autogenerated documentation. Validate the description, options, and usage before publishing.

options:
  - key: Ta
    type: scalar
    required: true
    default:
    description: |
  - key: emissivity
    type: scalar
    required: true
    default:
    description: |
  - key: kappa
    type: scalar
    required: true
    default:
    description: |

usage:
  - comment: |-
      Usage already present in Header (verbatim):
    snippet: |-
      Example of the boundary condition specification:
          \verbatim
          <patchName>
          {
              type            blackBodyRadiation;
              emissivity      0.78;
              kappa           10;
              Ta              10;
              value           uniform 300; // Surface temperature
          }
          \endverbatim

          If used in another solver (e.g laplacianFoam), add the following line in
          system/controlDict:
          \verbatim
          libs ("libFFSSrc2.so");
          \endverbatim

      \mainauthor Author of this file (and associated .C or included .H files):
          Thomas Guilbaud <thomas.guilbaud@epfl.ch>, EPFL (Switzerland)
  - comment: |-
      The model is specified via the ``type`` entry in the ``<dictName>/<subModel>/<zoneName>`` subdictionary of the ``phaseProperties`` file (located in ``constant/``, or ``constant/<regionName>`` for multi-region cases, e.g. ``constant/fluidRegion``). Here is a snippet enabling the model:
    snippet: |
      phaseProperties
      {
        physicsModels
        {
          <subModel>
          {
            "<zoneName>"
            {
              type blackBodyRadiationFvPatchScalarField;
            }
          }
        }
      }

