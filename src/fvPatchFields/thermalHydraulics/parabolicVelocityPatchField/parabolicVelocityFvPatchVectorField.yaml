description: |-
  Boundary condition prescribing a parabolic fixedValue velocity profile on
  a patch, with an optional smooth temporal ramp-up.

  The patch field defines the velocity as:
  
  .. math::

      \mathbf{U}(\xi, t) = \mathbf{n} \, U_\text{max}(t)\,\bigl(1 - \xi^2\bigr),

  where

  * :math:`\mathbf{n}` is the (unit) direction of the imposed velocity,
  * :math:`\xi` is a local non-dimensional coordinate in the direction
    :math:`\mathbf{y}` across the patch face-centres, defined from
    ``boundBoxMin`` and ``boundBoxMax``,
  * :math:`U_\text{max}(t)` is a time-dependent maximum value that is ramped
    smoothly from 0 to ``maxValue`` over ``transitionPeriod`` using a
    half-cosine function.

  The parabolic profile is defined such that :math:`\xi = 0` at the centre
  of the bounding box and :math:`\xi = \pm 1` at the two ends in the
  direction of ``y``.

options:
  - key: maxValue
    type: scalar
    required: true
    description: |-
      Target maximum velocity magnitude at the patch centre, reached after the
      ``transitionPeriod``. During ramp-up, the instantaneous maximum value is
      given by

      .. math::

          U_\text{max}(t) =
            U_\text{max} \, \tfrac{1}{2}\bigl(1 - \cos(\pi t / T)\bigr),
      
      for :math:`t < T` and :math:`U_\text{max}(t) = U_\text{max}` for
      :math:`t \ge T`, where :math:`T =` ``transitionPeriod``.
  - key: n
    type: vector
    required: true
    description: |-
      Direction of the imposed velocity (will be normalised internally).
      The final velocity is aligned with this vector.
  - key: y
    type: vector
    required: true
    description: |-
      Direction used to construct the local 1-D coordinate for the parabolic
      profile (will be normalised internally). The coordinate is measured
      along this direction across the patch, based on the bounding box
      defined by ``boundBoxMin`` and ``boundBoxMax``.
  - key: transitionPeriod
    type: scalar
    required: true
    description: |-
      Time interval over which the maximum velocity is ramped smoothly from
      0 to ``maxValue`` using a half-cosine function. If a non-positive value
      is provided, it is internally reset to a small positive value (``SMALL``).
  - key: boundBoxMin
    type: vector
    required: true
    description: |-
      Minimum corner of the axis-aligned bounding box used to define the
      spatial extent of the parabolic profile in combination with
      ``boundBoxMax``. Typically chosen to encompass the inlet cross-section.
  - key: boundBoxMax
    type: vector
    required: true
    description: |-
      Maximum corner of the axis-aligned bounding box used to define the
      spatial extent of the parabolic profile. Together with ``boundBoxMin``,
      defines the centre and span in the ``y`` direction.


usage:
  - comment: |-
      Example of usage
    snippet: |-
      inlet
      {
          type            parabolicVelocity;
          maxValue        3;
          n               ( 1 0 0 );
          y               ( 0 1 0 );
          transitionPeriod 0;
          boundBoxMin     ( 0 0 -0.025334 );
          boundBoxMax     ( 0 0.41 0.025334 );
          value           uniform (0 0 0);
      }

notes:
  - |-
    The bounding box is not computed from the patch geometry at run-time in
    this implementation; instead, the user must provide ``boundBoxMin`` and
    ``boundBoxMax`` explicitly in the dictionary.
  - |-
    The directions ``n`` and ``y`` must both be non-zero; otherwise, a
    FatalError is raised in the dictionary constructor.




