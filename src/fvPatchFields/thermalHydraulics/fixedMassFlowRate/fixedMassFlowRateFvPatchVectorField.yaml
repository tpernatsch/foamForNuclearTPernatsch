description: |-
  Exactly the same as OpenFOAM's flowRateInletVelocity, but renormalizes the
  velocity to account for the porosity at the patch.

  The ``flowRate`` entry is a ``Function1`` of time, see Foam::Function1Types.

admonitions:
  - kind: warning
    body: |-
      Preliminary autogenerated documentation. Validate the description, options, and usage before publishing.
  - kind: note
    body: |-
      This model is selected solely by its runtime ``typeName`` and defines no additional options.

      - ``rhoInlet`` is required for the case of a mass flow rate, where the
        density field is not available at start-up
      - The value is positive into the domain (as an inlet)
      - May not work correctly for transonic inlets
      - Strange behaviour with potentialFoam since the U equation is not solved

options: []

usage:
  - comment: |-
      Usage already present in Header (verbatim):
    snippet: |-
      // Example of the boundary condition specification for a volumetric flow rate:
      <patchName>
      {
          type                fixedMassFlowRate;
          volumetricFlowRate  0.2;
          extrapolateProfile  yes;
          value               uniform (0 0 0);
      }

      // Example of the boundary condition specification for a mass flow rate:
      <patchName>
      {
          type                fixedMassFlowRate;
          massFlowRate        0.2;
          extrapolateProfile  yes;
          rho                 rho;
          rhoInlet            1.0;
          value               uniform (0 0 0);
      }

  - comment: |-
      The boundary condition is specified via the ``type`` entry in the ``boundaryField/<patchName>`` subdictionary of the ``<fieldName>`` file (located in ``<timeFolder>/``, or ``<timeFolder>/<regionName>/`` for multi-region cases, e.g. ``0/neutroRegion``). Here is a snippet enabling the boundary condition:
    snippet: |
      boundaryField
      {
          <patch1>
          {
              type mappedDarcyVelocity;
          }
      }
