description: |-
  Similar to OpenFOAM's flowRateInletVelocity, but renormalizes the
  velocity to account for the porosity at the patch.

  The ``flowRate`` entry is a ``Function1`` of time, see Foam::Function1Types.

admonitions:
  - kind: note
    body: |-
      - ``rhoInlet`` is required for the case of a mass flow rate, where the
        density field is not available at start-up
      - The value is positive into the domain (as an inlet)
      - May not work correctly for transonic inlets

options:
  - key: type
    type: word
    required: yes
    default:
    description: |-
      Type name: ``flowRateInletVelocity``

  - key: volumetricFlowRate
    type: Function1<scalar>
    required: choice
    default:
    description: |-
      Volumetric flow rate

  - key: massFlowRate
    type: Function1<scalar>
    required: choice
    default:
    description: |-
      Mass flow rate

  - key: rho
    type: word
    required: no
    default: rho
    description: |-
      Name of density field

  - key: rhoInlet
    type: scalar
    required: no
    default: VGREAT
    description: |-
      Density initialisation value

  - key: extrapolateProfile
    type: bool
    required: no
    default: false
    description: |-
      Flag to extrapolate the velocity profile from the interior

usage:
  - comment: |-
      Example of the boundary condition specification for a volumetric flow rate:
    snippet: |-
      <patchName>
      {
          type                fixedMassFlowRate;
          volumetricFlowRate  0.2;
          extrapolateProfile  yes;
          value               uniform (0 0 0);
      }
  - comment: |-
      Example of the boundary condition specification for a volumetmassric flow rate:
    snippet: |-
      <patchName>
      {
          type                fixedMassFlowRate;
          massFlowRate        0.2;
          extrapolateProfile  yes;
          rho                 rho;
          rhoInlet            1.0;
          value               uniform (0 0 0);
      }
