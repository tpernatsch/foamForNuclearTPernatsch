description: |-
  Time-dependent velocity inlet boundary condition that scales an initial
  patch velocity distribution according to a power-law “rundown” function.

  The boundary condition imposes a velocity of the form

  .. math::

      \mathbf{U}(t) = \mathbf{U}_0 \, (A + B (t - t_0))^C,

  where

  * :math:`\mathbf{U}_0` is the initial velocity field on the patch,
  * :math:`A` (``const``), :math:`B` (``coeff``), :math:`C` (``exp``) and
    :math:`t_0` (``startTime``) are user-specified coefficients.

  Internally, the initial field :math:`\mathbf{U}_0` is interpreted as the
  velocity at the current simulation time. If the simulation time is already
  greater than ``startTime`` at construction, the field is rescaled so that
  the subsequent time evolution follows the prescribed power law.


options:
  - key: value
    type: vectorField
    required: true
    description: |-
      Initial velocity field on the patch, read using the standard ``value`` entry. Interpreted as :math:`\mathbf{U}(t)` at the       current simulation time. The underlying field :math:`\mathbf{U}_0`      is reconstructed from this using the rundown function if ``time > startTime`` at construction.
  - key: const
    type: scalar
    required: true
    description: |-
      Parameter :math:`A` in the rundown expression ``(A + B (t - startTime))^exp``.
  - key: coeff
    type: scalar
    required: true
    description: |-
      Parameter :math:`B` in the rundown expression ``(A + B (t - startTime))^exp``.
  - key: exp
    type: scalar
    required: true
    description: |-
      Exponent :math:`C` in the rundown expression ``(A + B (t - startTime))^exp``.
  - key: startTime
    type: scalar
    required: true
    description: |-
      Reference time :math:`t_0` at which the rundown function begins.       For ``t <= startTime``, the patch field remains equal to the       initial value; for later times it evolves with the power law.

usage:
  - comment: |-
      Example: velocity rundown starting from a uniform inlet velocity,      decaying in time with a power-law from ``startTime`` onward.
    snippet: |-
      inlet
      {
          type        velocityRundown;

          // Initial inlet velocity at the current simulation time
          value       uniform (1 0 0);

          // Rundown parameters: U(t) = U0 * (A + B (t - startTime))^exp
          const       1.0;      // A
          coeff      -0.5;      // B
          exp         2.0;      // C
          startTime   0.0;      // t0

          // No need to specify U0 separately; it is inferred from 'value'.
      }

notes:
  - |-
    The constructor rescales ``U0_`` if the simulation is started or
    restarted at a time greater than ``startTime`` so the prescribed form
    holds from the current time onward.
