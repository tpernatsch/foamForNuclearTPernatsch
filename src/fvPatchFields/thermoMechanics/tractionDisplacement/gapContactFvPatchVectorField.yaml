description: |-
  Fixed traction boundary condition for the standard linear elastic, fixed
      coefficient displacement equation.

admonitions:
  - kind: warning
    body: |-
      Preliminary autogenerated documentation. Validate the description, options, and usage before publishing.

options:
  - key: offset
    type: scalar
    required: false
    default: '0.0'
    description: |
  - key: penaltyFactor
    type: scalar
    required: false
    default: '1e-2'
    description: |

usage:
  - comment: |-
      The model is specified via the ``type`` entry in the ``<dictName>/<subModel>/<zoneName>`` subdictionary of the ``phaseProperties`` file (located in ``constant/``, or ``constant/<regionName>`` for multi-region cases, e.g. ``constant/fluidRegion``). Here is a snippet enabling the model:
    snippet: |
      phaseProperties
      {
        physicsModels
        {
          <subModel>
          {
            "<zoneName>"
            {
              type gapContactFvPatchVectorField;
            }
          }
        }
      }

