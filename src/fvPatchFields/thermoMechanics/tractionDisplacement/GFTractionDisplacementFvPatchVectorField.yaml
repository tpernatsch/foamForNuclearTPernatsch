description: |-
  Fixed traction boundary condition for the standard linear elastic, fixed
  coefficient displacement equation. Modified from original version to allows
  for a user-selected reference temperature

admonitions:
  - kind: warning
    body: |-
      Preliminary autogenerated documentation. Please refer to the source code and tutorials for more reliable information.

options:
  - key: planeStress
    type: bool
    required: true
    default:
    description: |

usage:
  - comment: |-
      The boundary condition is specified via the ``type`` entry in the ``boundaryField/<patchName>`` subdictionary of the ``<fieldName>`` file (located in ``<timeFolder>/``, or ``<timeFolder>/<regionName>/`` for multi-region cases, e.g. ``0/neutroRegion``). Here is a snippet enabling the boundary condition:
    snippet: |
      boundaryField
      {
          <patch1>
          {
              type GFTractionDisplacement;
          }
      }
