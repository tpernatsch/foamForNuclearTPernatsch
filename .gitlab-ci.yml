image: ubuntu

stages:
  - build
  - test
  - deploy

# Merge request pipeline rule
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'


#==============================================================================*
#                                    Build
#==============================================================================*

build-job:
  stage: build
  script:
    - apt-get install make cmake gcc g++
    - wget -q -O - https://dl.openfoam.com/add-debian-repo.sh | bash
    - apt-get update
    - apt-get install openfoam2112-default
    - echo "source /usr/lib/openfoam/openfoam2112/etc/bashrc" >> ~/.bashrc
    - source ~/.bashrc
    # - git clone https://gitlab.com/foam-for-nuclear/GeN-Foam.git
    # - cd GeN-Foam/GeN-Foam
    # - ./Allwclean && ./Allwmake -j14


