#==============================================================================*
#                                    Deploy
#==============================================================================*

pages:
  stage: deploy

  script:
  - export DEBIAN_FRONTEND=noninteractive
  - apt-get update && apt-get -y install doxygen && apt-get -y install graphviz && apt-get -y install texlive-bibtex-extra
  - cd Documentation/doxygen/Doxygen && doxygen && cd ../../../
  - mv Documentation/doxygen/Doxygen/html/ public/

  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH


