# --- End concat all test.out

test-merge-results:
  stage: test
  # Need all the previous tests to be completed before running
  needs: [
    test-1D_boiling
    test-1D_CHF-imposedPower
    test-1D_CHF-imposedTemperature
    test-1D_HX-onePhase
    test-1D_HX-twoPhase
    test-1D_MSR_pointKinetics
    test-1D_PSBT_SC
    test-2D_cavityBoussinesq
    test-2D_KNS37-L22
    test-2D_FFTF
    test-2D_MSFR
    test-2D_onePhaseAndPointKineticsCoupling
    test-2D_voidMotionNoPhaseChange
    test-3D_SmallESFR
    test-Godiva_SN
  ]
  script:
    - cd Tutorials
    - ./concatAllTests
  artifacts:
    paths:
      - regressionResults


#==============================================================================*
#                                    Deploy
#==============================================================================*

pages:
  stage: deploy

  script:
  - export DEBIAN_FRONTEND=noninteractive
  - apt-get update && apt-get -y install doxygen && apt-get -y install graphviz && apt-get -y install texlive-bibtex-extra
  - cd Documentation/doxygen/Doxygen && doxygen && cd ../../../
  - mv Documentation/doxygen/Doxygen/html/ public/

  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH


