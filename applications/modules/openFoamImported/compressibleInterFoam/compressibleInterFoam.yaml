description: |-
  OpenFOAM-imported solver for two compressible, non-isothermal immiscible
  fluids using a VOF (volume of fluid) phase-fraction based interface capturing
  approach.

  The momentum and other fluid properties are of the "mixture" and a single
  momentum equation is solved.

  Either mixture or two-phase transport modelling may be selected. In the
  mixture approach a single laminar, RAS or LES model is selected to model the
  momentum stress. In the Euler-Euler two-phase approach separate laminar, RAS
  or LES selected models are selected for each of the phases.

