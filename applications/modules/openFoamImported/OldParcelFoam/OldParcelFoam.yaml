description: |-
  OpenFOAM-imported solver for transient, buoyant, turbulent, incompressible
  flow using the Boussinesq approximation, expanded with multi-group neutron
  diffusion, delayed neutron precursors and decay heat precursors for MSFR
  (Molten Salt Fast Reactor) applications.

  Flow, temperature and neutronics are fully coupled: the flow field
  transports delayed neutron precursors, decay heat precursors and dissolved
  fission product species, while temperature- and density-dependent
  cross-sections feed back into the neutron flux solution and the volumetric
  heat source driving the energy equation.

  Also includes Lagrangian tracking of nuclear (fission product) particles
  undergoing decay, decay heat release and thermophoresis, plus a surface
  film model for particle deposition, reusing the same fission-product cloud
  machinery as ``nuclearParcelFoam``.

