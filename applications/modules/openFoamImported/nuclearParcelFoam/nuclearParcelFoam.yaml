description: |-
  OpenFOAM-imported solver for transient, buoyant, turbulent, incompressible
  flow using the Boussinesq approximation, coupled to Lagrangian tracking of
  nuclear (fission product) particles.

  The particles undergo radioactive decay and release decay heat to the
  continuous phase, and are subject to a thermophoresis force. A surface film
  model captures particle deposition on walls. An incompressible radiation
  model is included for the continuous phase energy equation.

