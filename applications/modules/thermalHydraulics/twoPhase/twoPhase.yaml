

description: |-
  This class encapsulates a two‑fluid + 1 stationary‑structure Eulerian solver.

  Note that the usual ``PIMPLE`` sub-dictionary in ``system`` has been extended with a few keywords:

  .. list-table::
     :header-rows: 1
     :widths: 25 15 60

     * - Entry
       - Mandatory
       - Description

     * - ``partialEliminationMode``
       - N
       - Compatible with all ``momentumMode`` values.

         Partial elimination can improve convergence when inter‑phase drag is high and is generally safe to enable.

         Modes:

         - ``none``: no partial elimination.
         - ``explicit``: explicit adjustment based on partial elimination (as in many existing multiphase solvers in OpenFOAM).
         - ``implicit``: “true” partial elimination implemented by the authors, typically yielding faster convergence and fewer
           pressure linear-solver iterations than the explicit variant.

     * - ``momentumMode``
       - N
       - Influences how pressure‑equation fluxes from momentum terms are computed and affects all ``partialEliminationMode`` settings.

         Modes:

         - ``cellCentered``:
           traditional OpenFOAM approach; known to induce velocity oscillations across porous interfaces with sharp porosity jumps.
         - ``faceCentered`` (recommended):
           adapted from multiphase solvers; evaluates pressure‑equation terms at faces and reconstructs velocity from fluxes.
           Time derivative is Euler forward. Slightly more diffusive but reduces oscillations—completely in onePhase and
           partially/completely in twoPhase depending on ``oscillationLimiterFraction``.
         - ``cellCenteredFaceReconstruction``:
           mix of cell‑centered assembly and face‑centered velocity reconstruction; experimental; use discouraged.

     * - ``oscillationLimiterFraction``
       - Y
       - Effective only when ``momentumMode = faceCentered``.

         Experimental coefficient blending two velocity‑reconstruction strategies after the pressure solve:

         - ``1`` → fully accounts for cell‑center vs face porosity differences, eliminating oscillations/smearing at porous interfaces  
           (caveat: may trigger oscillations perpendicular to the flow if drag coefficients vary strongly).
         - ``0`` → disabled.
         - ``0 < value < 1`` → blended behavior; may reduce—but not necessarily eliminate—oscillations/smearing.  
           User experimentation is recommended.

     * - ``solveEnergy``
       - Y
       - Solve energy equation.

     * - ``solveFluidMechanics``
       - Y
       - Solve for fluid mechanics (pressure and velocity).

     * - ``correctUntilConvergence``
       - N
       - See :doc:`../../../../../cppapi/generated/solutionControl/customPimpleControl/customPimpleControl`.
         Defaults to ``false``.

     * - ``massTransferSafetyFactor``
       - N
       - Limits the allowable explicit mass‑transfer rate to keep phase fractions bounded.

         - ``1.0`` → standard limiting  
         - ``<1.0`` → more conservative/stable  
         - ``>1.0`` → only if transfer model is known to be well behaved

     * - ``maxTInterfaceDdt``
       - N
       - Caps ``|dT/dt|`` for interfacial temperature ``T.interface`` (units: K/s).

         Limits per‑step interface temperature change to ± ``maxTInterfaceDdt`` to avoid unstable jumps during phase‑change coupling.

     * - ``enthalpyStabilizationMode``
       - N
       - Stabilization of enthalpy ``he`` in cells with ``alpha < thermoResidualAlpha``.

         Modes:

         - ``source``: adds relaxation sources driving ``he → he_interface`` during the solve (smooth; recommended for coupled or steady convergence).
         - ``cutoff``: clamps ``he`` to ``he_interface`` after the solve in under‑resolved cells (simple, robust, non‑smooth).

     * - ``oscillationLimiterFraction``  (duplicate entry in original table)
       - N
       - Feature that removes velocity oscillations and/or smearing in the main flow direction.

         For structures with large porosity gradients (e.g., >0.5 between neighboring cells) or large gradients in drag tensor components,
         the feature may induce oscillations perpendicular to the main flow (not an issue in 1D).

         Only applicable to the face‑momentum‑based algorithm.

         This factor blends:

         - traditional faceMomentum velocity reconstruction (smearing/oscillations in main flow direction), and
         - moving‑phase‑fraction‑adjusted reconstruction (may induce transversal oscillations).

         ``0`` → pure traditional faceMomentum.




