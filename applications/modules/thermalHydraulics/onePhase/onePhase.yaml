
description: |-
  This class encapsulates a single fluid + 1 stationary structure (Eulerian solver). 
  The pressure field being solves for is *p_rgh* (pressure minus the gravitational head). 
  U (or U.(name of fluid))
  are the real velocities, not the Darcy velocities. In a porous structure, they
  represent the actual velocity of the fluid, and not the velocity multiplied by
  the fluid fraction. For instance, U will increase when transiting from a high-
  to a low-porosity region.
  Note that the solver makes use of the :doc:`customPimpleControl <../../../solutionControl/customPimpleControl/customPimpleControl>`, and is further with the options below.

options:
  - key: momentumMode
    type: word
    required: false
    default:
    description: |-
      Influences computation of pressure-equation momentum fluxes; affects all partialEliminationModes. Modes: cellCentered (traditional, may cause oscillations with sharp porosity gradients); faceCentered       (recommended; face-based evaluation with Euler-forward derivative, slightly more diffusive but reduces       oscillations depending on oscillationLimiterFraction); cellCenteredFaceReconstruction (hybrid,       experimental, not recommended).


  - key: solveEnergy
    type: word
    required: true
    default:
    description: Solve energy equation.

  - key: solveFluidMechanics
    type: word
    required: true
    default:
    description: Solve for fluid mechanics (pressure and velocity).

  - key: oscillationLimiterFraction
    type: word
    required: false
    default:
    description: Weight controlling removal of velocity oscillations or smearing in main flow direction for face-momentum-based algorithms; may induce perpendicular oscillations for large porosity or drag-tensor gradients; 0 gives traditional faceMomentum reconstruction.

  - key: pMin
    type: scalar
    required: false
    default:
    description: Lower limit for pressure

  - key: pRefCell
    type: scalar
    required: true
    default:
    description: Index of the cell where pressure is fixed in closes domains. Required only for closed domains.

  - key: pRefValue
    type: scalar
    required: true
    default:
    description: Pressure value at the pRefCell.  Required only for closed domains.

usage:
  - comment: |-
      ``customPimpleControl`` is used internally by a PIMPLE-based solver in
      the same way as ``pimpleControl``, with configuration provided via the
      ``PIMPLE`` sub-dictionary in ``fvSolution``.      Here is a minimal example showing the additional options
    snippet: |-
      PIMPLE
      {
          nOuterCorrectors    6;
          nCorrectors         12;
          correctUntilConvergence true;
          nNonOrthogonalCorrectors 0;
          momentumMode        faceCentered;
          oscillationLimiterFraction 0;
          solveEnergy         true;
          solveFluidMechanics true;
          pMin                    10000;
          pRefCell                780;
          pRefValue               100000;
      }



