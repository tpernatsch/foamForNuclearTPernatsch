
description: |-
  This class encapsulates a single fluid + 1 stationary structure (Eulerian solver).

  Note that the usual ``PIMPLE`` sub-dictionary in ``system`` has been extended with a few keywords:

  .. list-table::
     :header-rows: 1
     :widths: 25 15 60

     * - Entry
       - Mandatory
       - Description

     * - ``momentumMode``
       - N
       - Influences how pressure-equation fluxes from momentum terms are computed and affects all
         ``partialEliminationModes``.

         Modes:

         - ``cellCentered``:
           traditional OpenFOAM approach; known to induce velocity oscillations across porous interfaces
           with sharp porosity changes.
         - ``faceCentered`` (recommended):
           adapted from multiphase solvers; evaluates pressure-equation terms at faces and reconstructs
           velocity from fluxes. Time derivative is Euler forward. Slightly more diffusive than
           ``cellCentered`` but reduces oscillations—completely in onePhase and partially/completely in
           twoPhase depending on ``oscillationLimiterFraction``.
         - ``cellCenteredFaceReconstruction``:
           blend of cell-centered PDE assembly with face-centered velocity reconstruction. Experimental;
           use discouraged.

     * - ``solveEnergy``
       - Y
       - Solve energy equation.

     * - ``solveFluidMechanics``
       - Y
       - Solve for fluid mechanics (pressure and velocity).

     * - ``correctUntilConvergence``
       - N
       - See :doc:`../../../../../cppapi/generated/solutionControl/customPimpleControl/customPimpleControl`.
         Defaults to ``false``.

     * - ``oscillationLimiterFraction``
       - N
       - Feature that removes velocity oscillations and/or smearing in the main flow direction.
         Only applicable to the face-momentum-based algorithm.          If dealing with structures that have large porosity gradients (e.g. > 0.5 between consecutive
         cells) or large gradients in the structure drag tensor, this feature may induce velocity
         oscillations in directions perpendicular to the main flow direction (not an issue in 1D).          This factor weights the "traditional" faceMomentum velocity reconstruction (which always causes
         smearing/oscillations in the main flow direction) with a phase‑fraction‑adjusted reconstruction
         (which may induce perpendicular oscillations). If set to ``0``, it is pure traditional faceMomentum.



