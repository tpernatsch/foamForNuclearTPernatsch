description: |
  The `adjointDiffusionNeutronics` class is a solver for the steady-state adjoint
  multigroup diffusion equations used in reactor physics. 

  The adjoint diffusion equation solved by this class is:

  \[
  -∇·(D_g ∇φ_g) + Σ_r,g φ_g - ∑_(g'≠g) Σ_s,g'→g φ_g' = (1/keff) νΣ_f,g φ_g
  \]

  where:

  - `φ_g` is the adjoint neutron flux for energy group `g`
  - `D_g` is the diffusion coefficient for energy group `g`
  - `Σ_r,g` is the removal cross-section for energy group `g`
  - `Σ_s,g'→g` is the scattering cross-section from group `g'` to `g`
  - `νΣ_f,g` is the fission cross-section for energy group `g`
  - `keff` is the effective multiplication factor

  The solver also includes the treatment of delayed neutron precursors, modeled by:

  \[
  ∂C_i/∂t = β_i/Λ φ - λ_i C_i
  \]

  where:
  
  - `C_i` is the concentration of delayed neutron precursors for group `i`
  - `β_i` is the delayed neutron fraction for group `i`
  - `Λ` is the neutron generation time
  - `λ_i` is the decay constant for group `i`


options:
  - key: eigenvalueNeutronics
    type: boolean
    required: true
    description: Must be true. Enable eigenvalue mode for the adjoint diffusion solver.
  - key: externalSourceNeutronics
    type: boolean
    required: false
    default: false
    description: Enable external source mode for the adjoint diffusion solver.
  - key: energyGroups
    type: integer
    required: true
    description: Number of energy groups for the adjoint calculation.
  - key: precGroups
    type: integer
    required: true
    description: Number of delayed neutron precursor groups.


usage:
  - comment: |
      In the ``constant/neutronicsProperties`` file, for keff calculation in a
      critical reactor
    snippet: |
      eigenvalueNeutronics        true;

  - comment: |
      For a subcritical reactor driven by an external neutron source
    snippet: |
      eigenvalueNeutronics        false;
      externalSourceNeutronics    true;

