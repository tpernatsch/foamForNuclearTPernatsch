description: |
  The `adjointDiffusionNeutronics` class is a solver for the steady-state adjoint
  multigroup diffusion equations used in reactor physics. 

  The adjoint diffusion equation solved by this class is:

  $$
  \begin{align}
    -\nabla D_g \nabla \phi_g
    + \Sigma_{r,g} \phi_g
    - \sum_{g' \neq g} \Sigma_{s,g' \rightarrow g} \phi_{g'}
    = \frac{1}{k_{eff}} \nu \Sigma_{f,g} \phi_g 
    \quad \forall g \in [1; G]
  \end{align}
  $$

  The solver also includes the treatment of delayed neutron precursors, modeled by:

  $$
    \frac{\partial C_k}{\partial t} = \frac{\beta_k}{\Lambda} \phi - \lambda_k C_k
    \quad \forall k \in [1; N]
  $$

  where:
  
  \table
    Parameter        | Description
    $\phi_g$         | Neutron flux for the gth energy group
    $C_k$            | Concentration of the kth delayed neutron precursor group
    $D_g$            | Neutron diffusion coefficient for the gth energy group
    $k_{eff}$        | Effective multiplication factor
    $\beta_k$        | Delayed neutron fraction for the kth delayed neutron precursor group
    $\nu$            | Average number of neutrons per fission
    $\Sigma_{f,g}$   | Fission cross section for the gth energy group
    $\Sigma_{r,g}$   | Removal (disappearance) cross section for the gth energy group
    $\Sigma_{g' \rightarrow g}$ | Group-transfer cross section from the g'th to the gth energy group
    $\lambda_k$      | Decay constant for the kth delayed neutron precursor group
    $\Lambda$        | Neutron generation time
  \endtable


options:
  - key: eigenvalueNeutronics
    type: boolean
    required: true
    description: Must be true. Enable eigenvalue mode for the adjoint diffusion solver.
  - key: energyGroups
    type: integer
    required: true
    description: Number of energy groups for the adjoint calculation.
  - key: precGroups
    type: integer
    required: true
    description: Number of delayed neutron precursor groups.


usage:
  - comment: |
      In the ``constant/neutronicsProperties`` file, for keff calculation in a
      critical reactor
    snippet: |
      eigenvalueNeutronics        true;

