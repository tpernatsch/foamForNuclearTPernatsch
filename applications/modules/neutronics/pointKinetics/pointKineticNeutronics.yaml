description: |-
  Run-time selectable point-kinetic based neutronics solver [@RADMAN2022108891].
  This solver can be run in both solid and liquid fuel simulation [@HABTEMARIAM2024110237].
  It includes options for a time dependent external reactivity, and an external
  reactivity input coming from an FMU.

  The module solves the following point-kinetics equations:

  $$
  \begin{align}
      \frac{dP}{dt} & = \frac{\rho_{tot} - \zeta - \beta_{tot}}{\Lambda} P
          + \sum_{i=1}^N \lambda_i C_i + \frac{S}{\Lambda} \\
      \frac{dC_i}{dt} & = \frac{\beta_i}{\Lambda} P
          - \lambda_i C_i \quad \forall i \in [1; N]
  \end{align}
  $$

  $\rho_{tot}$: the total reactivity that can be decomposed as:

  $$
      \rho_{tot} =
          \begin{cases}
              \text{fast}    & -\alpha_D \ln\left( \frac{T_{fuel}}{T_{fuel}^{ref}} \right) \\
              \text{thermal} &  \alpha_D \left( \sqrt{T_{fuel}} - \sqrt{T_{fuel}^{ref}} \right)
          \end{cases}
          + \alpha_{fuel} (T_{fuel} - T_{fuel}^{ref})
          + \alpha_{clad} (T_{clad} - T_{clad}^{ref})
          + \alpha_{cool}^{T} (T_{cool} - T_{cool}^{ref})
          + \alpha_{cool}^{\rho} (\rho_{cool} - \rho_{cool}^{ref}) \\
          + \alpha_{struct} (T_{struct} - T_{struct}^{ref})
          + \alpha_{struct}^{mech} (T_{struct}^{mech} - T_{struct}^{mech,ref})
          + \rho_{driveline}
          + \rho_{GEM}
          + \rho_{boron}
          + \rho_{ext}
          + \rho_{ext}^{FMU}
  $$

  \table
      Parameter     | Description
      $P$           | Core power
      $C_i$         | Precursor power
      $S$           | Optional external source power
      $\beta_{tot}$ | Total delayed neutron fraction
      $\beta_i$     | Delayed neutron fraction for the ith delayed neutron precursor group
      $\lambda_i$   | Decay constant for the ith delayed neutron precursor group
      $\Lambda$     | Prompt generation lifetime
      $\zeta$       | Optional subcritical index
      $S$           | Optional external neutron source power
      $\alpha_D$             | Doppler feedback coefficient
      $\alpha_{fuel}$        | Fuel axial expansion feedback coefficient
      $\alpha_{clad}$        | Cladding temperature feedback coefficient
      $\alpha_{cool}^{T}$    | Coolant temperature feedback coefficient
      $\alpha_{cool}^{\rho}$ | Coolant density coefficient
      $\alpha_{struct}$      | Core radial expansion feedback coefficient
      $\alpha_{struct}^{mech}$ | Core expansion feedback coefficient from the mechanical mesh
      $\rho_{driveline}$     | Control rod driveline expansion reactivity contribution
      $\rho_{boron}$         | Boron concentration reactivity contribution
      $\rho_{ext}$           | External reactivity contribution
      $\rho_{ext}^{FMU}$     | External reactivity contribution from an FMU
      $\bold u$     | Velocity field (liquid fuel)
      $D_i$         | Precursor diffusion coefficient (liquid fuel)
  \endtable


  For liquid fuel reactors, the point-kinetics equations becomes [@HABTEMARIAM2024110237]:

  $$
  \begin{align}
      \frac{dP(t)}{dt} & = \frac{\rho_{tot} - \zeta - \beta_{tot}}{\Lambda} P(t)
          + \sum_{i=1}^N \lambda_i \hat C_i(t) \\
      \frac{d \tilde c_i(r,t)}{dt} + \bold u \cdot \nabla \tilde c_i(r,t) & = \nabla \cdot D_i \nabla \tilde c_i(r,t) + \frac{\beta_i}{\Lambda} P(t)
          - \lambda_i \tilde c_i(r,t) \quad \forall i \in [1; N]
  \end{align}
  $$

  A correct evaluation of the reactivity worth of delayed neutron precursors in
  MSRs, as well as of the impact of temperatures on reactivities, normally
  requires the knowledge of the adjoint flux. In the neutronics module, the field
  *oneGroupFlux* is used by the point kinetic solver for weighting temperatures,
  densities and precursors. When fluxes are not calculated via a spatial
  neutronics calculation, one has to manually provide the *oneGroupFlux* in
  *0/neutroRegion*. As an alternative, one can use the *initialOneGroupFluxByZone*
  keyword in *nuclearData* (see `1D_MSR_pointKinetics
  <https://gitlab.com/foamForNuclear/foamForNuclear/-/tree/master/tutorials/reactorCases/1D_MSR_pointKinetics/rootCase/constant/neutroRegion/nuclearData>`_). Please notice that:

  - If calculated fluxes are available in *neutroRegion*, these will be user to recalculate and overwrite *oneGroupFlux*.
  - If no fluxes are available, the neutronics sub-solver will use the provided *oneGroupFlux*
  - If the ``initialOneGroupFluxByZone`` keyword is used in *neutronicsProperties*, this will be used to overwrite *oneGroupFlux*

  **Liquid-fuel precursor initialization and restart**

  When `liquidFuel true` is set in *neutronicsProperties*, the point-kinetics
  sub-solver needs an equilibrium precursor distribution and the associated
  *precursor-equilibrium reactivity* ($\rho_{eq} = \beta_{tot} - \beta_{tot}^{eff}$,
  the reactivity offset that makes the circulating-fuel configuration critical at
  the start of the transient, where $\beta_{tot}^{eff}$ is the flux-weighted
  effective delayed fraction of the *flowing* precursors). These two concerns
  are handled separately:

  - *Reference feedback state* — the reference temperatures/densities used for
    the feedback reactivities and the ``precEquilibriumReactivity`` — is
    established at the first time step of *every* run and written to
    *reactorState* (*timeFolder/uniform/reactorState*). On a restart it is read
    back from *reactorState*, so it does not have to be recomputed. This mirrors
    the solid-fuel behaviour and is independent of `initPrecursorsLiquidFuel`.

  - *Equilibrium precursor distribution* is the expensive part and is
    (re)computed only when `initPrecursorsLiquidFuel true` is set in
    *nuclearData*. The resulting ``precPKStar*``/``precPK*`` fields are written
    to the time directory like any other field.

  This separation enables a run-once / restart-many workflow: perform the
  equilibrium initialization **once** with `initPrecursorsLiquidFuel true`, then
  restart every subsequent transient with `initPrecursorsLiquidFuel false`. The
  restart reuses the stored precursor fields and reads ``precEquilibriumReactivity``
  and the reference temperatures back from *reactorState*, skipping the costly
  equilibrium solve (which can take hours). Starting a liquid-fuel transient with
  the flag off before any initialization has ever been run is flagged with a
  warning, since the transient would then begin from a non-critical state.

  Two initialization modes are available for the equilibrium solve:

  *Standard steady-state solve* (default when `pseudoTimeSteps` is absent or
  zero): the precursor transport equation is solved once in steady state, i.e.
  $\partial C_i / \partial t = 0$, giving the equilibrium distribution for the
  initial flow and power field.

  *Pseudo-time-stepping* (activated by setting `pseudoTimeSteps > 0`): a
  backward-Euler pseudo-time loop advances the precursor equation over
  $N \times \Delta\tau$ seconds of pseudo-time. The scheme converges when
  $N \Delta\tau \gg 1/\lambda_{min}$. This approach handles stiff cases where
  the direct steady-state solve is ill-conditioned (e.g. very slow flows or
  high diffusion).

  **Fission source restriction**

  `fuelZones` lists the cell zones in which fission source terms for the
  delayed neutron precursors are active. Cells outside these zones contribute
  no precursor production, which is physically correct for loop-type MSRs
  where only part of the circuit is fissile. If `fuelZones` is absent, all
  cells are treated as fuel (backward-compatible default).

admonitions:
  - kind: warning
    body: |-
      Preliminary autogenerated documentation. Please refer to the source code and tutorials for more reliable information.

options:
  - key: fastNeutrons
    type: boolean
    required: true
    default:
    description: Flag to activate reactivity feedback for fast spectrum reactors. If true, use the ``-coeffDoppler * log(TFuel/TFuelRef)``, else use ``coeffDoppler * (sqrt(TFuel) - sqrt(TFuelRef))``
  - key: ScNo
    type: boolean
    required: false
    default: 1.0
    description: Schmidt number. Only used for liquid fuel
  - key: promptGenerationTime
    type: scalar
    required: true
    default:
    description: Prompt generation time
  - key: Beta
    type: list[scalar]
    required: true
    default:
    description: Belayed neutron fraction per precursor groups
  - key: lambda
    type: list[scalar]
    required: true
    default:
    description: Decay constant per precursor groups
  - key: feedbackCoeffTFuel
    type: scalar
    required: true
    default:
    description: Fuel temperature reactivity feedback coefficient
  - key: feedbackCoeffTClad
    type: scalar
    required: true
    default:
    description: Cladding temperature reactivity feedback coefficient
  - key: feedbackCoeffTCool
    type: scalar
    required: true
    default:
    description: Coolant temperature reactivity feedback coefficient
  - key: feedbackCoeffRhoCool
    type: scalar
    required: true
    default:
    description: Coolant density reactivity feedback coefficient
  - key: feedbackCoeffDoppler
    type: scalar
    required: true
    default:
    description: Fuel Doppler reactivity feedback coefficient
  - key: feedbackCoeffTStruct
    type: scalar
    required: true
    default:
    description: Structure temperature reactivity feedback coefficient
  - key: feedbackCoeffTStructMech
    type: scalar
    required: true
    default:
    description: Mechanical structure temperature reactivity feedback coefficient
  - key: fuelFeedbackZones
    type: list[word]
    required: true
    default:
    description: List of fuel cellZone names for which the fuel reactivity feedback is applied
  - key: coolantFeedbackZones
    type: list[word]
    required: true
    default:
    description: List of coolant cellZone names for which the coolant reactivity feedback is applied
  - key: structFeedbackZones
    type: list[word]
    required: true
    default:
    description: List of structure cellZone names for which the structure reactivity feedback is applied
  - key: drivelineFeedbackZones
    type: list[word]
    required: true
    default:
    description: List of driveline cellZone names for which the driveline reactivity feedback is applied
  - key: GEMSodiumLevelRef
    type: scalar
    required: false
    default:
    description: <description>
  - key: GEMFlowFaceZone
    type: word
    required: false
    default:
    description: <description>
  - key: GEMReactivityMap
    type: list[scalar, scalar]
    required: false
    default:
    description: <description>
  - key: absoluteDrivelineExpansionCoeff
    type: scalar
    required: false
    default:
    description: <description>
  - key: controlRodReactivityMap
    type: list[scalar, scalar]
    required: false
    default:
    description: <description>
  - key: liquidFuel
    type: boolean
    required: false
    default: false
    description: |-
      If true, enables liquid-fuel point-kinetics mode. Delayed neutron
      precursors are advected and diffused with the flowing fuel rather than
      being fixed in place. Must also be set in *neutronicsProperties*.
  - key: initPrecursorsLiquidFuel
    type: boolean
    required: false
    default: false
    description: |-
      If true, the equilibrium precursor spatial distribution and the
      ``precEquilibriumReactivity`` are (re)computed at the first time step of
      the run (i.e. when `timeIndex == startTimeIndex + 1`); the initialization
      mode depends on `pseudoTimeSteps` (zero/absent: standard steady-state
      solve; positive: pseudo-time-stepping). This is the expensive step. It is
      *not* required on restart: the reference feedback state and
      ``precEquilibriumReactivity`` are persisted to *reactorState* and the
      precursor fields to the time directory, so a transient can be restarted
      with this flag set to false to reuse the stored equilibrium. Only used
      for liquid fuel.
  - key: fuelZones
    type: list[word]
    required: false
    default: (all cells)
    description: |-
      List of cell zone names in which the fission source term for delayed
      neutron precursors is active. Only cells inside these zones contribute
      to precursor production. Cells outside (e.g. heat exchanger, pump,
      piping) correctly produce no precursors. If absent, all cells are
      treated as fuel, preserving backward compatibility with cases that do
      not distinguish fissile and non-fissile regions.
  - key: pseudoTimeSteps
    type: scalar or list[scalar]
    required: false
    default: 0
    description: |-
      Number of backward-Euler pseudo-time iterations used to initialize the
      precursor spatial distribution when `initPrecursorsLiquidFuel true`.
      A scalar applies the same count to all precursor groups; a list of
      length N assigns a per-group count. Set to 0 (or omit) to fall back to
      the standard steady-state solve. For convergence, the total pseudo-time
      $N \times \Delta\tau$ should satisfy $N \Delta\tau \gg 1/\lambda_{min}$.
  - key: pseudoTimeStepSize
    type: scalar or list[scalar]
    required: false
    default:
    description: |-
      Pseudo-time step size $\Delta\tau$ in seconds for the precursor
      initialization loop. A scalar applies to all groups; a list of length N
      gives per-group values. Required when `pseudoTimeSteps > 0`.
  - key: pseudoTimeRelaxation
    type: scalar or list[scalar]
    required: false
    default: 1.0
    description: |-
      Under-relaxation factor applied after each pseudo-time step:
      $C_i^{new} = \omega \, C_i^{solved} + (1-\omega) \, C_i^{old}$.
      A scalar applies to all groups; a list of length N gives per-group
      values. Use values less than 1 if the pseudo-time iterations oscillate.

usage:
  - comment: |-
      Example of time dependant source entries
    snippet: |-
      //- Optional time dependant external reactivity time profile
      externalReactivityTimeProfile
      {
          type        table;
          startTime   100;
          table       table
          (
              (   0   0)
              (   1   0.0005767131    ) //- i.e. 57.67131 pcm
          );
      }

      //- Optional time dependant boron reactivity time profile
      boronReactivityTimeProfile
      {
          type        table;
          table       table
          (
              (   100   0   )
              (   101   1e-5   )
          );
      }

  - comment: |-
      Optional external reactivity input from FMU in ``nuclearData`` file.
      The default initial value is 0.
    snippet: |-
      externalReactivityTimeProfile
      {
          type            fmi;
          nameFromFMU     gfExtReact;
          initialValue    0.0;
      }

  - comment: |-
      Optional external neutron source file ``externalSource``
    snippet: |-
      //- If true, add the external source to the point-kinetics equations
      isExternalSource    true;

      //- External source mode
      externalSourceMode  transient; // powerMonitoring // transient

      //- Beam energy per source particle
      beamEnergy          1.28160e-10; // [J/proton], 800 MeV/proton

      //- Neutron yield of the spallation of proton on heavy metal
      nuSource            15.5; // [neutron/proton]

      //- Optional external source input from FMU in externalSource file.
      //- The externalSourceMode must be set to transient. The default initial value
      //-is 1.
      externalSourceModulationNameFromFMU     gfExternalSourceMod;

      //- External modulation time profile (time, modulation factor)
      externalSourceModulationTimeProfile
      {
          type        table;
          startTime   150;
          table       table
          (
              (0      1)
              (20     2)
          );
      }
