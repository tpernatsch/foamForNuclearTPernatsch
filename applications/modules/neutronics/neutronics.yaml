description: |-
  Base class for neutronics models.
  Reference publications [@FIORINA201524] [@FIORINA201515226].

admonitions:
  - kind: warning
    body: |-
      Preliminary autogenerated documentation. Please refer to the source code and tutorials for more reliable information.

options:
  - key: mu
    type: dimensionedScalar
    required: false
    default: 0  [kg/(m·s)]
    description: |-
      Molecular dynamic viscosity of the fuel salt, used in the delayed
      neutron precursor diffusion coefficient:

      $$D_{prec} = \frac{\mu_{t} + \mu}{\rho_{cool} \, Sc}$$

      where $\mu_t$ is the turbulent dynamic viscosity and $Sc$ is the
      turbulent Schmidt number. For typical MSR operating conditions
      molecular diffusion is negligible compared to turbulent diffusion,
      so `mu` can often be set to zero. Provide a non-zero value when
      laminar or transitional flows are modelled. Looked up from
      *nuclearData* in the point-kinetics liquid-fuel solver.

usage:
